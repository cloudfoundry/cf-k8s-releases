{{- $backend := .Values.logCacheBackend }}
{{- $lc := $backend.logCache }}
{{- $syslog := $backend.syslogServer }}
{{- $addrs := list }}
{{- range $i := until (int $backend.replicas) }}
{{- $addrs = append $addrs (printf "log-cache-backend-%d.log-cache-headless.%s.svc.cluster.local:%v" $i $.Release.Namespace $lc.port) }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: log-cache-backend
  labels:
    app: log-cache
spec:
  serviceName: log-cache-headless
  replicas: {{ $backend.replicas }}
  selector:
    matchLabels:
      app: log-cache
  template:
    metadata:
      labels:
        app: log-cache
    spec:
      containers:
      {{- if $syslog.enabled }}
      - name: syslog-server
        image: {{ $syslog.image.repository }}:{{ default $.Chart.AppVersion $syslog.image.tag }}
        imagePullPolicy: {{ $syslog.image.imagePullPolicy }}
        ports:
        - containerPort: {{ $syslog.syslogPort }}
        env:
        - name: SYSLOG_PORT
          value: "{{ $syslog.syslogPort }}"
        - name: SYSLOG_IDLE_TIMEOUT
          value: "{{ $syslog.syslogIdleTimeout }}"
        - name: SYSLOG_TRIM_MESSAGE_WHITESPACE
          value: "{{ $syslog.syslogTrimMessageWhitespace }}"
        - name: SYSLOG_NON_TRANSPARENT_FRAMING
          value: "{{ $syslog.syslogNonTransparentFraming }}"
        {{- if $backend.certificateSecrets.syslog }}
        - name: SYSLOG_TLS_CERT_PATH
          value: /etc/ssl/certs/syslog/tls.crt
        - name: SYSLOG_TLS_KEY_PATH
          value: /etc/ssl/certs/syslog/tls.key
        {{- end }}
        {{- if $backend.certificateSecrets.syslogClientCA }}
        - name: SYSLOG_CLIENT_TRUSTED_CA_FILE
          value: /etc/ssl/certs/syslog-client-ca/ca.crt
        {{- end }}
        - name: LOG_CACHE_ADDR
          value: localhost:{{ $lc.port }}
        - name: CA_PATH
          value: /etc/ssl/certs/logcache/ca.crt
        - name: CERT_PATH
          value: /etc/ssl/certs/logcache/tls.crt
        - name: KEY_PATH
          value: /etc/ssl/certs/logcache/tls.key
        - name: METRICS_PORT
          value: "{{ $syslog.metrics.port }}"
        - name: METRICS_CA_FILE_PATH
          value: /etc/ssl/certs/metrics/ca.crt
        - name: METRICS_CERT_FILE_PATH
          value: /etc/ssl/certs/metrics/tls.crt
        - name: METRICS_KEY_FILE_PATH
          value: /etc/ssl/certs/metrics/tls.key
        - name: DEBUG_METRICS
          value: "{{ $syslog.metrics.debug }}"
        - name: PPROF_PORT
          value: "{{ $syslog.metrics.pprofPort }}"
        - name: USE_RFC339
          value: "{{ eq $syslog.logging.format.timestamp "rfc3339" }}"
        volumeMounts:
        {{- include "logcache.logcacheCertMount" . | nindent 8 }}
        {{- include "logcache.metricsCertMount" . | nindent 8 }}
        {{- if $backend.certificateSecrets.syslog }}
        - name: syslog
          mountPath: /etc/ssl/certs/syslog
          readOnly: true
        {{- end }}
        {{- if $backend.certificateSecrets.syslogClientCA }}
        - name: syslog-client-ca
          mountPath: /etc/ssl/certs/syslog-client-ca
          readOnly: true
        {{- end }}
        {{- if $backend.resources }}
        resources:
          {{- toYaml $backend.resources | nindent 10 }}
        {{- end }}
      {{- end }}
      - name: log-cache
        image: {{ $lc.image.repository }}:{{ default $.Chart.AppVersion $lc.image.tag }}
        imagePullPolicy: {{ $lc.image.imagePullPolicy }}
        ports:
        - containerPort: {{ $lc.port }}
        env:
        - name: ADDR
          value: ":{{ $lc.port }}"
        - name: MEMORY_LIMIT_PERCENT
          value: "{{ $lc.memoryLimitPercent }}"
        {{- if $lc.memoryLimitBytes }}
        - name: MEMORY_LIMIT_BYTES
          value: "{{ $lc.memoryLimitBytes | int64 }}"
        {{- end }}
        - name: MAX_PER_SOURCE
          value: "{{ $lc.maxPerSource | int64 }}"
        - name: INGRESS_BUFFER_SIZE
          value: "{{ $lc.ingressBufferSize | int64 }}"
        - name: INGRESS_BUFFER_READ_BATCH_SIZE
          value: "{{ $lc.ingressBufferReadBatchSize | int64 }}"
        - name: INGRESS_BUFFER_READ_BATCH_INTERVAL
          value: "{{ $lc.ingressBufferReadBatchInterval | int64 }}"
        - name: QUERY_TIMEOUT
          value: "{{ $lc.promql.queryTimeout }}"
        - name: TRUNCATION_INTERVAL
          value: "{{ $lc.truncationInterval }}"
        - name: PRUNES_PER_GC
          value: "{{ $lc.prunesPerGC | int64 }}"
        - name: CA_PATH
          value: /etc/ssl/certs/logcache/ca.crt
        - name: CERT_PATH
          value: /etc/ssl/certs/logcache/tls.crt
        - name: KEY_PATH
          value: /etc/ssl/certs/logcache/tls.key
        - name: NODE_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
        - name: NODE_ADDRS
          value: "{{ join "," $addrs }}"
        - name: METRICS_PORT
          value: "{{ $lc.metrics.port }}"
        - name: METRICS_CA_FILE_PATH
          value: /etc/ssl/certs/metrics/ca.crt
        - name: METRICS_CERT_FILE_PATH
          value: /etc/ssl/certs/metrics/tls.crt
        - name: METRICS_KEY_FILE_PATH
          value: /etc/ssl/certs/metrics/tls.key
        - name: DEBUG_METRICS
          value: "{{ $lc.metrics.debug }}"
        - name: PPROF_PORT
          value: "{{ $lc.metrics.pprofPort }}"
        - name: USE_RFC339
          value: "{{ eq $lc.logging.format.timestamp "rfc3339" }}"
        volumeMounts:
        {{- include "logcache.logcacheCertMount" . | nindent 8 }}
        {{- include "logcache.metricsCertMount" . | nindent 8 }}
        {{- if $backend.resources }}
        resources:
          {{- toYaml $backend.resources | nindent 10 }}
        {{- end }}
      {{- if $backend.nodeSelector }}
      nodeSelector:
        {{- toYaml $backend.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $backend.tolerations }}
      tolerations:
        {{- toYaml $backend.tolerations | nindent 8 }}
      {{- end }}
      volumes:
      - name: logcache
        secret:
          secretName: {{ required "logCacheBackend.certificateSecrets.logcacheTLS is required" $backend.certificateSecrets.logcacheTLS }}
      - name: metrics
        secret:
          secretName: {{ required "logCacheBackend.certificateSecrets.metrics is required" $backend.certificateSecrets.metrics }}
      {{- if and $syslog.enabled $backend.certificateSecrets.syslog }}
      - name: syslog
        secret:
          secretName: {{ $backend.certificateSecrets.syslog }}
      {{- end }}
      {{- if and $syslog.enabled $backend.certificateSecrets.syslogClientCA }}
      - name: syslog-client-ca
        secret:
          secretName: {{ $backend.certificateSecrets.syslogClientCA }}
      {{- end }}
{{- if $syslog.enabled }}
---
kind: Service
apiVersion: v1
metadata:
  name: log-cache-syslog
  labels:
    app: log-cache
spec:
  ports:
    - port: {{ $syslog.syslogPort }}
      name: syslog
      targetPort: {{ $syslog.syslogPort }}
      protocol: TCP
  selector:
    app: log-cache
{{- end }}
---
kind: Service
apiVersion: v1
metadata:
  name: log-cache
  labels:
    app: log-cache
spec:
  ports:
    - port: {{ $lc.port }}
      name: logcache
      targetPort: {{ $lc.port }}
  selector:
    app: log-cache
---
kind: Service
apiVersion: v1
metadata:
  name: log-cache-headless
  labels:
    app: log-cache
spec:
  clusterIP: None
  ports:
    - port: {{ $lc.port }}
      name: logcache
      targetPort: {{ $lc.port }}
  selector:
    app: log-cache
