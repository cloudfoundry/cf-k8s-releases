---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logcache-route-registrar-config
data:
  route-registrar.json: |-
    {
      "message_bus_servers": [
        {
          "host": "{{ tpl .Values.routeRegistrar.nats.address . }}"
        }
      ],
      "nats_mtls_config": {
        "enabled": true,
        "cert_path": "/etc/ssl/certs/route-registrar/tls.crt",
        "key_path": "/etc/ssl/certs/route-registrar/tls.key",
        "ca_path": "/etc/ssl/certs/route-registrar/ca.crt"
      },
      "host": "",
      "routes": [
        {
          "name": "log-cache-api",
          "tls_port": {{ .Values.logCacheApi.cfAuthProxy.proxyPort }},
          "registration_interval": "10s",
          "server_cert_domain_san": "log-cache.{{ .Values.logCacheBackend.systemDomain }}",
          "tags": {
            "component": "LogCache"
          },
          "uris": [
            "log-cache.{{ .Values.logCacheBackend.systemDomain }}"
          ]
        }
      ]
    }