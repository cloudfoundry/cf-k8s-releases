{{- if .Values.gorouter.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.gorouter.name }}-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
stringData:
  gorouter.yaml: |-
    {{- tpl (.Files.Get "files/gorouter.yaml") . | nindent 4 }}
  {{- if .Values.gorouter.htmlErrorTemplate }}
  error.html: |-
    {{- .Values.gorouter.htmlErrorTemplate | nindent 4 }}
  {{- end }}
{{- end }}
