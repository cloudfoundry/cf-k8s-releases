{{- if .Values.gorouter.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Values.gorouter.name }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Values.gorouter.name }}
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gorouter.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.gorouter.name }}
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.gorouter.podLabels }}
        {{- toYaml .Values.gorouter.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/gorouter-config: {{ include (print $.Template.BasePath "/gorouter-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.gorouter.podAnnotations }}
        {{- toYaml .Values.gorouter.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
      - name: gorouter-init
        image: mikefarah/yq:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          set -e
          yq '
            .nats.ca_certs = strenv(CA_CRT) |
            .nats.cert_chain = strenv(TLS_CRT) |
            .nats.private_key = strenv(TLS_KEY) |
            .tls_pem[0].cert_chain = strenv(TLS_CRT) |
            .tls_pem[0].private_key = strenv(TLS_KEY) |
            .ca_certs[0] = strenv(CA_CRT) |
            .client_ca_certs = strenv(CA_CRT) |
            .backends.cert_chain = strenv(TLS_CRT) |
            .backends.private_key = strenv(TLS_KEY)' /gorouter/gorouter.yaml > /tmp/gorouter.yaml
        volumeMounts:
          - name: "{{ .Values.gorouter.name }}-config"
            mountPath: /gorouter
          - name: tmp
            mountPath: /tmp
        env:
          - name: CA_CRT
            valueFrom:
              secretKeyRef:
                name: {{ required "gorouter.certificateSecret is required" .Values.gorouter.certificateSecret }}
                key: ca.crt
          - name: TLS_CRT
            valueFrom:
              secretKeyRef:
                name: {{ required "gorouter.certificateSecret is required" .Values.gorouter.certificateSecret }}
                key: tls.crt
          - name: TLS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ required "gorouter.certificateSecret is required" .Values.gorouter.certificateSecret }}
                key: tls.key
      containers:
        - name: gorouter
          image: {{ .Values.gorouter.image.repository }}:{{ default .Chart.AppVersion .Values.gorouter.image.tag }}
          imagePullPolicy: {{ .Values.gorouter.image.imagePullPolicy }}
          args:
          - -c
          - /tmp/gorouter.yaml
          volumeMounts:
            - name: "{{ .Values.gorouter.name }}-config"
              mountPath: /gorouter
            - name: tmp
              mountPath: /tmp
          {{- if .Values.gorouter.resources }}
          resources:
            {{- toYaml .Values.gorouter.resources | nindent 12 }}
          {{- end }}
        - name: udp-forwarder
          image: {{ .Values.udpForwarder.image.repository }}:{{ .Values.udpForwarder.image.tag }}
          imagePullPolicy: {{ .Values.udpForwarder.image.imagePullPolicy }}
          {{- if .Values.udpForwarder.resources }}
          resources:
            {{- toYaml .Values.udpForwarder.resources | nindent 12 }}
          {{- end }}
          env:
            - name: UDP_PORT
              value: "3457"
            - name: LOGGREGATOR_AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: LOGGREGATOR_AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: LOGGREGATOR_AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
            - name: LOGGREGATOR_AGENT_ADDR
              value: "{{ tpl .Values.udpForwarder.metronEndpoint.host . }}:{{ .Values.udpForwarder.metronEndpoint.port }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
          volumeMounts:
            - name: udp-forwarder
              mountPath: /etc/ssl/certs/udp-forwarder
      {{- if .Values.gorouter.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.gorouter.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.gorouter.tolerations }}
      tolerations:
        {{- toYaml .Values.gorouter.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: "{{ .Values.gorouter.name }}-config"
          secret:
            secretName: "{{ .Values.gorouter.name }}-config"
        - name: udp-forwarder
          secret:
            secretName: {{ required "udpForwarder.certificateSecret is required" .Values.udpForwarder.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Values.gorouter.name }}
  {{- if or .Values.commonAnnotations .Values.gorouter.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.gorouter.serviceAnnotations }}
    {{- toYaml .Values.gorouter.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Values.gorouter.name }}
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.gorouter.serviceLabels }}
    {{- toYaml .Values.gorouter.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
  - port: 443
    name: https
    targetPort: 443
    appProtocol: https
  selector:
    app.kubernetes.io/name: {{ .Values.gorouter.name }}
{{- end }}
