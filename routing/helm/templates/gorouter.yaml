{{- if .Values.gorouter.enabled }}
{{- $g := .Values.gorouter -}}
{{- $certs := dict "status-tls" (required "gorouter.certificateSecrets.statusTLS is required" $g.certificateSecrets.statusTLS) -}}
{{- range $key, $name := dict "trustedCAs" "trusted-ca" "clientCA" "client-ca" "backendsTLS" "backends-tls" "routeServicesTLS" "route-services-tls" "uaaCA" "uaa-ca" -}}
{{- if index $g.certificateSecrets $key -}}
{{- $_ := set $certs $name (index $g.certificateSecrets $key) -}}
{{- end -}}
{{- end -}}
{{- if $g.nats.tlsEnabled -}}
{{- $_ := set $certs "nats-tls" (required "gorouter.certificateSecrets.natsTLS is required when gorouter.nats.tlsEnabled is true" $g.certificateSecrets.natsTLS) -}}
{{- end -}}
{{- if $g.routingAPI.enabled -}}
{{- $_ := set $certs "routing-api-tls" (required "gorouter.certificateSecrets.routingAPITLS is required when gorouter.routingAPI.enabled is true" $g.certificateSecrets.routingAPITLS) -}}
{{- end -}}
{{- if and (not (kindIs "invalid" $g.prometheus.port)) $g.certificateSecrets.prometheusTLS -}}
{{- $_ := set $certs "prometheus-tls" $g.certificateSecrets.prometheusTLS -}}
{{- end -}}
{{- if $g.enableSSL -}}
{{- range $index, $secret := $g.certificateSecrets.serverTLS -}}
{{- $_ := set $certs (printf "server-%d" $index) (required "gorouter.certificateSecrets.serverTLS entries must name a secret" $secret) -}}
{{- end -}}
{{- end -}}
{{- range $index, $domain := $g.domains -}}
{{- $_ := set $certs (printf "domain-%d" $index) (required (printf "gorouter.certificateSecrets.domainCAs.%s is required" $domain.name) (index $g.certificateSecrets.domainCAs $domain.name)) -}}
{{- end -}}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Values.gorouter.name }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Values.gorouter.name }}
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.gorouter.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.gorouter.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.gorouter.name }}
        {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.gorouter.podLabels | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/gorouter-config: {{ include (print $.Template.BasePath "/gorouter-config.yaml") . | sha256sum }}
        {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.gorouter.podAnnotations | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ add .Values.gorouter.drainWait .Values.gorouter.drainTimeout 5 }}
      containers:
        - name: gorouter
          image: {{ .Values.gorouter.image.repository }}:{{ default .Chart.AppVersion .Values.gorouter.image.tag }}
          imagePullPolicy: {{ .Values.gorouter.image.imagePullPolicy }}
          {{- if .Values.gorouter.go.httplaxcontentlength }}
          env:
          - name: GODEBUG
            value: httplaxcontentlength=1
          {{- end }}
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /is-process-alive-do-not-use-for-loadbalancing
              port: {{ .Values.gorouter.status.tls.port }}
            initialDelaySeconds: {{ add .Values.gorouter.requestedRouteRegistrationIntervalInSeconds .Values.gorouter.loadBalancerHealthyThreshold }}
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: {{ .Values.gorouter.status.tls.port }}
          volumeMounts:
            - name: "{{ .Values.gorouter.name }}-config"
              mountPath: /gorouter
            {{- include "routing.gorouter.certMounts" $certs | nindent 12 }}
          {{- if .Values.gorouter.resources }}
          resources:
            {{- toYaml .Values.gorouter.resources | nindent 12 }}
          {{- end }}
        {{- include "routing.udpForwarder" (dict "root" $ "port" .Values.gorouter.metron.port) | nindent 8 }}
      {{- if .Values.gorouter.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.gorouter.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.gorouter.tolerations }}
      tolerations:
        {{- toYaml .Values.gorouter.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: "{{ .Values.gorouter.name }}-config"
          secret:
            secretName: "{{ .Values.gorouter.name }}-config"
        {{- range $name, $secret := $certs }}
        - name: gorouter-{{ $name }}
          secret:
            secretName: {{ $secret | quote }}
        {{- end }}
        - name: udp-forwarder
          secret:
            secretName: {{ required "udpForwarder.certificateSecret is required" .Values.udpForwarder.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Values.gorouter.name }}
  {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.gorouter.serviceAnnotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Values.gorouter.name }}
    {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.gorouter.serviceLabels | default dict) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
  {{- if not .Values.gorouter.disableHTTP }}
  - port: {{ .Values.gorouter.port }}
    name: http
    targetPort: {{ .Values.gorouter.port }}
    appProtocol: http
  {{- end }}
  {{- if .Values.gorouter.enableSSL }}
  - port: {{ .Values.gorouter.tlsPort }}
    name: https
    targetPort: {{ .Values.gorouter.tlsPort }}
    appProtocol: https
  {{- end }}
  {{- if not (kindIs "invalid" .Values.gorouter.prometheus.port) }}
  - port: {{ .Values.gorouter.prometheus.port }}
    name: prometheus
    targetPort: {{ .Values.gorouter.prometheus.port }}
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ .Values.gorouter.name }}
{{- end }}
