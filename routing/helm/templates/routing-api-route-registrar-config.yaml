{{- if .Values.routingAPI.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: routing-api-route-registrar-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
stringData:
  route-registrar.json: |-
    {
      "message_bus_servers": [
        {
          "host": "{{ tpl .Values.routeRegistrar.nats.address . }}"
        }
      ],
      "nats_mtls_config": {
        "enabled": true,
        "cert_path": "/etc/ssl/certs/route-registrar/tls.crt",
        "key_path": "/etc/ssl/certs/route-registrar/tls.key",
        "ca_path": "/etc/ssl/certs/route-registrar/ca.crt"
      },
      "host": "",
      "routes": [
        {
          "name": "routing-api",
          "tls_port": {{ .Values.routingAPI.mtlsPort }},
          "registration_interval": "10s",
          "server_cert_domain_san": "api.{{ .Values.routingAPI.systemDomain }}",
          "uris": ["api.{{ .Values.routingAPI.systemDomain }}/routing"]
        }
      ],
      "availability_zone": ""
    }
{{- end }}
