{{- if .Values.routingApi.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: routing-api
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: routing-api
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: routing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routing-api
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.routingApi.podLabels }}
        {{- toYaml .Values.routingApi.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/routing-api-config: {{ include (print $.Template.BasePath "/routing-api-config.yaml") . | sha256sum }}
        checksum/routing-api-route-registrar-config: {{ include (print $.Template.BasePath "/routing-api-route-registrar-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.routingApi.podAnnotations }}
        {{- toYaml .Values.routingApi.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      shareProcessNamespace: true
      initContainers:
        - name: routing-api-init
          image: mikefarah/yq:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              yq '.sqldb.ca_cert = strenv(DB_CA_CRT)' /routing-api/routing-api.yaml > /tmp/routing-api.yaml
          env:
            - name: DB_CA_CRT
              valueFrom:
                secretKeyRef:
                  name: {{ required "routingApi.sqldb.caCertificateSecret is required when routingApi.sqldb.skipSSLVerify is false" .Values.routingApi.sqldb.caCertificateSecret }}
                  key: ca.crt
          volumeMounts:
            - name: routing-api-config
              mountPath: /routing-api
            - name: tmpdir
              mountPath: /tmp
      containers:
        - name: routing-api
          image: {{ .Values.routingApi.image.repository }}:{{ default .Chart.AppVersion .Values.routingApi.image.tag }}
          imagePullPolicy: {{ .Values.routingApi.image.imagePullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
          - -config=/tmp/routing-api.yaml
          - -ip=$(POD_IP)
          {{- if .Values.routingApi.resources }}
          resources:
            {{- toYaml .Values.routingApi.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: routing-api
              mountPath: /etc/ssl/routing-api
            - name: uaa
              mountPath: /etc/ssl/uaa
            - name: locket
              mountPath: /etc/ssl/locket
            - name: routing-api-config
              mountPath: /routing-api
            {{- if not .Values.routingApi.sqldb.skipSSLVerify }}
            - name: tmpdir
              mountPath: /tmp
            {{- end }}
        - name: route-registrar
          image: {{ .Values.routeRegistrar.image.repository }}:{{ default .Chart.AppVersion .Values.routeRegistrar.image.tag }}
          imagePullPolicy: {{ .Values.routeRegistrar.image.imagePullPolicy }}
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if .Values.routeRegistrar.resources }}
          resources:
            {{- toYaml .Values.routeRegistrar.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: routing-api
              mountPath: /etc/ssl/certs/routing-api
            - name: etc-route-registrar
              mountPath: /etc/route-registrar-template
            - name: tmpdir
              mountPath: /tmp
      {{- if .Values.routingApi.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.routingApi.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.routingApi.tolerations }}
      tolerations:
        {{- toYaml .Values.routingApi.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: routing-api
          secret:
            secretName: {{ required "routingApi.certificateSecret is required" .Values.routingApi.certificateSecret }}
        - name: uaa
          secret:
            secretName: {{ required "routingApi.uaaCertificateSecret is required" .Values.routingApi.uaaCertificateSecret }}
        - name: locket
          secret:
            secretName: {{ required "routingApi.locketCertificateSecret is required" .Values.routingApi.locketCertificateSecret }}
        - name: routing-api-config
          secret:
            secretName: routing-api-config
        - name: etc-route-registrar
          configMap:
            name: routing-api-route-registrar-config
        - name: tmpdir
          emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: routing-api
  {{- if or .Values.commonAnnotations .Values.routingApi.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.routingApi.serviceAnnotations }}
    {{- toYaml .Values.routingApi.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: routing-api
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.routingApi.serviceLabels }}
    {{- toYaml .Values.routingApi.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: https
      port: 3001
      targetPort: 3001
  selector:
    app.kubernetes.io/name: routing-api
{{- end }}