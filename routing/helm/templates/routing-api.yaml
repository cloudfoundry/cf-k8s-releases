{{- if .Values.routingAPI.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: routing-api
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: routing-api
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.routingAPI.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: routing-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: routing-api
        {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.routingAPI.podLabels | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/routing-api-config: {{ include (print $.Template.BasePath "/routing-api-config.yaml") . | sha256sum }}
        checksum/routing-api-route-registrar-config: {{ include (print $.Template.BasePath "/routing-api-route-registrar-config.yaml") . | sha256sum }}
        {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.routingAPI.podAnnotations | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      shareProcessNamespace: true
      initContainers:
        - name: routing-api-init
          image: mikefarah/yq:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              yq '.uuid = strenv(POD_NAME){{ if .Values.routingAPI.certificateSecrets.databaseCA }} | .sqldb.ca_cert = load_str("/etc/ssl/certs/routing-api-database-ca/ca.crt"){{ end }}' /routing-api/routing-api.yaml > /tmp/routing-api.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: routing-api-config
              mountPath: /routing-api
              readOnly: true
            - name: tmpdir
              mountPath: /tmp
            {{- if .Values.routingAPI.certificateSecrets.databaseCA }}
            - name: routing-api-database-ca
              mountPath: /etc/ssl/certs/routing-api-database-ca
              readOnly: true
            {{- end }}
      containers:
        - name: routing-api
          image: {{ .Values.routingAPI.image.repository }}:{{ default .Chart.AppVersion .Values.routingAPI.image.tag }}
          imagePullPolicy: {{ .Values.routingAPI.image.imagePullPolicy }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
          - -config=/tmp/routing-api.yaml
          - -ip=$(POD_IP)
          - -logLevel={{ .Values.routingAPI.logLevel }}
          - -timeFormat=rfc3339
          {{- if .Values.routingAPI.authDisabled }}
          - -devMode
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.routingAPI.mtlsPort }}
          {{- if .Values.routingAPI.resources }}
          resources:
            {{- toYaml .Values.routingAPI.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: routing-api-server
              mountPath: /etc/ssl/certs/routing-api-server
              readOnly: true
            - name: routing-api-locket
              mountPath: /etc/ssl/certs/routing-api-locket
              readOnly: true
            {{- if .Values.routingAPI.certificateSecrets.uaaCA }}
            - name: routing-api-uaa
              mountPath: /etc/ssl/certs/routing-api-uaa
              readOnly: true
            {{- end }}
            - name: tmpdir
              mountPath: /tmp
        - name: route-registrar
          image: {{ .Values.routeRegistrar.image.repository }}:{{ default .Chart.AppVersion .Values.routeRegistrar.image.tag }}
          imagePullPolicy: {{ .Values.routeRegistrar.image.imagePullPolicy }}
          args:
            - -timeFormat=rfc3339
            - -logLevel={{ .Values.routeRegistrar.loggingLevel }}
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if .Values.routeRegistrar.resources }}
          resources:
            {{- toYaml .Values.routeRegistrar.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: route-registrar
              mountPath: /etc/ssl/certs/route-registrar
              readOnly: true
            - name: etc-route-registrar
              mountPath: /etc/route-registrar-template
              readOnly: true
            - name: tmpdir
              mountPath: /tmp
        {{- include "routing.udpForwarder" (dict "root" $ "port" .Values.routingAPI.metron.port) | nindent 8 }}
      {{- if .Values.routingAPI.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.routingAPI.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.routingAPI.tolerations }}
      tolerations:
        {{- toYaml .Values.routingAPI.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: udp-forwarder
          secret:
            secretName: {{ required "udpForwarder.certificateSecret is required" .Values.udpForwarder.certificateSecret }}
        - name: route-registrar
          secret:
            secretName: {{ required "routeRegistrar.certificateSecret is required" .Values.routeRegistrar.certificateSecret }}
        - name: routing-api-server
          secret:
            secretName: {{ required "routingAPI.certificateSecrets.mtlsServer is required" .Values.routingAPI.certificateSecrets.mtlsServer }}
        - name: routing-api-locket
          secret:
            secretName: {{ required "routingAPI.certificateSecrets.locketTLS is required" .Values.routingAPI.certificateSecrets.locketTLS }}
        {{- if .Values.routingAPI.certificateSecrets.databaseCA }}
        - name: routing-api-database-ca
          secret:
            secretName: {{ .Values.routingAPI.certificateSecrets.databaseCA }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.routingAPI.certificateSecrets.uaaCA }}
        - name: routing-api-uaa
          secret:
            secretName: {{ .Values.routingAPI.certificateSecrets.uaaCA }}
        {{- end }}
        - name: routing-api-config
          secret:
            secretName: routing-api-config
        - name: etc-route-registrar
          secret:
            secretName: routing-api-route-registrar-config
        - name: tmpdir
          emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: routing-api
  {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.routingAPI.serviceAnnotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: routing-api
    {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.routingAPI.serviceLabels | default dict) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: https
      port: {{ .Values.routingAPI.mtlsPort }}
      targetPort: {{ .Values.routingAPI.mtlsPort }}
    {{- if eq .Values.routingAPI.enabledAPIEndpoints "both" }}
    - name: http
      port: {{ .Values.routingAPI.port }}
      targetPort: {{ .Values.routingAPI.port }}
    {{- end }}
  selector:
    app.kubernetes.io/name: routing-api
{{- end }}
