{{- if .Values.tcpRouter.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  haproxy.conf: |+
    global
        log 127.0.0.1   syslog info
        maxconn 64000
        spread-checks 4
        stats socket /haproxy/haproxy.sock mode 600 level operator expose-fd listeners
        ssl-default-bind-options ssl-min-ver TLSv1.2

    defaults
        log global
        timeout connect 30000ms
        maxconn 64000
        {{- if gt (int .Values.tcpRouter.requestTimeoutInSeconds) 0 }}
        timeout client {{ mul .Values.tcpRouter.requestTimeoutInSeconds 1000 }}ms
        timeout server {{ mul .Values.tcpRouter.requestTimeoutInSeconds 1000 }}ms
        {{- end }}

    {{- if .Values.tcpRouter.enableNonTLSHealthChecks }}
    listen health_check_http_url
        mode http
        bind :{{ .Values.tcpRouter.healthCheckPort }}
        monitor-uri /health
        monitor fail if { env(IS_DRAINING) -m str true }
    {{- end }}

    listen health_check_https_url
        mode http
        bind :{{ .Values.tcpRouter.tlsHealthCheckPort }} ssl crt /tmp/tcp-health.pem
        monitor-uri /health
        monitor fail if { env(IS_DRAINING) -m str true }
{{- end }}
