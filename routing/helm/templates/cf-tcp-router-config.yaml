{{- if .Values.tcpRouter.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: cf-tcp-router-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
stringData:
  cf-tcp-router.yaml: |-
    oauth:
      token_endpoint: {{ tpl .Values.tcpRouter.uaa.tokenEndpoint . | quote }}
      port: {{ required "tcpRouter.uaa.tlsPort is required" .Values.tcpRouter.uaa.tlsPort }}
      client_name: "tcp_router"
      client_secret: {{ required "tcpRouter.oauthSecret is required" .Values.tcpRouter.oauthSecret | quote }}
      skip_ssl_validation: {{ .Values.tcpRouter.skipSSLValidation }}
      {{- if .Values.tcpRouter.certificateSecrets.uaaCA }}
      ca_certs: "/etc/ssl/certs/tcp-uaa/ca.crt"
      {{- end }}
    routing_api:
      uri: {{ tpl .Values.tcpRouter.routingAPI.uri . | quote }}
      port: {{ required "tcpRouter.routingAPI.port is required" .Values.tcpRouter.routingAPI.port }}
      auth_disabled: {{ .Values.tcpRouter.routingAPI.authDisabled }}
      client_cert_path: "/etc/ssl/certs/tcp-routing-api/tls.crt"
      ca_cert_path: "/etc/ssl/certs/tcp-routing-api/ca.crt"
      client_private_key_path: "/etc/ssl/certs/tcp-routing-api/tls.key"
    haproxy_pid_file: "/haproxy/haproxy.pid"
    isolation_segments: {{ .Values.tcpRouter.isolationSegments | toJson }}
    reserved_system_component_ports: {{ .Values.tcpRouter.reservedSystemComponentPorts | toJson }}
    drain_wait: {{ .Values.tcpRouter.drainWait }}s
    backend_tls:
      enabled: {{ .Values.tcpRouter.backendTLS.enabled }}
      {{- if .Values.tcpRouter.backendTLS.enabled }}
      ca_cert_path: "/etc/ssl/certs/tcp-backend-ca/ca.crt"
      {{- if .Values.tcpRouter.certificateSecrets.backendTLS }}
      client_cert_and_key_path: "/tmp/tcp-backend.pem"
      {{- end }}
      {{- end }}
    {{- if .Values.tcpRouter.certificateSecrets.frontendTLS }}
    frontend_tls_pem:
      {{- range .Values.tcpRouter.certificateSecrets.frontendTLS }}
      - enabled: true
        cert_path: "/etc/ssl/certs/tcp-frontend/{{ .name }}"
      {{- end }}
    {{- end }}
{{- end }}
