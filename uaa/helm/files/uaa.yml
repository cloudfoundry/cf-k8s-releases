{{- $u := .Values.uaa -}}
{{- $l := .Values.login -}}
{{- $uaaUrl := tpl $u.url . -}}
{{- $issuer := $u.issuer | default $uaaUrl -}}
{{- $loginHost := $uaaUrl | replace "://uaa." "://login." -}}
{{- $entityBaseUrl := $loginHost -}}
{{- if $l.saml.entityBaseUrl }}{{- $entityBaseUrl = printf "%s://%s" $l.protocol $l.saml.entityBaseUrl -}}{{- end -}}
{{- $entityId := $l.saml.entityid | default (regexReplaceAll "^https?://" $entityBaseUrl "") -}}
{{- $loginUrl := $l.url | default $entityBaseUrl -}}
{{- $authorizeUrl := printf "%s/oauth/authorize" $uaaUrl -}}
{{- if not .Values.encryption.activeKeyLabel }}{{- fail "encryption.activeKeyLabel is required" -}}{{- end -}}
{{- if not .Values.encryption.encryptionKeys }}{{- fail "encryption.encryptionKeys is required: a list of {label, passphrase} (passphrase >= 8 chars)" -}}{{- end -}}
{{- if and (not $u.jwt.policy.keys) (not $u.jwt.signingKey) }}{{- fail "uaa.jwt.policy.keys (with uaa.jwt.policy.activeKeyId) or the deprecated uaa.jwt.signingKey is required" -}}{{- end -}}
{{- if and $u.jwt.policy.keys (not $u.jwt.policy.activeKeyId) }}{{- fail "uaa.jwt.policy.activeKeyId is required when uaa.jwt.policy.keys is set" -}}{{- end -}}
{{- if and (not $l.saml.keys) (not $l.saml.serviceProviderKey) }}{{- fail "login.saml.keys (with login.saml.activeKeyId) or the deprecated login.saml.serviceProviderKey/serviceProviderCertificate is required" -}}{{- end -}}
{{- if and $l.saml.keys (not $l.saml.activeKeyId) }}{{- fail "login.saml.activeKeyId is required when login.saml.keys is set" -}}{{- end -}}
name: uaa
spring_profiles: {{ include "uaa.springProfiles" . }}
encryption:
  active_key_label: {{ .Values.encryption.activeKeyLabel | quote }}
  encryption_keys:
    {{- toYaml .Values.encryption.encryptionKeys | nindent 4 }}
disableInternalAuth: {{ $u.disableInternalAuth }}
disableInternalUserManagement: {{ $u.disableInternalUserManagement }}
issuer:
  uri: {{ $issuer | quote }}
require_https: true
https_port: {{ $u.ssl.port }}
assetBaseUrl: {{ $l.assetBaseUrl | quote }}
database:
  url: {{ include "uaa.dbUrl" . | quote }}
  username: {{ .Values.uaadb.user | quote }}
  password: {{ required "uaadb.password is required" .Values.uaadb.password | quote }}
  maxactive: {{ $u.database.maxConnections }}
  maxidle: {{ $u.database.maxIdleConnections }}
  minidle: {{ $u.database.minIdleConnections }}
  removeabandoned: {{ $u.database.removeAbandoned }}
  logabandoned: {{ $u.database.logAbandoned }}
  abandonedtimeout: {{ $u.database.abandonedTimeout | int }}
  testwhileidle: {{ $u.database.testWhileIdle }}
  {{- if not (kindIs "invalid" $u.database.caseInsensitive) }}
  caseinsensitive: {{ $u.database.caseInsensitive }}
  {{- end }}
authentication:
  enableUriEncodingCompatibilityMode: {{ $u.authentication.enableUriEncodingCompatibilityMode }}
  policy:
    lockoutAfterFailures: {{ $u.authentication.policy.lockoutAfterFailures }}
    countFailuresWithinSeconds: {{ $u.authentication.policy.countFailuresWithinSeconds | int }}
    lockoutPeriodSeconds: {{ $u.authentication.policy.lockoutPeriodSeconds | int }}
    global:
      lockoutAfterFailures: {{ $u.authentication.policy.global.lockoutAfterFailures }}
      countFailuresWithinSeconds: {{ $u.authentication.policy.global.countFailuresWithinSeconds | int }}
      lockoutPeriodSeconds: {{ $u.authentication.policy.global.lockoutPeriodSeconds | int }}
password:
  policy:
    minLength: {{ $u.password.policy.minLength }}
    maxLength: {{ $u.password.policy.maxLength }}
    requireUpperCaseCharacter: {{ $u.password.policy.requireUpperCaseCharacter }}
    requireLowerCaseCharacter: {{ $u.password.policy.requireLowerCaseCharacter }}
    requireDigit: {{ $u.password.policy.requireDigit }}
    requireSpecialCharacter: {{ $u.password.policy.requireSpecialCharacter }}
    expirePasswordInMonths: {{ $u.password.policy.expirePasswordInMonths }}
    global:
      minLength: {{ $u.password.policy.global.minLength }}
      maxLength: {{ $u.password.policy.global.maxLength }}
      requireUpperCaseCharacter: {{ $u.password.policy.global.requireUpperCaseCharacter }}
      requireLowerCaseCharacter: {{ $u.password.policy.global.requireLowerCaseCharacter }}
      requireDigit: {{ $u.password.policy.global.requireDigit }}
      requireSpecialCharacter: {{ $u.password.policy.global.requireSpecialCharacter }}
      expirePasswordInMonths: {{ $u.password.policy.global.expirePasswordInMonths }}
zones:
  internal:
    hostnames: {{ tpl ($u.zones.internal.hostnames | toJson) . }}
cors:
  enforceSystemZonePolicyInAllZones: {{ $u.cors.enforceSystemZonePolicyInAllZones }}
  {{- $corsDefault := include "uaa.corsSection" $u.cors.default }}
  {{- if $corsDefault }}
  default:
    {{- $corsDefault | nindent 4 }}
  {{- end }}
  {{- $corsXhr := include "uaa.corsSection" $u.cors.xhr }}
  {{- if $corsXhr }}
  xhr:
    {{- $corsXhr | nindent 4 }}
  {{- end }}
jwt:
  token:
    queryString:
      enabled: {{ $u.jwt.queryString.enabled }}
    revocable: {{ $u.jwt.revocable }}
    policy:
      accessTokenValiditySeconds: {{ $u.jwt.policy.accessTokenValiditySeconds | int }}
      refreshTokenValiditySeconds: {{ $u.jwt.policy.refreshTokenValiditySeconds | int }}
      global:
        accessTokenValiditySeconds: {{ $u.jwt.policy.global.accessTokenValiditySeconds | int }}
        refreshTokenValiditySeconds: {{ $u.jwt.policy.global.refreshTokenValiditySeconds | int }}
      {{- if $u.jwt.policy.activeKeyId }}
      activeKeyId: {{ $u.jwt.policy.activeKeyId | quote }}
      {{- end }}
      {{- if $u.jwt.policy.keys }}
      keys:
        {{- toYaml $u.jwt.policy.keys | nindent 8 }}
      {{- end }}
    {{- if $u.jwt.claims.exclude }}
    claims:
      exclude: {{ $u.jwt.claims.exclude | toJson }}
    {{- end }}
    refresh:
      restrict_grant: {{ $u.jwt.refresh.restrictGrant }}
      unique: {{ $u.jwt.refresh.unique }}
      rotate: {{ $u.jwt.refresh.rotate }}
      format: {{ $u.jwt.refresh.format }}
    {{- if $u.jwt.signingKey }}
    signing-key: {{ $u.jwt.signingKey | quote }}
    {{- end }}
    {{- if $u.jwt.verificationKey }}
    verification-key: {{ $u.jwt.verificationKey | quote }}
    {{- end }}
{{- $clients := dict }}
{{- range $id, $c := ($u.clients | default dict) }}
  {{- $cc := omit $c "scopes" }}
  {{- $_ := set $cc "id" $id }}
  {{- if $c.scopes }}{{- $_ := set $cc "scope" (join "," $c.scopes) }}{{- end }}
  {{- $_ := set $clients $id $cc }}
{{- end }}
{{- if and (not (hasKey $clients "admin")) $u.admin.clientSecret }}
  {{- $_ := set $clients "admin" (dict "authorized-grant-types" "client_credentials" "authorities" "clients.read,clients.write,clients.secret,uaa.admin,scim.read,scim.write,password.write" "id" "admin" "secret" $u.admin.clientSecret) }}
{{- end }}
oauth:
  clients:
    {{- toYaml $clients | nindent 4 }}
  user:
    authorities: {{ $u.user.authorities | toJson }}
  {{- if eq $l.protocol "https" }}
  authorize:
    ssl: true
  {{- end }}
  client:
    secret:
      policy:
        {{- toYaml $u.client.secret.policy | nindent 8 }}
scim:
  userids_enabled: {{ $u.scim.useridsEnabled }}
  user:
    override: {{ $u.scim.user.override }}
  {{- if $u.scim.users }}
  users:
  {{- range $u.scim.users }}
    - {{ printf "%s|%s|%s|%s|%s|%s|%s" .name (.password | default "") (.email | default .name) (.firstName | default "") (.lastName | default "") (.groups | default (list) | join ",") (.origin | default "uaa") | quote }}
  {{- end }}
  {{- end }}
  {{- if $u.scim.groups }}
  groups:
    {{- toYaml $u.scim.groups | nindent 4 }}
  {{- end }}
  {{- if $u.scim.externalGroups }}
  external_groups:
    {{- toYaml $u.scim.externalGroups | nindent 4 }}
  {{- end }}
{{- if $u.ldap.enabled }}
{{- $ld := $u.ldap }}
ldap:
  override: {{ $ld.override }}
  ldapdebug: "Ldap configured through UAA"
  profile:
    file: ldap/ldap-{{ $ld.profileType }}.xml
  ssl:
    skipverification: {{ $ld.ssl.skipverification }}
    tls: {{ $ld.ssl.tls | quote }}
    {{- if $ld.sslCertificate }}
    sslCertificate: {{ $ld.sslCertificate | quote }}
    {{- end }}
  base:
    url: {{ $ld.url | quote }}
    {{- if eq $ld.profileType "simple-bind" }}
    userDnPattern: {{ $ld.userDNPattern | quote }}
    userDnPatternDelimiter: {{ $ld.userDNPatternDelimiter | quote }}
    {{- else }}
    userDn: {{ $ld.userDN | quote }}
    password: {{ $ld.userPassword | quote }}
    searchBase: {{ $ld.searchBase | quote }}
    searchFilter: {{ $ld.searchFilter | quote }}
    {{- end }}
    {{- if eq $ld.profileType "search-and-compare" }}
    passwordAttributeName: {{ $ld.passwordAttributeName | quote }}
    passwordEncoder: {{ $ld.passwordEncoder | quote }}
    localPasswordCompare: {{ $ld.localPasswordCompare | quote }}
    {{- end }}
    mailAttributeName: {{ $ld.mailAttributeName | quote }}
    mailSubstitute: {{ $ld.mailSubstitute | quote }}
    mailSubstituteOverridesLdap: {{ $ld.mailSubstituteOverridesLdap }}
    referral: {{ $ld.referral | quote }}
  {{- if $ld.emailDomain }}
  emailDomain: {{ $ld.emailDomain | toJson }}
  {{- end }}
  {{- if $ld.attributeMappings }}
  attributeMappings:
    {{- toYaml $ld.attributeMappings | nindent 4 }}
  {{- end }}
  storeCustomAttributes: {{ $ld.storeCustomAttributes }}
  {{- if $ld.externalGroupsWhitelist }}
  externalGroupsWhitelist: {{ $ld.externalGroupsWhitelist | toJson }}
  {{- end }}
  groups:
    {{- if eq $ld.groups.profileType "no-groups" }}
    file: ldap/ldap-groups-null.xml
    {{- else }}
    file: ldap/ldap-{{ $ld.groups.profileType }}.xml
    {{- end }}
    searchBase: {{ $ld.groups.searchBase | quote }}
    groupRoleAttribute: {{ $ld.groups.groupRoleAttribute | quote }}
    groupSearchFilter: {{ $ld.groups.groupSearchFilter | quote }}
    searchSubtree: {{ $ld.groups.searchSubtree | quote }}
    maxSearchDepth: {{ $ld.groups.maxSearchDepth | quote }}
  addShadowUserOnLogin: {{ $ld.addShadowUserOnLogin }}
{{- end }}
servlet:
  session-store: {{ $u.servlet.sessionStore }}
  idle-timeout: {{ $u.servlet.idleTimeout | int }}
  session-cookie:
    max-age: {{ $u.servlet.sessionCookie.maxAge }}
    encode-base64: {{ $u.servlet.sessionCookie.encodeBase64 }}
rest:
  template:
    timeout: {{ $u.rest.template.timeout | int }}
    maxTotal: {{ $u.rest.template.maxTotal }}
    maxPerRoute: {{ $u.rest.template.maxPerRoute }}
    maxKeepAlive: {{ $u.rest.template.maxKeepAlive }}
    validateAfterInactivity: {{ $u.rest.template.validateAfterInactivity | int }}
    retryCount: {{ $u.rest.template.retryCount }}
{{- $links := deepCopy ($l.links | default dict) }}
{{- if $l.homeRedirect }}{{- $_ := set $links "homeRedirect" $l.homeRedirect }}{{- end }}
{{- if $links }}
links:
  {{- toYaml $links | nindent 2 }}
{{- end }}
logout:
  redirect:
    url: {{ $l.logout.redirect.url | quote }}
    parameter:
      disable: false
      {{- if $l.logout.redirect.parameter.whitelist }}
      whitelist: {{ $l.logout.redirect.parameter.whitelist | toJson }}
      {{- end }}
{{- $smtp := include "uaa.compact" $l.smtp }}
{{- if and $l.smtp.host (ne $smtp "{}") }}
smtp:
  {{- $smtp | nindent 2 }}
{{- end }}
{{- if $l.notifications.url }}
notifications:
  url: {{ $l.notifications.url | quote }}
{{- end }}
{{- if $u.csp.scriptSrc }}
csp:
  script-src: {{ $u.csp.scriptSrc | toJson }}
{{- end }}
{{- $ratelimit := include "uaa.compact" $u.rateLimiter.config }}
{{- if ne $ratelimit "{}" }}
ratelimit:
  {{- $ratelimit | nindent 2 }}
{{- end }}
{{- if $u.delete }}
delete:
  {{- toYaml $u.delete | nindent 2 }}
{{- end }}
{{- if $u.global.jwk }}
global:
  jwk:
    {{- toYaml $u.global.jwk | nindent 4 }}
{{- end }}
uaa:
  url: {{ $uaaUrl | quote }}
  shutdown:
    sleep: {{ $u.shutdown.sleep | int }}
  limitedFunctionality:
    statusFile: {{ $u.limitedFunctionality.statusFile | quote }}
    whitelist:
      endpoints: {{ $u.limitedFunctionality.whitelist.endpoints | toJson }}
      methods: {{ $u.limitedFunctionality.whitelist.methods | toJson }}
  oauth:
    redirect_uri:
      allow_unsafe_matching: {{ eq $u.client.redirectUri.matchingMode "legacy" }}
  {{- if $u.caCerts }}
  ca_certs: {{ $u.caCerts | toJson }}
  {{- end }}
login:
  url: {{ $loginUrl | quote }}
  idpDiscoveryEnabled: {{ $l.idpDiscoveryEnabled }}
  accountChooserEnabled: {{ $l.accountChooserEnabled }}
  aliasEntitiesEnabled: {{ $l.aliasEntitiesEnabled }}
  checkOriginEnabled: {{ $l.checkOriginEnabled }}
  allowOriginLoop: {{ $l.allowOriginLoop }}
  entityBaseURL: {{ $entityBaseUrl | quote }}
  entityID: {{ $entityId | quote }}
  selfServiceLinksEnabled: {{ $l.selfServiceLinksEnabled }}
  prompt:
    username:
      text: {{ $l.prompt.username.text | quote }}
    password:
      text: {{ $l.prompt.password.text | quote }}
  authorize:
    url: {{ $authorizeUrl | quote }}
  oauth:
    externalGroupsFromMappedAuthorities: {{ $l.oauth.externalGroupsFromMappedAuthorities }}
    {{- if $l.oauth.providers }}
    providers:
      {{- toYaml $l.oauth.providers | nindent 6 }}
    {{- end }}
  saml:
    socket:
      connectionManagerTimeout: {{ $l.saml.socket.connectionManagerTimeout | int }}
      soTimeout: {{ $l.saml.socket.soTimeout | int }}
    signMetaData: {{ $l.saml.signMetaData }}
    signRequest: {{ $l.saml.signRequest }}
    wantAssertionSigned: {{ $l.saml.wantAssertionSigned }}
    disableInResponseToCheck: {{ $l.saml.disableInResponseToCheck }}
    {{- if $l.saml.signatureAlgorithm }}
    signatureAlgorithm: {{ $l.saml.signatureAlgorithm | quote }}
    {{- end }}
    {{- if $l.saml.activeKeyId }}
    activeKeyId: {{ $l.saml.activeKeyId | quote }}
    {{- end }}
    {{- if $l.saml.keys }}
    keys:
      {{- toYaml $l.saml.keys | nindent 6 }}
    {{- end }}
    {{- if $l.saml.providers }}
    providers:
      {{- toYaml $l.saml.providers | nindent 6 }}
    {{- end }}
  {{- if $l.defaultIdentityProvider }}
  defaultIdentityProvider: {{ $l.defaultIdentityProvider | quote }}
  {{- end }}
  {{- $branding := include "uaa.compact" $l.branding }}
  {{- if ne $branding "{}" }}
  branding:
    {{- $branding | nindent 4 }}
  {{- end }}
  {{- if $l.saml.serviceProviderCertificate }}
  serviceProviderCertificate: {{ $l.saml.serviceProviderCertificate | quote }}
  {{- end }}
  {{- if $l.saml.serviceProviderKey }}
  serviceProviderKey: {{ $l.saml.serviceProviderKey | quote }}
  {{- end }}
  {{- if $l.saml.serviceProviderKeyPassword }}
  serviceProviderKeyPassword: {{ $l.saml.serviceProviderKeyPassword | quote }}
  {{- end }}
