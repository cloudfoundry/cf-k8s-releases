---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uaa-spring-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  application.yml: |-
  {{- tpl (.Files.Get "files/application.yml") . | nindent 4 }}
  log4j2.properties: |-
  {{- tpl (.Files.Get "files/log4j2.properties") . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: uaa-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
stringData:
  uaa.yml: |-
  {{- tpl (.Files.Get "files/uaa.yml") . | nindent 4 }}
