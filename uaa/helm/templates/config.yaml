---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uaa-spring-config
data:
  application.yml: |-
  {{- tpl (.Files.Get "files/application.yml") . | nindent 4 }}
  log4j2.properties: |-
  {{- tpl (.Files.Get "files/log4j2.properties") . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: uaa-config
stringData:
  uaa.yml: |-
  {{- tpl (.Files.Get "files/uaa.yml") . | nindent 4 }}
