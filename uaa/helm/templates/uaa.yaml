---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: uaa
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: uaa
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: uaa
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        checksum/uaa-route-registrar-config: {{ include (print $.Template.BasePath "/uaa-route-registrar-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: uaa
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.podLabels }}
        {{- toYaml .Values.podLabels | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: uaa
          image: {{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          ports:
            - containerPort: 8443
              name: https
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            periodSeconds: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: uaa-config
              mountPath: /uaa.yml
              subPath: uaa.yml
              readOnly: true
            - name: uaa-spring-config
              mountPath: /application.yml
              subPath: application.yml
              readOnly: true
            - name: uaa-spring-config
              mountPath: /log4j2.properties
              subPath: log4j2.properties
              readOnly: true
            - name: server-tls
              mountPath: /ssl
              readOnly: true
            {{- if include "uaa.needsPostgresCa" . }}
            - name: postgres-ca
              mountPath: /etc/ssl/certs/postgres
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
        - name: route-registrar
          image: {{ .Values.routeRegistrar.image.repository }}:{{ .Values.routeRegistrar.image.tag }}
          imagePullPolicy: {{ .Values.routeRegistrar.image.imagePullPolicy }}
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if .Values.routeRegistrar.resources }}
          resources:
            {{- toYaml .Values.routeRegistrar.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: route-registrar
              mountPath: /etc/ssl/certs/route-registrar
              readOnly: true
            - name: etc-route-registrar
              mountPath: /etc/route-registrar-template
            - name: tmp
              mountPath: /tmp
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: uaa-config
          secret:
            secretName: uaa-config
        - name: uaa-spring-config
          configMap:
            name: uaa-spring-config
        - name: server-tls
          secret:
            secretName: {{ required "certificateSecrets.serverTLS is required" .Values.certificateSecrets.serverTLS }}
        - name: route-registrar
          secret:
            secretName: {{ required "routeRegistrar.certificateSecret is required" .Values.routeRegistrar.certificateSecret }}
        {{- if include "uaa.needsPostgresCa" . }}
        - name: postgres-ca
          secret:
            secretName: {{ required "uaadb.caCertificateSecret is required for the verify TLS modes" .Values.uaadb.caCertificateSecret }}
        {{- end }}
        - name: etc-route-registrar
          configMap:
            name: uaa-route-registrar-config
        - name: tmp
          emptyDir: {}
---
kind: Service
apiVersion: v1
metadata:
  name: uaa
  {{- if or .Values.commonAnnotations .Values.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.serviceAnnotations }}
    {{- toYaml .Values.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: uaa
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.serviceLabels }}
    {{- toYaml .Values.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: 8443
      name: https
      targetPort: 8443
  selector:
    app.kubernetes.io/name: uaa
