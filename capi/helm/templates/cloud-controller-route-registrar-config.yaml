{{ if .Values.cloudController.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-controller-route-registrar-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  route-registrar.json: |-
    {
      "message_bus_servers": [
        {
          "host": "{{ tpl .Values.routeRegistrar.nats.address . }}"
        }
      ],
      "nats_mtls_config": {
        "enabled": true,
        "cert_path": "/etc/ssl/certs/route-registrar/tls.crt",
        "key_path": "/etc/ssl/certs/route-registrar/tls.key",
        "ca_path": "/etc/ssl/certs/route-registrar/ca.crt"
      },
      "host": "",
      "routes": [
        {
          "name": "api",
          "tls_port": {{ .Values.cloudController.config.publicTLS.port }},
          "registration_interval": "10s",
          "server_cert_domain_san": "{{ .Values.cloudController.config.externalHost }}.{{ .Values.cloudController.config.systemDomain }}",
          "tags": {
            "component": "CloudController"
          },
          "uris": [
            "{{ .Values.cloudController.config.externalHost }}.{{ .Values.cloudController.config.systemDomain }}"
          ]
        }
      ]
    }
{{ end }}
