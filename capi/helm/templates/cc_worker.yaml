{{ if .Values.cloudController.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-worker
  labels:
    app.kubernetes.io/name: cc-worker
spec:
  replicas: {{ .Values.ccWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cc-worker
  template:
    metadata:
      annotations:
        checksum/cloud-controller-config: {{ include (print $.Template.BasePath "/cloud-controller-config.yaml") . | sha256sum }}
        checksum/cc-shared: {{ include (print $.Template.BasePath "/cc-shared.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: cc-worker
    spec:
      terminationGracePeriodSeconds: {{ add .Values.cloudController.config.jobs.generic.worker_grace_period_seconds 1 }}
      containers:
        - name: cc-worker
          image: {{ .Values.cloudController.image.repository }}:{{ default .Chart.AppVersion .Values.cloudController.image.tag }}
          imagePullPolicy: {{ .Values.cloudController.image.imagePullPolicy }}
          {{- if .Values.cloudController.config.jobs.generic.number_of_worker_threads }}
          command: ["bundle", "exec", "rake", "jobs:generic[$(POD_NAME),{{ .Values.cloudController.config.jobs.generic.number_of_worker_threads }},{{ sub .Values.cloudController.config.jobs.generic.worker_grace_period_seconds 1 }}]"]
          {{- else }}
          command: ["bundle", "exec", "rake", "jobs:generic[$(POD_NAME)]"]
          {{- end }}
          envFrom:
            - secretRef:
                name: cc-shared
          env:
            - name: INDEX
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STORAGE_CLI_PATH
              value: /usr/local/bin/storage-cli
          {{- if .Values.ccWorker.resources }}
          resources:
            {{- toYaml .Values.ccWorker.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cloud-controller
              mountPath: /etc/ssl/certs/cloud-controller
            {{- if .Values.ccdb.caCertificateSecret }}
            - name: db-ca
              mountPath: /etc/ssl/certs/db-ca
              readOnly: true
            {{- end }}
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            - name: tmpdir
              mountPath: /tmp
      {{- if .Values.ccWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.ccWorker.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.ccWorker.tolerations }}
      tolerations:
        {{- toYaml .Values.ccWorker.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: cloud-controller
          secret:
            secretName: {{ required "cloudController.certificateSecret is required" .Values.cloudController.certificateSecret }}
        {{- if .Values.ccdb.caCertificateSecret }}
        - name: db-ca
          secret:
            secretName: {{ .Values.ccdb.caCertificateSecret }}
        {{- end }}
        - name: etc-cloud-controller
          secret:
            secretName: cloud-controller-config
        - name: tmpdir
          emptyDir: {}
{{ end }}
