{{ if .Values.cloudController.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-controller-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
stringData:
  config.yaml: |-
    {{- tpl (.Files.Get "files/cloud_controller_ng.yaml") . | nindent 4 }}
  cloud_controller_local_worker_override.yml: |-
    {{- if .Values.ccdb.max_connections_per_local_worker }}
    db:
      max_connections: {{ .Values.ccdb.max_connections_per_local_worker }}
    {{- else }}
    {}
    {{- end }}
  stacks.yaml: |-
    default: {{ .Values.cloudController.config.default_stack }}
    stacks:
    {{- range .Values.cloudController.config.stacks }}
    - description: {{ .description }}
      name: {{ .name }}
    {{- end }}
    deprecated_stacks: {{ .Values.cloudController.config.deprecated_stacks | toJson }}
  {{- $dirKeys := dict "droplets" "droplet_directory_key" "packages" "app_package_directory_key" "buildpacks" "buildpack_directory_key" "resource_pool" "resource_directory_key" }}
  {{- range $blob := list "droplets" "packages" "buildpacks" "resource_pool" }}
  {{- $b := index $.Values.cloudController.config $blob }}
  storage_cli_config_{{ $blob }}.json: |-
    {{- include "capi.storageCliConfig" (dict "provider" $b.blobstore_provider "cfg" ($b.connection_config | default dict) "resourceDir" (index $b (index $dirKeys $blob)) "root" $) | nindent 4 }}
  {{- end }}
{{ end }}
