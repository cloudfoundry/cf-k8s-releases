{{ if .Values.cloudController.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloud-controller-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
stringData:
  config.yaml: |-
    {{- tpl (.Files.Get "files/cloud_controller_ng.yaml") . | nindent 4 }}
  cloud_controller_local_worker_override.yml: |-
    {{- if .Values.ccdb.maxConnectionsPerLocalWorker }}
    db:
      max_connections: {{ .Values.ccdb.maxConnectionsPerLocalWorker }}
    {{- else }}
    {}
    {{- end }}
  stacks.yaml: |-
    default: {{ .Values.cloudController.config.defaultStack }}
    stacks:
    {{- range .Values.cloudController.config.stacks }}
    - description: {{ .description }}
      name: {{ .name }}
    {{- end }}
    deprecated_stacks: {{ .Values.cloudController.config.deprecatedStacks | toJson }}
  {{- $blobKeys := dict "droplets" "droplets" "packages" "packages" "buildpacks" "buildpacks" "resource_pool" "resourcePool" }}
  {{- $dirKeys := dict "droplets" "dropletDirectoryKey" "packages" "appPackageDirectoryKey" "buildpacks" "buildpackDirectoryKey" "resource_pool" "resourceDirectoryKey" }}
  {{- range $file := list "droplets" "packages" "buildpacks" "resource_pool" }}
  {{- $b := index $.Values.cloudController.config (index $blobKeys $file) }}
  storage_cli_config_{{ $file }}.json: |-
    {{- include "capi.storageCliConfig" (dict "provider" $b.blobstoreProvider "cfg" ($b.connectionConfig | default dict) "resourceDir" (index $b (index $dirKeys $file)) "root" $) | nindent 4 }}
  {{- end }}
{{ end }}
