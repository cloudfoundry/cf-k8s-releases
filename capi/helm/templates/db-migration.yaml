{{ if .Values.cloudController.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: capi-db-migration
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
spec:
  completions: 1
  parallelism: 1
  manualSelector: false
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      name: capi-db-migration
      {{- if or .Values.commonLabels .Values.cloudController.podLabels }}
      labels:
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.cloudController.podLabels }}
        {{- toYaml .Values.cloudController.podLabels | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or .Values.commonAnnotations .Values.cloudController.podAnnotations }}
      annotations:
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.cloudController.podAnnotations }}
        {{- toYaml .Values.cloudController.podAnnotations | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: capi-db-migration
          image: {{ .Values.cloudController.image.repository }}:{{ default .Chart.AppVersion .Values.cloudController.image.tag }}
          imagePullPolicy: {{ .Values.cloudController.image.imagePullPolicy }}
          command: ["/usr/bin/setup-db.sh"]
          env:
            - name: DB_LOG_LEVEL
              value: all
            - name: CLOUD_CONTROLLER_NG_CONFIG
              value: /etc/cloud-controller/config.yaml
          envFrom:
            - secretRef:
                name: cc-shared
          volumeMounts:
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            {{- include "capi.ccCertVolumeMounts" $ | nindent 12 }}
      volumes:
        {{- include "capi.ccCertVolumes" $ | nindent 8 }}
        - name: etc-cloud-controller
          secret:
            secretName: cloud-controller-config
{{- end }}
