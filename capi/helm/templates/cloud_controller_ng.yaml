{{ if .Values.cloudController.enabled }}
---
kind: Service
apiVersion: v1
metadata:
  name: cloud-controller
  {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.cloudController.serviceAnnotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: cloud-controller
    {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.cloudController.serviceLabels | default dict) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: {{ .Values.cloudController.config.tlsPort }}
      name: https
      targetPort: {{ .Values.cloudController.config.tlsPort }}
    - port: {{ .Values.cloudController.config.publicTLS.port }}
      name: https-ext
      targetPort: {{ .Values.cloudController.config.publicTLS.port }}
{{- if .Values.cloudController.config.promMetricsServerEnabled }}
    - port: {{ .Values.cloudController.config.promMetricsServerTlsPort }}
      name: https-metrics
      targetPort: {{ .Values.cloudController.config.promMetricsServerTlsPort }}
{{- end }}
  selector:
    app.kubernetes.io/name: cloud-controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cloud-controller
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: cloud-controller
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.cloudController.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-controller
        {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.cloudController.podLabels | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        kubectl.kubernetes.io/default-container: cloud-controller
        checksum/cloud-controller-config: {{ include (print $.Template.BasePath "/cloud-controller-config.yaml") . | sha256sum }}
        checksum/cloud-controller-route-registrar-config: {{ include (print $.Template.BasePath "/cloud-controller-route-registrar-config.yaml") . | sha256sum }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/nginx-config.yaml") . | sha256sum }}
        checksum/cc-shared: {{ include (print $.Template.BasePath "/cc-shared.yaml") . | sha256sum }}
        {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.cloudController.podAnnotations | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Native sidecars stop in reverse order: API, local workers, then Valkey.
      # Budget nginx drain + API shutdown (20s) + each worker's drain + 10s overhead.
      terminationGracePeriodSeconds: {{ add .Values.cloudController.config.nginxDrainTimeout 20 (mul .Values.cloudController.config.jobs.local.numberOfWorkers .Values.cloudController.config.jobs.local.localWorkerGracePeriodSeconds) 10 }}
      initContainers:
        - name: set-name-index
          image: mikefarah/yq:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              yq '.index = env(INDEX) | .name = "api"' /etc/cloud-controller/config.yaml > /tmp/config.yaml
          env:
            - name: INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
          volumeMounts:
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            - name: tmpdir
              mountPath: /tmp
        - name: valkey
          restartPolicy: Always
          image: {{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}
          imagePullPolicy: {{ .Values.valkey.image.imagePullPolicy }}
          command: ["valkey-server", "--unixsocket", "/var/run/valkey.sock", "--unixsocketperm", "777", "--port", "0", "--save", ""]
          startupProbe:
            exec:
              command: ["valkey-cli", "-s", "/var/run/valkey.sock", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          {{- if .Values.valkey.resources }}
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: var-run
              mountPath: /var/run
        {{- range $i := until (int .Values.cloudController.config.jobs.local.numberOfWorkers) }}
        - name: local-worker-{{ add $i 1 }}
          restartPolicy: Always
          image: {{ $.Values.localWorker.image.repository }}:{{ default $.Chart.AppVersion $.Values.localWorker.image.tag }}
          imagePullPolicy: {{ $.Values.localWorker.image.imagePullPolicy }}
          # No runtime deadline; start the kill timer only when kubelet sends TERM.
          command: ["timeout", "--foreground", "--preserve-status", "--kill-after={{ $.Values.cloudController.config.jobs.local.localWorkerGracePeriodSeconds }}s", "0", "bundle", "exec", "rake", "jobs:local[cc_api_worker.api.$(INDEX).{{ add $i 1 }}]"]
          env:
            - name: INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: STORAGE_CLI_PATH
              value: /usr/local/bin/storage-cli
            - name: CLOUD_CONTROLLER_NG_CONFIG
              value: /tmp/config.yaml
            - name: CLOUD_CONTROLLER_LOCAL_WORKER_OVERRIDE_CONFIG
              value: /etc/cloud-controller/cloud_controller_local_worker_override.yml
          envFrom:
            - secretRef:
                name: cc-shared
          {{- if $.Values.localWorker.resources }}
          resources:
            {{- toYaml $.Values.localWorker.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "capi.ccCertVolumeMounts" $ | nindent 12 }}
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            - name: var-run
              mountPath: /var/run
            - name: tmpdir
              mountPath: /tmp
        {{- end }}
        - name: cloud-controller
          restartPolicy: Always
          image: {{ .Values.cloudController.image.repository }}:{{ default .Chart.AppVersion .Values.cloudController.image.tag }}
          imagePullPolicy: {{ .Values.cloudController.image.imagePullPolicy }}
          # Bound this phase without preStop hooks, which run before sidecar ordering.
          command: ["timeout", "--foreground", "--preserve-status", "--kill-after=20s", "0", "bundle", "exec", "bin/cloud_controller", "-c", "/tmp/config.yaml"]
          startupProbe:
            exec:
              command:
                - ruby
                - -rsocket
                - -e
                - |
                  UNIXSocket.open('/var/run/cloud_controller.sock') do |socket|
                    socket.write("GET /healthz HTTP/1.0\r\n\r\n")
                    abort unless socket.gets&.split&.at(1) == '200'
                  end
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          envFrom:
            - secretRef:
                name: cc-shared
          env:
            - name: STORAGE_CLI_PATH
              value: /usr/local/bin/storage-cli
            - name: CLOUD_CONTROLLER_NG_CONFIG
              value: /tmp/config.yaml
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.cloudController.config.publicTLS.port }}
              scheme: HTTPS
          {{- if .Values.cloudController.resources }}
          resources:
            {{- toYaml .Values.cloudController.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "capi.ccCertVolumeMounts" $ | nindent 12 }}
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            - name: var-run
              mountPath: /var/run
            - name: tmpdir
              mountPath: /tmp
      containers:
        - name: route-registrar
          image: {{ .Values.routeRegistrar.image.repository }}:{{ .Values.routeRegistrar.image.tag }}
          imagePullPolicy: {{ .Values.routeRegistrar.image.imagePullPolicy }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.cloudController.config.publicTLS.port }}
              scheme: HTTPS
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if .Values.routeRegistrar.resources }}
          resources:
            {{- toYaml .Values.routeRegistrar.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: route-registrar
              mountPath: /etc/ssl/certs/route-registrar
              readOnly: true
            - name: etc-route-registrar
              mountPath: /etc/route-registrar-template
            - name: tmpdir
              mountPath: /tmp
        - name: nginx
          image: {{ .Values.nginx.image.repository }}:{{ default .Chart.AppVersion .Values.nginx.image.tag }}
          imagePullPolicy: {{ .Values.nginx.image.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          {{- if .Values.nginx.resources }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: var-run
              mountPath: /var/run
            - name: tmpdir
              mountPath: /tmp
            - name: mutual-tls
              mountPath: /etc/ssl/certs/mutual-tls
              readOnly: true
            - name: public-tls
              mountPath: /etc/ssl/certs/public-tls
              readOnly: true
            {{- if .Values.cloudController.config.promMetricsServerEnabled }}
            - name: prom-scraper
              mountPath: /etc/ssl/certs/prom-scraper
              readOnly: true
            {{- end }}
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/nginx_external_endpoints.conf
              subPath: nginx_external_endpoints.conf
            - name: nginx-config
              mountPath: /etc/nginx/nginx_server_mtls.conf
              subPath: nginx_server_mtls.conf
            - name: nginx-config
              mountPath: /etc/nginx/public_upload.conf
              subPath: public_upload.conf
            - name: nginx-config
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
            - name: nginx-config
              mountPath: /etc/nginx/nginx_server_public_tls.conf
              subPath: nginx_server_public_tls.conf
            {{- if .Values.cloudController.config.promMetricsServerEnabled }}
            - name: nginx-config
              mountPath: /etc/nginx/prom_scraper_mtls.conf
              subPath: prom_scraper_mtls.conf
            {{- end }}
      {{- if .Values.cloudController.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.cloudController.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.cloudController.tolerations }}
      tolerations:
        {{- toYaml .Values.cloudController.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "capi.ccCertVolumes" $ | nindent 8 }}
        - name: public-tls
          secret:
            secretName: {{ required "cloudController.certificateSecrets.publicTLS is required" .Values.cloudController.certificateSecrets.publicTLS }}
        {{- if .Values.cloudController.config.promMetricsServerEnabled }}
        - name: prom-scraper
          secret:
            secretName: {{ required "cloudController.certificateSecrets.promScraperTLS is required when promMetricsServerEnabled" .Values.cloudController.certificateSecrets.promScraperTLS }}
        {{- end }}
        - name: route-registrar
          secret:
            secretName: {{ required "routeRegistrar.certificateSecret is required" .Values.routeRegistrar.certificateSecret }}
        - name: etc-cloud-controller
          secret:
            secretName: cloud-controller-config
        - name: etc-route-registrar
          configMap:
            name: cloud-controller-route-registrar-config
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: var-run # Share unix sockets between containers.
          emptyDir: {}
        - name: tmpdir
          emptyDir: {}
{{- end }}
