{{ if .Values.cloudController.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-deployment-updater
  labels:
    app.kubernetes.io/name: cc-deployment-updater
spec:
  replicas: {{ .Values.ccDeploymentUpdater.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cc-deployment-updater
  template:
    metadata:
      annotations:
        checksum/cloud-controller-config: {{ include (print $.Template.BasePath "/cloud-controller-config.yaml") . | sha256sum }}
        checksum/cc-shared: {{ include (print $.Template.BasePath "/cc-shared.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: cc-deployment-updater
    spec:
      initContainers:
        - name: set-lock-owner
          image: {{ .Values.cloudController.image.repository }}:{{ default .Chart.AppVersion .Values.cloudController.image.tag }}
          imagePullPolicy: {{ .Values.cloudController.image.imagePullPolicy }}
          command:
            - sh
            - -c
            - sed "s|\${POD_NAME}|${POD_NAME}|g" /etc/cloud-controller/config.yaml > /tmp/config.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            - name: tmpdir
              mountPath: /tmp
      containers:
        - name: cc-deployment-updater
          image: {{ .Values.cloudController.image.repository }}:{{ default .Chart.AppVersion .Values.cloudController.image.tag }}
          imagePullPolicy: {{ .Values.cloudController.image.imagePullPolicy }}
          command: ["bundle", "exec", "rake", "deployment_updater:start"]
          envFrom:
            - secretRef:
                name: cc-shared
          env:
            - name: CLOUD_CONTROLLER_NG_CONFIG
              value: /tmp/config.yaml
          {{- if .Values.ccDeploymentUpdater.resources }}
          resources:
            {{- toYaml .Values.ccDeploymentUpdater.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cloud-controller
              mountPath: /etc/ssl/certs/cloud-controller
            {{- if .Values.ccdb.caCertificateSecret }}
            - name: db-ca
              mountPath: /etc/ssl/certs/db-ca
              readOnly: true
            {{- end }}
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            - name: tmpdir
              mountPath: /tmp
      {{- if .Values.ccDeploymentUpdater.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.ccDeploymentUpdater.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.ccDeploymentUpdater.tolerations }}
      tolerations:
        {{- toYaml .Values.ccDeploymentUpdater.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: cloud-controller
          secret:
            secretName: {{ required "cloudController.certificateSecret is required" .Values.cloudController.certificateSecret }}
        {{- if .Values.ccdb.caCertificateSecret }}
        - name: db-ca
          secret:
            secretName: {{ .Values.ccdb.caCertificateSecret }}
        {{- end }}
        - name: etc-cloud-controller
          secret:
            secretName: cloud-controller-config
        - name: tmpdir
          emptyDir: {}
{{ end }}
