{{ if .Values.cloudController.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cc-worker-clock
  labels:
    app.kubernetes.io/name: cc-worker-clock
spec:
  replicas: {{ .Values.ccWorkerClock.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cc-worker-clock
  template:
    metadata:
      annotations:
        checksum/cloud-controller-config: {{ include (print $.Template.BasePath "/cloud-controller-config.yaml") . | sha256sum }}
        checksum/cc-shared: {{ include (print $.Template.BasePath "/cc-shared.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: cc-worker-clock
    spec:
      containers:
        - name: cc-worker-clock
          image: {{ .Values.cloudController.image.repository }}:{{ default .Chart.AppVersion .Values.cloudController.image.tag }}
          imagePullPolicy: {{ .Values.cloudController.image.imagePullPolicy }}
          command: ["bundle", "exec", "rake", "clock:start"]
          envFrom:
            - secretRef:
                name: cc-shared
          env:
            - name: CLOUD_CONTROLLER_NG_CONFIG
              value: /etc/cloud-controller/config.yaml
          {{- if .Values.ccWorkerClock.resources }}
          resources:
            {{- toYaml .Values.ccWorkerClock.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "capi.ccCertVolumeMounts" $ | nindent 12 }}
            - name: etc-cloud-controller
              mountPath: /etc/cloud-controller
            - name: tmpdir
              mountPath: /tmp
      {{- if .Values.ccWorkerClock.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.ccWorkerClock.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.ccWorkerClock.tolerations }}
      tolerations:
        {{- toYaml .Values.ccWorkerClock.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "capi.ccCertVolumes" $ | nindent 8 }}
        - name: etc-cloud-controller
          secret:
            secretName: cloud-controller-config
        - name: tmpdir
          emptyDir: {}
{{ end }}
