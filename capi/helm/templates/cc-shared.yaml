{{ if .Values.cloudController.enabled }}
{{ $_ := required ".Values.ccdb.password must be provided" .Values.ccdb.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cc-shared
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
stringData:
  CLOUD_CONTROLLER_NG_CONFIG: /etc/cloud-controller/config.yaml
  RAILS_ENV: production
{{- if .Values.cloudController.config.experimental.use_yjit_compiler }}
  RUBYOPT: "--yjit"
{{- end }}
{{- end }}
