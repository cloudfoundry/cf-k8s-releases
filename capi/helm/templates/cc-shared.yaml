{{ if .Values.cloudController.enabled }}
{{ $_ := required ".Values.ccdb.password must be provided" .Values.ccdb.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cc-shared
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
stringData:
  RAILS_ENV: production
  {{- if .Values.cloudController.config.experimental.useYjitCompiler }}
  RUBYOPT: "--yjit"
  {{- end }}
{{- end }}
