{{ if .Values.tpsWatcher.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: tps-watcher
  labels:
    app: tps-watcher
spec:
  replicas: {{ .Values.tpsWatcher.replicas }}
  selector:
    matchLabels:
      app: tps-watcher
  template:
    metadata:
      labels:
        app: tps-watcher
      annotations:
        checksum/tps-watcher-config: {{ include (print $.Template.BasePath "/tps-watcher-config.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: set-instance-id
          image: busybox:latest
          command:
            - sh
            - -c
            - sed "s|\${POD_NAME}|${POD_NAME}|g" /tps-watcher/tps-watcher.json > /tmp/tps-watcher.json
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: tps-watcher-config
              mountPath: /tps-watcher
            - name: tmp
              mountPath: /tmp
      containers:
        - name: tps-watcher
          image: {{ .Values.tpsWatcher.image.repository }}:{{ default .Chart.AppVersion .Values.tpsWatcher.image.tag }}
          imagePullPolicy: {{ .Values.tpsWatcher.image.imagePullPolicy }}
          args: ["-configPath", "/tmp/tps-watcher.json"]
          {{- if .Values.tpsWatcher.resources }}
          resources:
            {{- toYaml .Values.tpsWatcher.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tps-watcher-bbs
              mountPath: /etc/ssl/certs/tps-watcher-bbs
              readOnly: true
            - name: tps-watcher-cc
              mountPath: /etc/ssl/certs/tps-watcher-cc
              readOnly: true
            - name: tps-watcher-config
              mountPath: /tps-watcher
            - name: tmp
              mountPath: /tmp
      {{- if .Values.tpsWatcher.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.tpsWatcher.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tpsWatcher.tolerations }}
      tolerations:
        {{- toYaml .Values.tpsWatcher.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tps-watcher-bbs
          secret:
            secretName: {{ required "tpsWatcher.certificates.bbs is required" .Values.tpsWatcher.certificates.bbs }}
        - name: tps-watcher-cc
          secret:
            secretName: {{ required "tpsWatcher.certificates.cc is required" .Values.tpsWatcher.certificates.cc }}
        - name: tps-watcher-config
          configMap:
            name: tps-watcher-config
{{- end }}
