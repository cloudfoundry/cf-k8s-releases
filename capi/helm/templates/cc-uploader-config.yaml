{{ if .Values.cloudController.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cc-uploader-config
data:
  cc-uploader.json: |-
    {
      "log_level": {{ .Values.ccUploader.config.logLevel | quote }},
      "dropsonde_port": {{ .Values.ccUploader.config.dropsondePort }},
      "lager_config": {
        "log_level": {{ .Values.ccUploader.config.logLevel | quote }},
        "time_format": {{ .Values.ccUploader.config.logging.format.timestamp | quote }}
      },
      {{- if .Values.ccUploader.config.debugPort }}
      "debug_server_config": {
        "debug_address": "{{ .Values.ccUploader.config.debugBindAddr }}:{{ .Values.ccUploader.config.debugPort }}"
      },
      {{- end }}
      {{- if .Values.ccUploader.config.cc.jobPollingIntervalInSeconds }}
      "job_polling_interval_in_seconds": "{{ .Values.ccUploader.config.cc.jobPollingIntervalInSeconds }}s",
      {{- end }}
      "cc_ca_cert": "/etc/ssl/certs/cc-uploader-client/ca.crt",
      "cc_client_cert": "/etc/ssl/certs/cc-uploader-client/tls.crt",
      "cc_client_key": "/etc/ssl/certs/cc-uploader-client/tls.key",
      "mutual_tls": {
        "listen_addr": "{{ .Values.ccUploader.config.bindAddr }}:{{ .Values.ccUploader.config.httpsPort }}",
        "ca_cert": "/etc/ssl/certs/cc-uploader-server/ca.crt",
        "server_cert": "/etc/ssl/certs/cc-uploader-server/tls.crt",
        "server_key": "/etc/ssl/certs/cc-uploader-server/tls.key"
      }
    }
{{ end }}
