{{ if .Values.cloudController.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: cc-uploader
  labels:
    app: cc-uploader
spec:
  replicas: {{ .Values.ccUploader.replicas }}
  selector:
    matchLabels:
      app: cc-uploader
  template:
    metadata:
      labels:
        app: cc-uploader
      annotations:
        checksum/cc-uploader-config: {{ include (print $.Template.BasePath "/cc-uploader-config.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ add (mul .Values.ccUploader.config.cc_uploader_drain_timeout_in_minutes 60) 1 }}
      containers:
        - name: cc-uploader
          image: {{ .Values.ccUploader.image.repository }}:{{ default .Chart.AppVersion .Values.ccUploader.image.tag }}
          imagePullPolicy: {{ .Values.ccUploader.image.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.ccUploader.config.https_port }}
          {{- if .Values.ccUploader.resources }}
          resources:
            {{- toYaml .Values.ccUploader.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cc-uploader
              mountPath: /etc/ssl/certs/cc-uploader
            - name: cc-uploader-config
              mountPath: /cc-uploader
      {{- if .Values.ccUploader.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.ccUploader.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.ccUploader.tolerations }}
      tolerations:
        {{- toYaml .Values.ccUploader.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: cc-uploader
          secret:
            secretName: {{ required "ccUploader.certificateSecret is required" .Values.ccUploader.certificateSecret }}
        - name: cc-uploader-config
          configMap:
            name: cc-uploader-config
---
kind: Service
apiVersion: v1
metadata:
  name: cc-uploader
  labels:
    app: cc-uploader
spec:
  ports:
    - port: {{ .Values.ccUploader.config.https_port }}
      targetPort: {{ .Values.ccUploader.config.https_port }}
      name: tcp
      protocol: TCP
  selector:
    app: cc-uploader
{{ end }}
