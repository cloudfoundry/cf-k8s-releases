{{- $general := .Values.cloudController.config.nginx_rate_limit_general }}
# Per-path rate-limit zones. Bad zone config can expose unwanted paths or override upload settings.
{{- range .Values.cloudController.config.nginx_rate_limit_zones }}
location {{ .location }} {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
  limit_req zone={{ .name }} burst={{ .burst }} nodelay;
}
{{- end }}

# Standard CF API paths
location = / {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
{{- if $general }}
  limit_req zone=all burst={{ $general.burst }} nodelay;
{{- end }}
}

location = /v3 {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
{{- if $general }}
  limit_req zone=all burst={{ $general.burst }} nodelay;
{{- end }}
}

location /v3/ {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
{{- if $general }}
  limit_req zone=all burst={{ $general.burst }} nodelay;
{{- end }}
}

{{- if .Values.cloudController.config.temporary_enable_v2 }}

location = /v2 {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
{{- if $general }}
  limit_req zone=all burst={{ $general.burst }} nodelay;
{{- end }}
}

location /v2/ {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
{{- if $general }}
  limit_req zone=all burst={{ $general.burst }} nodelay;
{{- end }}
}

location ~ /v2/apps/[^/]+/bits {
  if ($arg_application_path) { return 422; }

  include public_upload.conf;

  upload_pass_args on;
  upload_pass_form_field "^resources$";
}

location ~ /v2/buildpacks/.*/bits {
  if ($arg_buildpack_path) { return 422; }

  include public_upload.conf;
}

location ~ /v2/apps/[^/]+/droplet/upload {
  if ($arg_droplet_path) { return 422; }

  include public_upload.conf;
}
{{- end }}

location = /v2/info {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
{{- if $general }}
  limit_req zone=all burst={{ $general.burst }} nodelay;
{{- end }}
}

location ~ /v3/packages/.*/upload {
  if ($arg_bits_path) { return 422; }

  upload_pass_form_field "^resources$";
  include public_upload.conf;
}

location ~ /v3/buildpacks/.*/upload {
  if ($arg_bits_path) { return 422; }

  include public_upload.conf;
}

location ~ /v3/droplets/.*/upload {
  if ($arg_bits_path) { return 422; }

  include public_upload.conf;
}

# Pass altered request body to a backend
location @cc_uploads {
  proxy_pass http://cloud_controller;
}

# Public /internal path (OAuth, in-app): ssh-proxy uses it for `cf ssh`.
location ~ ^/internal/apps/[^/]+/ssh_access/ {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
{{- if $general }}
  limit_req zone=all burst={{ $general.burst }} nodelay;
{{- end }}
}

location = /healthz {
  access_log                  /dev/stdout main;
  proxy_buffering             off;
  proxy_set_header            Host $host;
  proxy_set_header            X-Real_IP $remote_addr;
  proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_redirect              off;
  proxy_connect_timeout       10;
  proxy_pass                  http://cloud_controller;
}

location /nginx_status {
  stub_status on;

  access_log  /dev/stdout main;

  allow 127.0.0.1;
  deny all;
}

# Deny by default: anything not explicitly allowed above.
location / {
  access_log  /dev/stdout main;
  default_type application/json;
  return 404 '{"errors":[{"detail":"Unknown request","title":"CF-NotFound","code":10000}]}';
}
