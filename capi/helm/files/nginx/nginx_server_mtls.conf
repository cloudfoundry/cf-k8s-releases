ssl_ciphers DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_certificate        /etc/ssl/certs/mutual-tls/tls.crt;
ssl_certificate_key    /etc/ssl/certs/mutual-tls/tls.key;
ssl_client_certificate /etc/ssl/certs/mutual-tls/ca.crt;
ssl_verify_client      on;
ssl_verify_depth       2;
ssl_protocols          TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;
