ssl_ciphers DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
{{- $publicCerts := ternary "/etc/ssl/certs/cloud-controller-public" "/etc/ssl/certs/cloud-controller" (ne .Values.cloudController.publicTLSCertificateSecret "") }}
ssl_certificate        {{ $publicCerts }}/tls.crt;
ssl_certificate_key    {{ $publicCerts }}/tls.key;

ssl_protocols          TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;