load_module modules/ngx_http_upload_module.so;

user  vcap;

pid       /var/run/nginx.pid;
error_log /dev/stderr {{ .Values.cloudController.config.nginxErrorLogLevel }};

worker_processes auto;

events {
  worker_connections  8192;
  use epoll;
}

http {
  include       mime.types;
  default_type  text/html;
  server_tokens off;

  log_format main escape={{ .Values.cloudController.config.nginxAccessLogEscaping }} '{{ .Values.cloudController.config.nginxAccessLogFormat }}';

  access_log  /dev/stdout main;

  proxy_hide_header X-USER-GUID;  #user guid header should not be forwarded to client

  sendfile             on;  #enable use of sendfile()
  sendfile_max_chunk   1M;  #make sure not to block on fast clients reading large files
  tcp_nopush           on;
  tcp_nodelay          on;  #disable nagel's algorithm

  keepalive_timeout    {{ .Values.cloudController.config.serverKeepaliveTimeout }} 20;

{{- if .Values.cloudController.config.nginxRateLimitGeneral }}
  limit_req_zone $http_authorization zone=all:10m rate={{ .Values.cloudController.config.nginxRateLimitGeneral.limit }};
{{- end }}
{{- range .Values.cloudController.config.nginxRateLimitZones }}
  limit_req_zone $http_authorization zone={{ .name }}:10m rate={{ .limit }};
{{- end }}
  limit_req_status 429;

  client_max_body_size {{ .Values.cloudController.config.clientMaxBodySize }}; #already enforced upstream/but doesn't hurt.

  client_body_temp_path /tmp/client_body_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  upstream cloud_controller {
    server unix:/var/run/cloud_controller.sock;
    keepalive {{ mul .Values.cloudController.config.puma.workers .Values.cloudController.config.puma.maxThreads }};
    keepalive_timeout {{ .Values.cloudController.config.nginxUpstreamKeepaliveTimeout }}s;
  }

  upstream cloud_controller_metrics {
    server unix:/var/run/cloud_controller_metrics.sock;
  }

  # This block ensures the endpoints it serves are handled by mutual TLS.
  # Refer to the 'return 403' statement in the http block to see how we secure those endpoints.
  server {
    listen {{ .Values.cloudController.config.tlsPort }} ssl;
    include nginx_server_mtls.conf;

    server_name  _;
    server_name_in_redirect off;
{{- if gt (int .Values.cloudController.config.requestTimeoutInSeconds) 0 }}

    proxy_send_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
    proxy_read_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
{{- end }}

    proxy_buffering             off;
    proxy_set_header            Host $host;
    proxy_set_header            X-Real_IP $remote_addr;
    proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect              off;
    proxy_connect_timeout       10;

    location /internal/v4/ {
      proxy_pass http://cloud_controller;
    }

    location /internal/v5/ {
      proxy_pass http://cloud_controller;
    }

    # serve ssh route here so the call can be authenticated via mutual TLS.
    location ~ /internal/apps/.*/ssh_access/.* {
      proxy_pass http://cloud_controller;
    }

    location ~ /internal/v3/staging/.*/build_completed {
      proxy_pass http://cloud_controller;
    }

    location ~ /internal/v4/(droplets|buildpack_cache)/.*/upload {
      # Allow download the droplets and buildpacks
      if ($request_method = GET){
        proxy_pass http://cloud_controller;
      }

      # Allow large uploads
      client_max_body_size {{ .Values.cloudController.config.appBitsMaxBodySize }}; #already enforced upstream/but doesn't hurt.

      # Pass altered request body to this location
      upload_pass   @cc_uploads;

      # Store files to this directory
      upload_store /tmp/staged_droplet_uploads;

      # Allow uploaded files to be read only by user
      upload_store_access user:r;

      # Set specified fields in request body
      upload_set_form_field "droplet_path" $upload_tmp_path;

      #on any error, delete uploaded files.
      upload_cleanup 400-505;
    }

    # Pass altered request body to a backend
    location @cc_uploads {
      proxy_pass http://cloud_controller;
    }
  }

  # This block handles public endpoints over TLS
  server {
    listen {{ .Values.cloudController.config.publicTLS.port }} ssl;
    include nginx_server_public_tls.conf;

    server_name  _;
    server_name_in_redirect off;
{{- if gt (int .Values.cloudController.config.requestTimeoutInSeconds) 0 }}

    proxy_send_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
    proxy_read_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
{{- end }}

    include nginx_external_endpoints.conf;
  }

{{- if .Values.cloudController.config.promMetricsServerEnabled }}
  server {
    listen {{ .Values.cloudController.config.promMetricsServerTlsPort }} ssl;
    include prom_scraper_mtls.conf;

    server_name  _;
    server_name_in_redirect off;
{{- if gt (int .Values.cloudController.config.requestTimeoutInSeconds) 0 }}

    proxy_send_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
    proxy_read_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
{{- end }}

    proxy_buffering             off;
    proxy_set_header            Host $host;
    proxy_set_header            X-Real_IP $remote_addr;
    proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect              off;
    proxy_connect_timeout       10;

    location /internal/v4/metrics {
      proxy_pass http://cloud_controller_metrics;
    }
  }
{{- end }}

{{- if not .Values.cloudController.config.temporaryDisableNonTlsEndpoints }}

  # This block handles public endpoints over non-TLS secured HTTP
  # This is required for backwards compatibility during a rolling-deploy
  server {
    listen    {{ .Values.cloudController.config.externalPort }};

    server_name  _;
    server_name_in_redirect off;
{{- if gt (int .Values.cloudController.config.requestTimeoutInSeconds) 0 }}

    proxy_send_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
    proxy_read_timeout          {{ .Values.cloudController.config.requestTimeoutInSeconds }};
{{- end }}

    include nginx_external_endpoints.conf;
  }
{{- end }}
}
