ccDeploymentUpdater:
  replicas: 1
  resources: ~
  nodeSelector: ~
  tolerations: ~

ccWorker:
  replicas: 1
  resources: ~
  nodeSelector: ~
  tolerations: ~

ccUploader:
  replicas: 1
  resources: ~
  certificateSecret: ""
  image:
    repository: ghcr.io/cloudfoundry/k8s/cc-uploader
    tag: ""
    imagePullPolicy: IfNotPresent
  nodeSelector: ~
  tolerations: ~
  config:
    https_port: 9091
    bind_addr: 0.0.0.0
    debug_bind_addr: 127.0.0.1
    debug_port: ~
    log_level: info
    logging:
      format:
        timestamp: rfc3339
    dropsonde_port: 3457
    cc:
      job_polling_interval_in_seconds: ~
    cc_uploader_drain_timeout_in_minutes: 15

ccWorkerClock:
  replicas: 1
  resources: ~
  nodeSelector: ~
  tolerations: ~

cloudController:
  enabled: false
  replicas: 1
  resources: ~
  certificateSecret: ""
  publicTLSCertificateSecret: ""
  image:
    repository: ghcr.io/cloudfoundry/k8s/cloud-controller
    tag: ""
    imagePullPolicy: IfNotPresent
  nodeSelector: ~
  tolerations: ~
  config:
    system_domain: cf.127-0-0-1.nip.io
    system_domain_organization: system
    external_host: api
    external_protocol: https
    external_port: 9022
    tls_port: 9023
    public_tls:
      port: 9024
    prom_metrics_server_tls_port: 9025
    prom_metrics_server_enabled: false
    internal_service_hostname: cloud-controller.{{ .Release.Namespace }}.svc.cluster.local
    temporary_disable_non_tls_endpoints: false
    request_timeout_in_seconds: 900
    server_keepalive_timeout: 100
    nginx_upstream_keepalive_timeout: 15
    nginx_error_log_level: error
    nginx_access_log_escaping: default
    nginx_access_log_format: '$host - [$time_local] "$request" $status $bytes_sent "$http_referer" "$http_user_agent" $proxy_add_x_forwarded_for vcap_request_id:$upstream_http_x_vcap_request_id response_time:$upstream_response_time'
    nginx_rate_limit_general: ~
    nginx_rate_limit_zones: []
    client_max_body_size: "15M"
    app_bits_max_body_size: "2048M"
    app_bits_upload_grace_period_in_seconds: 1200
    experimental:
      use_yjit_compiler: false
    readiness_port:
      cloud_controller_worker: -1
      clock: -1
      deployment_updater: -1
    puma:
      automatic_worker_count: false
      workers: 2
      max_threads: 10
      max_db_connections_per_process: 10
    allow_docker_root_user: true
    additional_allowed_process_users: []
    temporary_disable_deployments: false
    development_mode: false
    deployment_updater:
      update_frequency_in_seconds: 5
    app_domains:
      - apps.127-0-0-1.nip.io
      - name: apps.internal
        internal: true
    system_hostnames: [api, proxy, uaa, login, blobstore, log-cache, doppler, log-stream, credhub, ssh]
    reserved_private_domains: ~
    custom_root_links: ~
    max_route_options_size: 1024
    disable_private_domain_cross_space_context_path_route_sharing: false
    jobs:
      enable_dynamic_job_priorities: false
      global:
        timeout_in_seconds: 14400
        worker_sleep_delay_in_seconds: 5
      queues:
        cc_generic:
          timeout_in_seconds: ~
      blobstore_delete:
        timeout_in_seconds: ~
      droplet_upload:
        timeout_in_seconds: ~
      priorities: ~
      read_ahead: ~
      app_usage_events_cleanup:
        timeout_in_seconds: ~
      diego_sync:
        timeout_in_seconds: 600
      generic:
        number_of_worker_threads: ~
        worker_grace_period_seconds: 15
      local:
        number_of_workers: 2
        local_worker_grace_period_seconds: 300
    app_usage_events:
      cutoff_age_in_days: 31
    service_usage_events:
      cutoff_age_in_days: 31
    audit_events:
      cutoff_age_in_days: 31
    failed_jobs:
      cutoff_age_in_days: 31
      frequency_in_seconds: 14400
      max_number_of_failed_delayed_jobs: ~
    pollable_jobs:
      cutoff_age_in_days: 90
    completed_tasks:
      cutoff_age_in_days: 31
    service_operations_initial_cleanup:
      frequency_in_seconds: 300
    service_operations_create_in_progress_cleanup:
      frequency_in_seconds: 3600
    service_operations_update_stuck_in_progress_failed:
      frequency_in_seconds: 3600
    service_operations_delete_stuck_in_progress_retry:
      frequency_in_seconds: 3600
    service_operations_binding_delete_stuck_in_progress_retry:
      frequency_in_seconds: 3600
    diego_sync:
      frequency_in_seconds: 30
    pending_droplets:
      frequency_in_seconds: 300
    pending_builds:
      frequency_in_seconds: 300
    max_retained_deployments_per_app: 100
    max_retained_builds_per_app: 100
    max_retained_revisions_per_app: 100
    cpu_weight_min_memory: 128
    cpu_weight_max_memory: 8192
    default_app_memory: 1024
    default_app_disk_in_mb: 1024
    default_app_log_rate_limit_in_bytes_per_second: -1
    maximum_app_disk_in_mb: 2048
    instance_file_descriptor_limit: 16384
    default_app_lifecycle: buildpack
    default_health_check_timeout: 60
    maximum_health_check_timeout: 180
    disable_custom_buildpacks: false
    allow_app_ssh_access: true
    default_app_ssh_access: true
    app_log_revision: false
    app_instance_stopping_state: true
    shared_isolation_segment_name: shared
    broker_client_timeout_seconds: 60
    broker_client_default_async_poll_interval_seconds: 60
    broker_client_max_async_poll_duration_minutes: 10080
    broker_client_async_poll_exponential_backoff_rate: 1.0
    broker_client_max_async_poll_interval_seconds: 86400
    broker_client_response_parser:
      log_errors: false
      log_validators: false
      log_response_fields: {}
    max_concurrent_service_broker_requests: 0
    max_service_credential_bindings_per_app_service_instance: 5
    max_manifest_service_binding_poll_duration_in_seconds: 60
    credential_references:
      interpolate_service_bindings: true
    name: vcap
    build: "2222"
    version: 60
    support_address: http://support.cloudfoundry.com
    description: CF API on Kubernetes
    min_cli_version: "8.14.0"
    min_recommended_cli_version: latest
    warn_if_below_min_cli_version: false
    info:
      custom: ~
    app_ssh:
      port: 2222
      oauth_client_id: ssh-proxy
      host_key_fingerprint: ""
    login:
      enabled: true
      protocol: https
      url: ~
    doppler:
      use_ssl: true
      port: 443
    uaa:
      url: ~
      internal_url: uaa.{{ .Release.Namespace }}.svc.cluster.local
      ssl:
        port: 8443
      client_timeout: 60
      cc:
        token_secret: ~
        token_secret2: ~
      # Secrets default to .Values.oauthClientsSecret when unset.
      clients:
        cc-service-dashboards:
          secret: ~
          scope: openid,cloud_controller_service_permissions.read
        cloud_controller_username_lookup:
          secret: ~
        cc_service_key_client:
          secret: ~
        cc_routing:
          secret: ~
        cloud_controller_shadow_user_creation:
          secret: ~
    uaa_resource_id: cloud_controller,cloud_controller_service_permissions
    logcache:
      host: log-cache.{{ .Release.Namespace }}.svc.cluster.local
      port: 8080
    logcache_tls:
      subject_name: log_cache
    metron_endpoint:
      host: forwarder-agent.{{ .Release.Namespace }}.svc.cluster.local
      port: 3458
    loggregator_tls:
      subject_name: metron
    locket:
      host: locket.{{ .Release.Namespace }}.svc.cluster.local
      port: 8891
    credhub_api:
      enabled: true
      hostname: credhub.{{ .Release.Namespace }}.svc.cluster.local
      port: 8844
      external_url: ""
    logging_level: info
    logging_max_retries: 1
    logging_anonymize_ips: false
    logging:
      format:
        timestamp: rfc3339
    log_audit_events: true
    security_event_logging:
      enabled: false
    telemetry_logging_enabled: true
    enable_statsd_metrics: true
    statsd_host: 127.0.0.1
    statsd_port: 8125
    publish_metrics: false
    prometheus_port: 9397
    custom_metric_tag_prefix_list: ["metric.tag.cloudfoundry.org"]
    update_metric_tags_on_rename: true
    max_annotations_per_resource: 200
    max_labels_per_resource: 50
    enable_ipv6: ~
    allow_user_creation_by_org_manager: ~
    feature_flag_overrides: {}
    routing_api:
      enabled: false
    router:
      route_services_secret: ""
    volume_services_enabled: false
    ssl:
      skip_cert_verify: false
    quota_definitions:
      default:
        memory_limit: 102400
        non_basic_services_allowed: true
        total_reserved_route_ports: 100
        total_routes: 1000
        total_services: -1
    default_quota_definition: default
    stacks:
      - description: Cloud Foundry Linux-based filesystem (Ubuntu 22.04)
        name: cflinuxfs4
    default_stack: cflinuxfs4
    deprecated_stacks: []
    security_group_definitions: []
    default_staging_security_groups: []
    default_running_security_groups: []
    security_groups:
      enable_comma_delimited_destinations: false
    allowed_cors_domains: []
    rate_limiter:
      enabled: false
      general_limit: 2000
      unauthenticated_limit: 100
      admin_limit: -1
      reset_interval_in_minutes: 60
    rate_limiter_v2_api:
      enabled: false
      general_limit: 2000
      admin_limit: 2000
      reset_interval_in_minutes: 60
    temporary_enable_v2: false
    temporary_enable_async_recursive_delete:
      apps: false
      service_instances: false
    renderer:
      max_results_per_page: 100
      default_results_per_page: 50
      max_inline_relations_depth: 2
      max_total_results: ~
    staging_timeout_in_seconds: 900
    staging_file_descriptor_limit: 16384
    staging_upload_user: ~
    staging_upload_password: ~
    minimum_staging_memory_mb: 1024
    minimum_staging_disk_mb: 4096
    legacy_md5_buildpack_paths_enabled: false
    resource_pool:
      blobstore_type: storage-cli
      minimum_size: 65536
      maximum_size: 536870912
      resource_directory_key: cc-resources
      blobstore_provider: s3
      connection_config:
        bucket_name: cc-resources
        aws_access_key_id: admin
        aws_secret_access_key: ~
        host: http://blobstore.{{ .Values.cloudController.config.system_domain }}
        region: us-east-1
    packages:
      blobstore_type: storage-cli
      app_package_directory_key: cc-packages
      max_valid_packages_stored: 5
      max_package_size: 1073741824
      blobstore_provider: s3
      connection_config:
        bucket_name: cc-packages
        aws_access_key_id: admin
        aws_secret_access_key: ~
        host: http://blobstore.{{ .Values.cloudController.config.system_domain }}
        region: us-east-1
    droplets:
      blobstore_type: storage-cli
      droplet_directory_key: cc-droplets
      max_staged_droplets_stored: 5
      blobstore_provider: s3
      connection_config:
        bucket_name: cc-droplets
        aws_access_key_id: admin
        aws_secret_access_key: ~
        host: http://blobstore.{{ .Values.cloudController.config.system_domain }}
        region: us-east-1
    buildpacks:
      blobstore_type: storage-cli
      buildpack_directory_key: cc-buildpacks
      blobstore_provider: s3
      connection_config:
        bucket_name: cc-buildpacks
        aws_access_key_id: admin
        aws_secret_access_key: ~
        host: http://blobstore.{{ .Values.cloudController.config.system_domain }}
        region: us-east-1
    storage_cli_optional_flags: ~
    perform_blob_cleanup: true
    diego:
      file_server_url: http://fileserver.{{ .Release.Namespace }}.svc.cluster.local:8080
      cc_uploader_url: https://cc-uploader.{{ .Release.Namespace }}.svc.cluster.local:9091
      bbs:
        url: https://bbs.{{ .Release.Namespace }}.svc.cluster.local:8889
        connect_timeout: 10
        send_timeout: 10
        receive_timeout: 10
      pid_limit: 1024
      use_privileged_containers_for_running: false
      use_privileged_containers_for_staging: false
      enable_declarative_asset_downloads: false
      insecure_docker_registry_list: []
      temporary_oci_buildpack_mode: ~
      docker_staging_stack: cflinuxfs4
      lifecycle_bundles:
        buildpack/cflinuxfs4: buildpack_app_lifecycle/buildpack_app_lifecycle.tgz
        cnb/cflinuxfs4: cnb_app_lifecycle/cnb_app_lifecycle.tgz
        docker: docker_app_lifecycle/docker_app_lifecycle.tgz
      droplet_destinations:
        cflinuxfs4: /home/vcap
      sshd:
        allowed_ciphers: ~
        allowed_host_key_algorithms: ~
        allowed_key_exchanges: ~
        allowed_macs: ~
    db_encryption_key: ~
    database_encryption:
      keys: {}
      current_key_label: ""
      experimental_pbkdf2_hmac_iterations: 2048
      skip_validation: false
    db_logging_level: debug2
    log_db_queries: false
    query_size_log_threshold: ~

localWorker:
  image:
    repository: ghcr.io/cloudfoundry/k8s/cloud-controller
    tag: ""
    imagePullPolicy: IfNotPresent
  resources: ~

routeRegistrar:
  nats:
    address: nats.{{ .Release.Namespace }}.svc.cluster.local:4222
  image:
    repository: ghcr.io/cloudfoundry/k8s/route-registrar
    # renovate: dataSource=github-releases depName=cloudfoundry/routing-release
    tag: "0.397.0"
    imagePullPolicy: IfNotPresent
  resources: ~

nginx:
  image:
    repository: ghcr.io/cloudfoundry/k8s/cc-nginx
    tag: ""
    imagePullPolicy: IfNotPresent
  resources: ~

valkey:
  image:
    repository: valkey/valkey
    tag: "8"
    imagePullPolicy: IfNotPresent
  resources: ~

tpsWatcher:
  enabled: false
  replicas: 1
  resources: ~
  certificateSecret: ""
  image:
    repository: ghcr.io/cloudfoundry/k8s/tps-watcher
    tag: ""
    imagePullPolicy: IfNotPresent
  nodeSelector: ~
  tolerations: ~
  config:
    log_level: info
    logging:
      format:
        timestamp: rfc3339
    dropsonde_port: 3457
    bbs:
      api_location: bbs.{{ .Release.Namespace }}.svc.cluster.local:8889
      max_idle_conns_per_host: ~
    cc:
      external_port: 9023
      internal_service_hostname: cloud-controller.{{ .Release.Namespace }}.svc.cluster.local
    watcher:
      debug_addr: ""
      locket:
        api_location: locket.{{ .Release.Namespace }}.svc.cluster.local:8891

# Mirrors the ccdb.* properties of the capi-release jobs.
ccdb:
  name: cc
  db_scheme: postgres
  user: postgres
  password: ~
  address: postgresql.{{ .Release.Namespace }}.svc.cluster.local
  port: 5432
  caCertificateSecret: ""
  ssl_verify_hostname: true
  max_connections: 25
  max_connections_per_local_worker: ~
  pool_timeout: 10
  read_timeout: 3600
  connection_validation_timeout: 3600
  connection_expiration_timeout: ~
  connection_expiration_random_delay: ~
  enable_paginate_window: true
  migration_psql_worker_memory_kb: ~
  max_migration_duration_in_minutes: 20160
  max_migration_statement_runtime_in_seconds: 30
  migration_psql_concurrent_statement_timeout_in_seconds: 1800
  skip_bigint_id_migration: false
  psql:
    statement_timeout: 900000
    idle_in_transaction_session_timeout: 600000
    keepalives: 1
    keepalives_idle: 30
    keepalives_interval: 10
    keepalives_count: 3

oauthClientsSecret: ~
