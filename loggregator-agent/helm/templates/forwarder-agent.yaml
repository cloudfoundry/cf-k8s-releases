{{- if .Values.forwarderAgent.enabled }}
{{- $cacheURL := tpl .Values.syslogAgent.bindingCacheOverrideUrl . }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: forwarder-agent
  labels:
    app: forwarder-agent
spec:
  replicas: {{ .Values.forwarderAgent.replicas }}
  selector:
    matchLabels:
      app: forwarder-agent
  template:
    metadata:
      labels:
        app: forwarder-agent
      annotations:
        checksum/ingress-ports: {{ include (print $.Template.BasePath "/ingress-ports.yaml") . | sha256sum }}
    spec:
      containers:
        - name: forwarder-agent
          image: {{ .Values.forwarderAgent.image.repository }}:{{ default .Chart.AppVersion .Values.forwarderAgent.image.tag }}
          imagePullPolicy: {{ .Values.forwarderAgent.image.imagePullPolicy }}
          {{- if .Values.forwarderAgent.resources }}
          resources:
            {{- toYaml .Values.forwarderAgent.resources | nindent 12 }}
          {{- end }}
          env:
            {{- include "loggregatorAgent.podIdentity" . | nindent 12 }}
            - name: AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AGENT_PORT
              value: {{ .Values.forwarderAgent.port | int64 | quote }}
            - name: AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/forwarder-agent/ca.crt
            - name: AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/forwarder-agent/tls.crt
            - name: AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/forwarder-agent/tls.key
            - name: AGENT_CIPHER_SUITES
              value: {{ .Values.forwarderAgent.tls.cipherSuites | replace ":" "," | quote }}
            - name: AGENT_TAGS
              value: {{ include "loggregatorAgent.tags" (dict "values" .Values.forwarderAgent "root" .) | quote }}
            - name: EMIT_OTEL_TRACES
              value: {{ .Values.forwarderAgent.emitOtelTraces | quote }}
            - name: EMIT_OTEL_METRICS
              value: {{ .Values.forwarderAgent.emitOtelMetrics | quote }}
            - name: EMIT_OTEL_LOGS
              value: {{ .Values.forwarderAgent.emitOtelLogs | quote }}
            - name: OTEL_RETRY_MAX_RETRIES
              value: "{{ .Values.forwarderAgent.otelRetry.maxRetries | int64 }}"
            - name: OTEL_RETRY_QUEUE_SIZE
              value: "{{ .Values.forwarderAgent.otelRetry.queueSize | int64 }}"
            - name: METRICS_PORT
              value: "{{ .Values.forwarderAgent.metrics.port | int64 }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/forwarder-agent-metrics/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/forwarder-agent-metrics/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/forwarder-agent-metrics/tls.key
            - name: DEBUG_METRICS
              value: {{ .Values.forwarderAgent.metrics.debug | quote }}
            - name: PPROF_PORT
              value: "{{ .Values.forwarderAgent.metrics.pprofPort | int64 }}"
            - name: USE_RFC3339
              value: {{ eq .Values.forwarderAgent.logging.format.timestamp "rfc3339" | quote }}
            - name: DOWNSTREAM_INGRESS_PORT_GLOB
              value: /ingress-globs/*.yml
          volumeMounts:
            - name: forwarder-agent
              mountPath: /etc/ssl/certs/forwarder-agent
            - name: forwarder-agent-metrics
              mountPath: /etc/ssl/certs/forwarder-agent-metrics
            - name: ingress-globs
              mountPath: /ingress-globs
        {{- if .Values.loggregatorAgent.enabled }}
        - name: loggregator-agent
          image: {{ .Values.loggregatorAgent.image.repository }}:{{ default .Chart.AppVersion .Values.loggregatorAgent.image.tag }}
          imagePullPolicy: {{ .Values.loggregatorAgent.image.imagePullPolicy }}
          {{- if .Values.loggregatorAgent.resources }}
          resources:
            {{- toYaml .Values.loggregatorAgent.resources | nindent 12 }}
          {{- end }}
          env:
            {{- include "loggregatorAgent.podIdentity" . | nindent 12 }}
            - name: AGENT_DEPLOYMENT
              value: {{ tpl .Values.loggregatorAgent.deployment . | quote }}
            - name: AGENT_JOB
              value: forwarder-agent
            - name: AGENT_INDEX
              value: "$(POD_NAME)"
            - name: AGENT_IP
              value: "$(POD_IP)"
            - name: AGENT_PORT
              value: {{ .Values.loggregatorAgent.grpcPort | int64 | quote }}
            - name: AGENT_CA_FILE
              value: /etc/ssl/certs/loggregator-agent/ca.crt
            - name: AGENT_CERT_FILE
              value: /etc/ssl/certs/loggregator-agent/tls.crt
            - name: AGENT_KEY_FILE
              value: /etc/ssl/certs/loggregator-agent/tls.key
            - name: AGENT_CIPHER_SUITES
              value: {{ .Values.loggregatorAgent.loggregator.tls.cipherSuites | replace ":" "," | quote }}
            - name: AGENT_TAGS
              value: {{ include "loggregatorAgent.tags" (dict "values" .Values.loggregatorAgent "root" .) | quote }}
            - name: AGENT_DISABLE_UDP
              value: {{ .Values.loggregatorAgent.disableUdp | quote }}
            - name: LOGS_DISABLED
              value: {{ .Values.loggregatorAgent.disableLogs | quote }}
            - name: AGENT_INCOMING_UDP_PORT
              value: "{{ .Values.loggregatorAgent.listeningPort | int64 }}"
            - name: ROUTER_ADDR
              value: "{{ tpl (required "loggregatorAgent.doppler.overrideUrl is required" .Values.loggregatorAgent.doppler.overrideUrl) . }}:{{ .Values.loggregatorAgent.doppler.grpcPort | int64 }}"
            {{- if .Values.loggregatorAgent.doppler.overrideAzUrl }}
            - name: ROUTER_ADDR_WITH_AZ
              value: "{{ tpl .Values.loggregatorAgent.doppler.overrideAzUrl . }}:{{ .Values.loggregatorAgent.doppler.grpcPort | int64 }}"
            {{- end }}
            - name: METRICS_PORT
              value: "{{ .Values.loggregatorAgent.metrics.port | int64 }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/loggregator-agent-metrics/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/loggregator-agent-metrics/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/loggregator-agent-metrics/tls.key
            - name: DEBUG_METRICS
              value: {{ .Values.loggregatorAgent.metrics.debug | quote }}
            - name: PPROF_PORT
              value: "{{ .Values.loggregatorAgent.metrics.pprofPort | int64 }}"
            - name: USE_RFC3339
              value: {{ eq .Values.loggregatorAgent.logging.format.timestamp "rfc3339" | quote }}
          volumeMounts:
            - name: loggregator-agent
              mountPath: /etc/ssl/certs/loggregator-agent
            - name: loggregator-agent-metrics
              mountPath: /etc/ssl/certs/loggregator-agent-metrics
        {{- end }}
        {{- if .Values.syslogAgent.enabled }}
        - name: syslog-agent
          image: {{ .Values.syslogAgent.image.repository }}:{{ default .Chart.AppVersion .Values.syslogAgent.image.tag }}
          imagePullPolicy: {{ .Values.syslogAgent.image.imagePullPolicy }}
          {{- if .Values.syslogAgent.resources }}
          resources:
            {{- toYaml .Values.syslogAgent.resources | nindent 12 }}
          {{- end }}
          env:
            - name: AGENT_PORT
              value: {{ .Values.syslogAgent.port | int64 | quote }}
            - name: AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/syslog-agent/ca.crt
            - name: AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/syslog-agent/tls.crt
            - name: AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/syslog-agent/tls.key
            - name: AGENT_CIPHER_SUITES
              value: {{ .Values.syslogAgent.tls.cipherSuites | replace ":" "," | quote }}
            - name: DRAIN_SKIP_CERT_VERIFY
              value: {{ .Values.syslogAgent.drainSkipCertVerify | quote }}
            - name: DEFAULT_DRAIN_METADATA
              {{- if and $cacheURL .Values.syslogBindingCache.enabled }}
              value: {{ .Values.syslogBindingCache.defaultDrainMetadata | quote }}
              {{- else }}
              value: {{ .Values.syslogAgent.defaultDrainMetadata | quote }}
              {{- end }}
            - name: DRAIN_TRUSTED_CA_FILE
              {{- if .Values.syslogAgent.certificateSecrets.drain }}
              value: /etc/ssl/certs/syslog-agent-drain/ca.crt
              {{- else }}
              value: ""
              {{- end }}
            {{- if .Values.syslogAgent.drainCipherSuites }}
            - name: DRAIN_CIPHER_SUITES
              value: {{ .Values.syslogAgent.drainCipherSuites | quote }}
            {{- end }}
            - name: BLACKLISTED_SYSLOG_RANGES
              value: {{ include "loggregatorAgent.blacklistedRanges" .Values.syslogAgent.blacklistedSyslogRanges | quote }}
            - name: AGGREGATE_DRAIN_URLS
              value: {{ .Values.syslogAgent.aggregateDrains | quote }}
            - name: WARN_ON_INVALID_DRAINS
              value: {{ .Values.syslogAgent.warnOnInvalidDrains | quote }}
            - name: LOGGREGATOR_AGENT_ADDR
              value: "localhost:{{ .Values.syslogAgent.port | int64 }}"
            {{- if $cacheURL }}
            - name: CACHE_URL
              value: {{ $cacheURL | quote }}
            - name: CACHE_COMMON_NAME
              value: {{ .Values.syslogAgent.cache.tls.cn | quote }}
            - name: CACHE_POLLING_INTERVAL
              value: {{ .Values.syslogAgent.cache.pollingInterval | quote }}
            - name: CACHE_CA_FILE_PATH
              value: /etc/ssl/certs/syslog-agent-cache/ca.crt
            - name: CACHE_CERT_FILE_PATH
              value: /etc/ssl/certs/syslog-agent-cache/tls.crt
            - name: CACHE_KEY_FILE_PATH
              value: /etc/ssl/certs/syslog-agent-cache/tls.key
            {{- end }}
            - name: METRICS_PORT
              value: "{{ .Values.syslogAgent.metrics.port | int64 }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/syslog-agent-metrics/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/syslog-agent-metrics/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/syslog-agent-metrics/tls.key
            - name: DEBUG_METRICS
              value: {{ .Values.syslogAgent.metrics.debug | quote }}
            - name: PPROF_PORT
              value: "{{ .Values.syslogAgent.metrics.pprofPort | int64 }}"
            - name: USE_RFC3339
              value: {{ eq .Values.syslogAgent.logging.format.timestamp "rfc3339" | quote }}
          volumeMounts:
            - name: syslog-agent
              mountPath: /etc/ssl/certs/syslog-agent
            {{- if $cacheURL }}
            - name: syslog-agent-cache
              mountPath: /etc/ssl/certs/syslog-agent-cache
            {{- end }}
            - name: syslog-agent-metrics
              mountPath: /etc/ssl/certs/syslog-agent-metrics
            {{- if .Values.syslogAgent.certificateSecrets.drain }}
            - name: syslog-agent-drain
              mountPath: /etc/ssl/certs/syslog-agent-drain
            {{- end }}
        {{- end }}
      {{- if .Values.forwarderAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.forwarderAgent.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.forwarderAgent.tolerations }}
      tolerations:
        {{- toYaml .Values.forwarderAgent.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: forwarder-agent
          secret:
            secretName: {{ required "forwarderAgent.certificateSecrets.forwarder is required" .Values.forwarderAgent.certificateSecrets.forwarder }}
        - name: forwarder-agent-metrics
          secret:
            secretName: {{ required "forwarderAgent.certificateSecrets.metrics is required" .Values.forwarderAgent.certificateSecrets.metrics }}
        {{- if .Values.loggregatorAgent.enabled }}
        - name: loggregator-agent
          secret:
            secretName: {{ required "loggregatorAgent.certificateSecrets.loggregator is required" .Values.loggregatorAgent.certificateSecrets.loggregator }}
        - name: loggregator-agent-metrics
          secret:
            secretName: {{ required "loggregatorAgent.certificateSecrets.metrics is required" .Values.loggregatorAgent.certificateSecrets.metrics }}
        {{- end }}
        {{- if .Values.syslogAgent.enabled }}
        - name: syslog-agent
          secret:
            secretName: {{ required "syslogAgent.certificateSecrets.agent is required" .Values.syslogAgent.certificateSecrets.agent }}
        {{- if $cacheURL }}
        - name: syslog-agent-cache
          secret:
            secretName: {{ required "syslogAgent.certificateSecrets.cache is required" .Values.syslogAgent.certificateSecrets.cache }}
        {{- end }}
        - name: syslog-agent-metrics
          secret:
            secretName: {{ required "syslogAgent.certificateSecrets.metrics is required" .Values.syslogAgent.certificateSecrets.metrics }}
        {{- if .Values.syslogAgent.certificateSecrets.drain }}
        - name: syslog-agent-drain
          secret:
            secretName: {{ .Values.syslogAgent.certificateSecrets.drain }}
        {{- end }}
        {{- end }}
        - name: ingress-globs
          configMap:
            name: ingress-ports
---
kind: Service
apiVersion: v1
metadata:
  name: forwarder-agent
  labels:
    app: forwarder-agent
spec:
  ports:
    - port: {{ .Values.forwarderAgent.port }}
      targetPort: {{ .Values.forwarderAgent.port }}
      protocol: TCP
  selector:
    app: forwarder-agent
{{- end }}
