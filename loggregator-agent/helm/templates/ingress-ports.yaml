{{- if .Values.agents.enabled }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: ingress-ports
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.agents.loggregatorAgent.enabled }}
  loggregator.yml: "ingress: {{ .Values.agents.loggregatorAgent.grpcPort | int64 }}"
  {{- end }}
  syslog.yml: "ingress: {{ .Values.agents.syslogAgent.port | int64 }}"
  {{- if .Values.agents.otelCollector.enabled }}
  otel-collector.yml: |
    ingress: {{ .Values.agents.otelCollector.port | int64 }}
    protocol: otelcol
  {{- end }}
{{- end }}
