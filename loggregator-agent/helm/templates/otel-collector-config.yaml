{{/*
Keep the processor defaults aligned with the upstream OpenTelemetry Collector chart:
https://github.com/open-telemetry/opentelemetry-helm-charts/blob/opentelemetry-collector-0.172.0/charts/opentelemetry-collector/values.yaml#L225-L234
*/}}
{{- if and .Values.forwarderAgent.enabled .Values.otelCollector.enabled }}
{{- $exporterEndpoint := .Values.otelCollector.exporter.endpoint }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp/cf-internal-local:
        protocols:
          grpc:
            endpoint: 127.0.0.1:4317
            tls:
              client_ca_file: /etc/otel/certs/ca.crt
              cert_file: /etc/otel/certs/tls.crt
              key_file: /etc/otel/certs/tls.key
              min_version: "1.3"
    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
    exporters:
    {{- if $exporterEndpoint }}
      otlp:
        endpoint: {{ $exporterEndpoint | quote }}
        tls:
          insecure: true
    {{- else }}
      debug:
        verbosity: detailed
    {{- end }}
    service:
      pipelines:
        metrics:
          receivers: [otlp/cf-internal-local]
          processors: [memory_limiter, batch]
          exporters: [{{ if $exporterEndpoint }}otlp{{ else }}debug{{ end }}]
        logs:
          receivers: [otlp/cf-internal-local]
          processors: [memory_limiter, batch]
          exporters: [{{ if $exporterEndpoint }}otlp{{ else }}debug{{ end }}]
        traces:
          receivers: [otlp/cf-internal-local]
          processors: [memory_limiter, batch]
          exporters: [{{ if $exporterEndpoint }}otlp{{ else }}debug{{ end }}]
{{- end }}
