{{- if .Values.syslogBindingCache.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aggregate-drains
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: syslog-binding-cache
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  aggregate_drains.yml: |
    {{ include "loggregatorAgent.aggregateDrains" .Values.syslogBindingCache.aggregateDrains }}
{{- end }}
