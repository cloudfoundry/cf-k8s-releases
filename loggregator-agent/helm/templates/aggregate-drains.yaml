{{- if .Values.syslogBindingCache.enabled }}
{{- $drains := list }}
{{- range (splitList "," .Values.syslogBindingCache.aggregateDrains) }}
{{- if . }}
{{- $drains = append $drains (dict "url" .) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aggregate-drains
  labels:
    app: syslog-binding-cache
type: Opaque
stringData:
  aggregate_drains.yml: |
    {{ toJson $drains }}
{{- end }}
