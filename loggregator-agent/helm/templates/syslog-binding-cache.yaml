{{- if .Values.syslogBindingCache.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog-binding-cache
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: syslog-binding-cache
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.syslogBindingCache.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: syslog-binding-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: syslog-binding-cache
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.syslogBindingCache.podLabels }}
        {{- toYaml .Values.syslogBindingCache.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/aggregate-drains: {{ include (print $.Template.BasePath "/aggregate-drains.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.syslogBindingCache.podAnnotations }}
        {{- toYaml .Values.syslogBindingCache.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: syslog-binding-cache
          image: {{ .Values.syslogBindingCache.image.repository }}:{{ default .Chart.AppVersion .Values.syslogBindingCache.image.tag }}
          imagePullPolicy: {{ .Values.syslogBindingCache.image.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.syslogBindingCache.externalPort }}
          env:
            - name: CACHE_PORT
              value: "{{ .Values.syslogBindingCache.externalPort | int64 }}"
            - name: CIPHER_SUITES
              value: {{ .Values.syslogBindingCache.tls.cipherSuites | replace ":" "," | quote }}
            - name: CACHE_COMMON_NAME
              value: {{ .Values.syslogBindingCache.tls.cn | quote }}
            - name: CACHE_CA_FILE_PATH
              value: /etc/ssl/certs/cache/ca.crt
            - name: CACHE_CERT_FILE_PATH
              value: /etc/ssl/certs/cache/tls.crt
            - name: CACHE_KEY_FILE_PATH
              value: /etc/ssl/certs/cache/tls.key
            - name: API_URL
              value: "https://{{ tpl .Values.syslogBindingCache.api.overrideUrl . }}:9023"
            - name: API_COMMON_NAME
              value: {{ .Values.syslogBindingCache.api.tls.cn | quote }}
            - name: API_CA_FILE_PATH
              value: /etc/ssl/certs/api/ca.crt
            - name: API_CERT_FILE_PATH
              value: /etc/ssl/certs/api/tls.crt
            - name: API_KEY_FILE_PATH
              value: /etc/ssl/certs/api/tls.key
            - name: API_POLLING_INTERVAL
              value: {{ .Values.syslogBindingCache.api.pollingInterval | quote }}
            - name: API_BATCH_SIZE
              value: "{{ .Values.syslogBindingCache.api.batchSize | int64 }}"
            - name: API_DISABLE_KEEP_ALIVES
              value: {{ .Values.syslogBindingCache.api.disableKeepAlives | quote }}
            - name: AGGREGATE_DRAINS_FILE
              value: /etc/aggregate-drains/aggregate_drains.yml
            - name: LOGGREGATOR_AGENT_HOST
              value: "{{ tpl .Values.syslogBindingCache.loggregator.host . }}"
            - name: LOGGREGATOR_AGENT_PORT
              value: "{{ .Values.syslogBindingCache.loggregator.port | int64 }}"
            - name: LOGGREGATOR_AGENT_CIPHER_SUITES
              value: {{ .Values.syslogBindingCache.loggregator.tls.cipherSuites | replace ":" "," | quote }}
            - name: LOGGREGATOR_AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/loggregator-agent/ca.crt
            - name: LOGGREGATOR_AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/loggregator-agent/tls.crt
            - name: LOGGREGATOR_AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/loggregator-agent/tls.key
            - name: METRICS_PORT
              value: "{{ .Values.syslogBindingCache.metrics.port | int64 }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/metrics/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/metrics/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/metrics/tls.key
            - name: DEBUG_METRICS
              value: {{ .Values.syslogBindingCache.metrics.debug | quote }}
            - name: PPROF_PORT
              value: "{{ .Values.syslogBindingCache.metrics.pprofPort | int64 }}"
            - name: USE_RFC3339
              value: {{ eq .Values.syslogBindingCache.logging.format.timestamp "rfc3339" | quote }}
            - name: BLACKLISTED_SYSLOG_RANGES
              value: {{ include "loggregatorAgent.blacklistedRanges" .Values.syslogBindingCache.blacklistedSyslogRanges | quote }}
            - name: WARN_ON_INVALID_DRAINS
              value: {{ .Values.syslogBindingCache.warnOnInvalidDrains | quote }}
          {{- if .Values.syslogBindingCache.resources }}
          resources:
            {{- toYaml .Values.syslogBindingCache.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: api
              mountPath: /etc/ssl/certs/api
              readOnly: true
            - name: cache
              mountPath: /etc/ssl/certs/cache
              readOnly: true
            - name: loggregator-agent
              mountPath: /etc/ssl/certs/loggregator-agent
              readOnly: true
            - name: metrics
              mountPath: /etc/ssl/certs/metrics
              readOnly: true
            - name: aggregate-drains
              mountPath: /etc/aggregate-drains
              readOnly: true
      {{- if .Values.syslogBindingCache.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.syslogBindingCache.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.syslogBindingCache.tolerations }}
      tolerations:
        {{- toYaml .Values.syslogBindingCache.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: api
          secret:
            secretName: {{ required "syslogBindingCache.certificateSecrets.api is required" .Values.syslogBindingCache.certificateSecrets.api }}
        - name: cache
          secret:
            secretName: {{ required "syslogBindingCache.certificateSecrets.cache is required" .Values.syslogBindingCache.certificateSecrets.cache }}
        - name: loggregator-agent
          secret:
            secretName: {{ required "syslogBindingCache.certificateSecrets.loggregatorAgent is required" .Values.syslogBindingCache.certificateSecrets.loggregatorAgent }}
        - name: metrics
          secret:
            secretName: {{ required "syslogBindingCache.certificateSecrets.metrics is required" .Values.syslogBindingCache.certificateSecrets.metrics }}
        - name: aggregate-drains
          secret:
            secretName: aggregate-drains
---
kind: Service
apiVersion: v1
metadata:
  name: syslog-binding-cache
  {{- if or .Values.commonAnnotations .Values.syslogBindingCache.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.syslogBindingCache.serviceAnnotations }}
    {{- toYaml .Values.syslogBindingCache.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: syslog-binding-cache
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.syslogBindingCache.serviceLabels }}
    {{- toYaml .Values.syslogBindingCache.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: {{ .Values.syslogBindingCache.externalPort }}
      name: http
      targetPort: {{ .Values.syslogBindingCache.externalPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: syslog-binding-cache
{{- end }}
