apiVersion: v1
kind: Secret
metadata:
  name: credhub-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
stringData:
  application.yml: |
  {{- tpl (.Files.Get "files/credhub.yaml") . | nindent 4 }}