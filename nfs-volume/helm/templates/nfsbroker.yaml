{{- if .Values.nfsbroker.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nfsbroker
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: nfsbroker
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nfsbroker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfsbroker
        {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.nfsbroker.podLabels | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/nfsbroker-config: {{ include (print $.Template.BasePath "/nfsbroker-config.yaml") . | sha256sum }}
        checksum/nfsbroker-credentials: {{ include (print $.Template.BasePath "/nfsbroker-credentials.yaml") . | sha256sum }}
        {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.nfsbroker.podAnnotations | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: nfsbroker
          image: {{ .Values.nfsbroker.image.repository }}:{{ default .Chart.AppVersion .Values.nfsbroker.image.tag }}
          imagePullPolicy: {{ .Values.nfsbroker.image.imagePullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nfsbroker-credentials
          args:
            - --listenAddr=0.0.0.0:8080
            - --servicesConfig=/services.json
            - --credhubURL={{ tpl .Values.nfsbroker.credhubURL . }}
            - --credhubCACertPath=/ssl/ca.crt
            - --storeID=nfsbroker
            - --logLevel=info
            - --timeFormat=rfc3339
            - --allowedOptions=source,uid,gid,auto_cache,readonly,version,mount,cache
          {{- if .Values.nfsbroker.resources }}
          resources:
            {{- toYaml .Values.nfsbroker.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: server-certs
              mountPath: /ssl
              readOnly: true
            - name: services-config
              mountPath: /services.json
              subPath: services.json
      {{- if .Values.nfsbroker.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nfsbroker.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.nfsbroker.tolerations }}
      tolerations:
        {{- toYaml .Values.nfsbroker.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: services-config
          configMap:
            name: nfsbroker-config
        - name: server-certs
          secret:
            secretName: {{ required "nfsbroker.certificateSecret is required" .Values.nfsbroker.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: nfsbroker
  {{- with mergeOverwrite (dict) (.Values.commonLabels | default dict) (.Values.nfsbroker.serviceLabels | default dict) }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with mergeOverwrite (dict) (.Values.commonAnnotations | default dict) (.Values.nfsbroker.serviceAnnotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: nfsbroker
{{- end }}
