commonLabels: ~
commonAnnotations: ~

systemDomain: "cf.127-0-0-1.nip.io"

loggregator:
  enabled: false

doppler:
  podLabels: ~
  podAnnotations: ~
  serviceLabels: ~
  serviceAnnotations: ~
  replicas: 1
  certificateSecret: ""
  grpcPort: 8082
  pprofPort: 0
  ingressBufferSize: 10000
  egressBufferSize: 1000
  cipherSuites: "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256:TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
  loggingFormatTimestamp: deprecated
  metronEndpoint:
    host: "forwarder-agent.{{ .Release.Namespace }}.svc.cluster.local"
    grpcPort: 3458
  resources: ~
  image:
    repository: ghcr.io/cloudfoundry/k8s/doppler
    tag: ""
    imagePullPolicy: IfNotPresent
  nodeSelector: ~
  tolerations: ~

logApi:
  podLabels: ~
  podAnnotations: ~
  serviceLabels: ~
  serviceAnnotations: ~
  replicas: 1

reverseLogProxy:
  certificateSecret: ""
  egress:
    port: 8082
    maxStreams: 1000
  pprof:
    port: 0
  cipherSuites: "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256:TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
  metricEmitter:
    interval: 1m
  loggingFormatTimestamp: deprecated
  metronEndpoint:
    host: "forwarder-agent.{{ .Release.Namespace }}.svc.cluster.local"
    grpcPort: 3458
  resources: ~
  image:
    repository: ghcr.io/cloudfoundry/k8s/reverse-log-proxy
    tag: ""
    imagePullPolicy: IfNotPresent

reverseLogProxyGateway:
  certificateSecrets:
    httpTLS: ""
    logsProvider: ""
    cc: ""
    uaaCA: ""
    metrics: ""
  http:
    address: ":8088"
  logsProvider:
    commonName: reverselogproxy
  cc:
    address: "cloud-controller.{{ .Release.Namespace }}.svc.cluster.local"
    commonName: "cloud-controller.{{ .Release.Namespace }}.svc.cluster.local"
  uaa:
    clientId: ""
    clientSecret: ""
    internalAddr: "https://uaa.{{ .Release.Namespace }}.svc.cluster.local:8443"
  skipCertVerify: false
  metrics:
    port: 8089
  loggingFormatTimestamp: deprecated
  resources: ~
  image:
    repository: ghcr.io/cloudfoundry/k8s/reverse-log-proxy-gateway
    tag: ""
    imagePullPolicy: IfNotPresent

trafficcontroller:
  certificateSecrets:
    routerTLS: ""
    cc: ""
    outgoing: ""
    uaaCA: ""
  outgoingDropsondePort: 8081
  disableAccessControl: false
  securityEventLogging:
    enabled: false
  pprofPort: 0
  skipCertVerify: false
  metricEmitter:
    interval: 1m
  loggingFormatTimestamp: deprecated
  metronEndpoint:
    host: "forwarder-agent.{{ .Release.Namespace }}.svc.cluster.local"
    grpcPort: 3458
  cc:
    internalServiceHostname: "cloud-controller.{{ .Release.Namespace }}.svc.cluster.local"
    tlsPort: 9023
  uaa:
    client: doppler
    clientSecret: ""
    internalUrl: "https://uaa.{{ .Release.Namespace }}.svc.cluster.local:8443"
  resources: ~
  image:
    repository: ghcr.io/cloudfoundry/k8s/traffic-controller
    tag: ""
    imagePullPolicy: IfNotPresent
  nodeSelector: ~
  tolerations: ~

routeRegistrar:
  certificateSecret: ""
  nats:
    address: nats.{{ .Release.Namespace }}.svc.cluster.local:4222
  image:
    repository: ghcr.io/cloudfoundry/k8s/route-registrar
    # renovate: dataSource=github-releases depName=cloudfoundry/routing-release
    tag: "0.397.0"
    imagePullPolicy: IfNotPresent
  resources: ~
