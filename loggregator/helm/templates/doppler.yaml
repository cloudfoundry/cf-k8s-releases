{{- if .Values.loggregator.enabled }}
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: doppler
  labels:
    app: doppler
spec:
  serviceName: doppler
  replicas: {{ .Values.doppler.replicas }}
  selector:
    matchLabels:
      app: doppler
  template:
    metadata:
      labels:
        app: doppler
    spec:
      containers:
        - name: doppler
          image: {{ .Values.doppler.image.repository }}:{{ default .Chart.AppVersion .Values.doppler.image.tag }}
          imagePullPolicy: {{ .Values.doppler.image.imagePullPolicy }}
          {{- if .Values.doppler.resources }}
          resources:
            {{- toYaml .Values.doppler.resources | nindent 12 }}
          {{- end }}
          env:
            - name: AGENT_GRPC_ADDRESS
              value: "{{ tpl .Values.doppler.metronEndpoint.host $ }}:{{ .Values.doppler.metronEndpoint.grpcPort }}"
            - name: ROUTER_PORT
              value: "{{ .Values.doppler.grpcPort }}"
            - name: ROUTER_CA_FILE
              value: /etc/ssl/certs/doppler/ca.crt
            - name: ROUTER_CERT_FILE
              value: /etc/ssl/certs/doppler/tls.crt
            - name: ROUTER_KEY_FILE
              value: /etc/ssl/certs/doppler/tls.key
            - name: ROUTER_CIPHER_SUITES
              value: {{ .Values.doppler.cipherSuites | replace ":" "," | quote }}
            - name: ROUTER_PPROF_PORT
              value: "{{ .Values.doppler.pprofPort }}"
            - name: INGRESS_BUFFER_SIZE
              value: "{{ .Values.doppler.ingressBufferSize }}"
            - name: EGRESS_BUFFER_SIZE
              value: "{{ .Values.doppler.egressBufferSize }}"
            - name: USE_RFC339
              value: {{ eq .Values.doppler.loggingFormatTimestamp "rfc3339" | quote }}
          volumeMounts:
            - name: doppler
              mountPath: /etc/ssl/certs/doppler
          readinessProbe:
            tcpSocket:
              port: {{ .Values.doppler.grpcPort }}
      {{- if .Values.doppler.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.doppler.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.doppler.tolerations }}
      tolerations:
        {{- toYaml .Values.doppler.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: doppler
          secret:
            secretName: {{ required "doppler.certificateSecret is required" .Values.doppler.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: doppler
  labels:
    app: doppler
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.doppler.grpcPort }}
      targetPort: {{ .Values.doppler.grpcPort }}
      name: https
      protocol: TCP
  selector:
    app: doppler
{{- end }}
