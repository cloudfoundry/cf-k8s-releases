---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-api-route-registrar-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  route-registrar.json: |-
    {
      "message_bus_servers": [
        {
          "host": "{{ tpl .Values.routeRegistrar.nats.address . }}"
        }
      ],
      "nats_mtls_config": {
        "enabled": true,
        "cert_path": "/etc/ssl/certs/route-registrar/tls.crt",
        "key_path": "/etc/ssl/certs/route-registrar/tls.key",
        "ca_path": "/etc/ssl/certs/route-registrar/ca.crt"
      },
      "host": "",
      "routes": [
        {
          "name": "doppler",
          "tls_port": 8081,
          "registration_interval": "10s",
          "server_cert_domain_san": "doppler.{{ .Values.systemDomain }}",
          "uris": [
            "doppler.{{ .Values.systemDomain }}"
          ]
        },
        {
          "name": "rlp-gateway",
          "tls_port": 8088,
          "registration_interval": "10s",
          "server_cert_domain_san": "log-stream.{{ .Values.systemDomain }}",
          "uris": [
            "log-stream.{{ .Values.systemDomain }}"
          ]
        }
      ]
    }
