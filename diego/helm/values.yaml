rep:
  enabled: false
  image:
    repository: ghcr.io/cloudfoundry/k8s/rep
    tag: ""
    imagePullPolicy: IfNotPresent
  certificateSecrets:
    instanceIdentity: instance-identity
    loggregator: ""
    locket: ""
  advertiseDomain: "{{ .Release.Namespace }}.pod.cluster.local"
  debugAddr: "127.0.0.1:17008"
  listenAddrAdmin: "127.0.0.1:1800"
  listenAddrSecurable: "0.0.0.0:1801"
  healthCheckListenAddr: ""
  advertisePreferenceForInstanceAddress: false
  logContainerNetworkInfo: false
  logLevel: info
  pollingIntervalInSeconds: 30
  evacuationPollingIntervalInSeconds: 10
  evacuationTimeoutInSeconds: 600
  extraRootFsDir: ""
  sidecarRootfs: ""
  rootfsProviders:
    - docker
  cellAnnotations: {}
  ssl:
    skipCertVerify: false
  bbs:
    apiLocation: "bbs.{{ .Release.Namespace }}.svc.cluster.local:8889"
    requestTimeout: "10s"
    clientSessionCacheSize: ~
    maxIdleConnsPerHost: ~
  locket:
    apiLocation: "locket.{{ .Release.Namespace }}.svc.cluster.local:8891"
    lockTtl: 15
    clientKeepaliveTime: 10
    clientKeepaliveTimeout: 22
  diskHealthCheckPaths: []
  diskHealthCheckInterval: "15s"
  diskHealthCheckFailureThreshold: 3
  stacks: {}
  executor:
    autoDiskCapacityOverheadMb: 0
    memoryCapacityMb: auto
    diskCapacityMb: auto
    maxConcurrentDownloads: 5
    containerMaxCpuShares: 1024
    containerInodeLimit: 200000
    containerMetricsReportInterval: "15s"
    maxCacheSizeInBytes: 10000000000
    minCachePartitionFreeBytes: 5368709120
    useSchedulableDiskSize: false
    proxyHealthcheckInterval: "30s"
    enableContainerProxyHealthcheck: false
    healthyMonitoringIntervalInSeconds: 30
    unhealthyMonitoringIntervalInSeconds: 2
    createWorkPoolSize: 32
    deleteWorkPoolSize: 32
    readWorkPoolSize: 64
    metricsWorkPoolSize: 8
    healthcheckWorkPoolSize: 64
    maxLogLinesPerSecond: 0
    declarativeHealthcheckDefaultTimeout: "1s"
    injectWorkloadIdentity: false
    instanceIdentityValidityPeriodInHours: 24
    postSetupHook: ~
    postSetupUser: ~
    garden:
      address: "/run/containerd/containerd.sock"
    volman:
      driverPaths: "/var/lib/rep/voldrivers"
  containers:
    gracefulShutdownIntervalInSeconds: 10
    setCpuWeight: false
    layeringMode: single-layer
    trustedCaCertificates: ~
    proxy:
      additionalMemoryAllocationMb: 32
      enableHttp2: true
      requireAndVerifyClientCertificates: false
      trustedCaCertificates: []
      verifySubjectAltName: []
      enableUnproxiedPortMappings: true
      adsAddresses: []
      configurationReloadDuration: "5s"
  enableHealthcheckMetrics: false
  cellRegistrations:
    locket:
      enabled: true
  logging:
    maxDataStringLength: 640
  loggregator:
    v2ApiPort: 3458
    apiHost: "forwarder-agent.{{ .Release.Namespace }}.svc.cluster.local"
    appMetricExclusionFilter:
      - cpu_entitlement
  workloadsNamespace: cf-workloads
  resources: ~
  watcher:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
  nodeSelector:
    cloudfoundry.org/cell: "true"
  tolerations:
    - key: cloudfoundry.org/cell
      operator: Equal
      value: "true"
      effect: NoSchedule
