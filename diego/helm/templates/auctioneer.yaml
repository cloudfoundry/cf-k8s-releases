{{- if .Values.auctioneer.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: auctioneer
  labels:
    app: auctioneer
spec:
  replicas: {{ .Values.auctioneer.replicas }}
  selector:
    matchLabels:
      app: auctioneer
  template:
    metadata:
      labels:
        app: auctioneer
      annotations:
        checksum/auctioneer-config: {{ include (print $.Template.BasePath "/auctioneer-config.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: auctioneer-init
          image: mikefarah/yq:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              yq '.uuid = strenv(POD_NAME)' /auctioneer/auctioneer.json > /tmp/auctioneer.json
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: auctioneer-config
              mountPath: /auctioneer
            - name: tmp
              mountPath: /tmp
      containers:
        - name: auctioneer
          image: {{ .Values.auctioneer.image.repository }}:{{ default .Chart.AppVersion .Values.auctioneer.image.tag }}
          args:
            - "-config"
            - "/tmp/auctioneer.json"
          imagePullPolicy: {{ .Values.auctioneer.image.imagePullPolicy }}
          ports:
            - containerPort: 9016
          {{- if .Values.auctioneer.resources }}
          resources:
            {{- toYaml .Values.auctioneer.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cert-server
              mountPath: /etc/ssl/certs/server
              readOnly: true
            - name: cert-bbs
              mountPath: /etc/ssl/certs/bbs
              readOnly: true
            - name: cert-rep
              mountPath: /etc/ssl/certs/rep
              readOnly: true
            - name: cert-loggregator
              mountPath: /etc/ssl/certs/loggregator
              readOnly: true
            - name: auctioneer-config
              mountPath: /auctioneer
            - name: tmp
              mountPath: /tmp
      {{- if .Values.auctioneer.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.auctioneer.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.auctioneer.tolerations }}
      tolerations:
        {{- toYaml .Values.auctioneer.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: cert-server
          secret:
            secretName: {{ required "auctioneer.certificateSecrets.server is required" .Values.auctioneer.certificateSecrets.server }}
        - name: cert-bbs
          secret:
            secretName: {{ required "auctioneer.certificateSecrets.bbs is required" .Values.auctioneer.certificateSecrets.bbs }}
        - name: cert-rep
          secret:
            secretName: {{ required "auctioneer.certificateSecrets.rep is required" .Values.auctioneer.certificateSecrets.rep }}
        - name: cert-loggregator
          secret:
            secretName: {{ required "auctioneer.certificateSecrets.loggregator is required" .Values.auctioneer.certificateSecrets.loggregator }}
        - name: tmp
          emptyDir: {}
        - name: auctioneer-config
          configMap:
            name: auctioneer-config
---
kind: Service
apiVersion: v1
metadata:
  name: auctioneer
  labels:
    app: auctioneer
spec:
  ports:
    - port: 9016
      targetPort: 9016
      protocol: TCP
  selector:
    app: auctioneer
{{- end }}
