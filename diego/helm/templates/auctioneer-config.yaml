{{- if .Values.auctioneer.enabled }}
{{- $a := .Values.auctioneer }}
{{- if gt (int $a.locket.clientKeepaliveTime) (int $a.locket.clientKeepaliveTimeout) }}
{{- fail "auctioneer.locket.clientKeepaliveTime must not be larger than clientKeepaliveTimeout" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auctioneer-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  auctioneer.json: |-
    {
      "auction_runner_workers": 1000,
      "communication_timeout": "10s",
      "report_interval": "1m",
      "lock_retry_interval": "5s",
      "lock_ttl": "15s",
      "time_format": "rfc3339",
      "debug_address": "{{ $a.debugAddr }}",
      "listen_address": "{{ $a.listenAddr }}",
      "log_level": "{{ $a.logLevel }}",
      "cell_state_timeout": "{{ $a.cellStateTimeout }}",
      "bin_pack_first_fit_weight": {{ $a.binPackFirstFitWeight }},
      "starting_container_weight": {{ $a.startingContainerWeight }},
      "starting_container_count_maximum": {{ $a.startingContainerCountMaximum }},
      "rep_client_session_cache_size": {{ $a.rep.clientSessionCacheSize }},
      "bbs_address": "https://{{ tpl $a.bbs.apiLocation $ }}",
      "bbs_ca_cert_file": "/etc/ssl/certs/bbs/ca.crt",
      "bbs_client_cert_file": "/etc/ssl/certs/bbs/tls.crt",
      "bbs_client_key_file": "/etc/ssl/certs/bbs/tls.key",
      "rep_ca_cert": "/etc/ssl/certs/rep/ca.crt",
      "rep_client_cert": "/etc/ssl/certs/rep/tls.crt",
      "rep_client_key": "/etc/ssl/certs/rep/tls.key",
      "ca_cert_file": "/etc/ssl/certs/server/ca.crt",
      "server_cert_file": "/etc/ssl/certs/server/tls.crt",
      "server_key_file": "/etc/ssl/certs/server/tls.key",
      "locket_address": "{{ tpl $a.locket.apiLocation $ }}",
      "uuid": "",
      "locket_ca_cert_file": "/etc/ssl/certs/bbs/ca.crt",
      "locket_client_cert_file": "/etc/ssl/certs/bbs/tls.crt",
      "locket_client_key_file": "/etc/ssl/certs/bbs/tls.key",
      "locket_client_keepalive_time": {{ $a.locket.clientKeepaliveTime }},
      "locket_client_keepalive_timeout": {{ $a.locket.clientKeepaliveTimeout }},
      {{- if not (kindIs "invalid" $a.bbs.clientSessionCacheSize) }}
      "bbs_client_session_cache_size": {{ $a.bbs.clientSessionCacheSize }},
      {{- end }}
      {{- if not (kindIs "invalid" $a.bbs.maxIdleConnsPerHost) }}
      "bbs_max_idle_conns_per_host": {{ $a.bbs.maxIdleConnsPerHost }},
      {{- end }}
      {{- if $a.enableBBSHealthCheck }}
      "enable_bbs_health_check": true,
      "bbs_health_check_interval": "{{ $a.bbsHealthCheckInterval }}",
      "bbs_health_check_timeout": "{{ $a.bbsHealthCheckTimeout }}",
      "bbs_health_check_failure_threshold": {{ $a.bbsHealthCheckFailureThreshold }},
      {{- end }}
      {{- include "diego.loggregatorConfig" (dict "cfg" $a.loggregator "jobName" "auctioneer" "origin" "auctioneer" "sourceId" "auctioneer" "root" $) | nindent 6 }}
    }
{{- end }}
