{{- if .Values.sshProxy.enabled }}
{{- $s := .Values.sshProxy }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ssh-proxy
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: ssh-proxy
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.sshProxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ssh-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssh-proxy
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.sshProxy.podLabels }}
        {{- toYaml .Values.sshProxy.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/ssh-proxy-config: {{ include (print $.Template.BasePath "/ssh-proxy-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.sshProxy.podAnnotations }}
        {{- toYaml .Values.sshProxy.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: ssh-proxy
          image: {{ .Values.sshProxy.image.repository }}:{{ default .Chart.AppVersion .Values.sshProxy.image.tag }}
          args:
            - "-config"
            - "/ssh-proxy/ssh-proxy.json"
          imagePullPolicy: {{ .Values.sshProxy.image.imagePullPolicy }}
          ports:
            - containerPort: 2222
          {{- if .Values.sshProxy.resources }}
          resources:
            {{- toYaml .Values.sshProxy.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cert-bbs
              mountPath: /etc/ssl/certs/bbs
              readOnly: true
            - name: cert-loggregator
              mountPath: /etc/ssl/certs/loggregator
              readOnly: true
            {{- if $s.backends.tls.enabled }}
            - name: cert-backends-tls
              mountPath: /etc/ssl/certs/backends-tls
              readOnly: true
            {{- end }}
            {{- if $s.certificateSecrets.uaaCA }}
            - name: cert-uaa-ca
              mountPath: /etc/ssl/certs/uaa-ca
              readOnly: true
            {{- end }}
            {{- if $s.certificateSecrets.ccCA }}
            - name: cert-cc-ca
              mountPath: /etc/ssl/certs/cc-ca
              readOnly: true
            {{- end }}
            - name: ssh-proxy-config
              mountPath: /ssh-proxy
      {{- if .Values.sshProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.sshProxy.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.sshProxy.tolerations }}
      tolerations:
        {{- toYaml .Values.sshProxy.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: cert-bbs
          secret:
            secretName: {{ required "sshProxy.certificateSecrets.bbs is required" $s.certificateSecrets.bbs }}
        - name: cert-loggregator
          secret:
            secretName: {{ required "sshProxy.certificateSecrets.loggregator is required" $s.certificateSecrets.loggregator }}
        {{- if $s.backends.tls.enabled }}
        - name: cert-backends-tls
          secret:
            secretName: {{ required "sshProxy.certificateSecrets.backendsTLS is required when backends.tls.enabled" $s.certificateSecrets.backendsTLS }}
        {{- end }}
        {{- if $s.certificateSecrets.uaaCA }}
        - name: cert-uaa-ca
          secret:
            secretName: {{ $s.certificateSecrets.uaaCA }}
        {{- end }}
        {{- if $s.certificateSecrets.ccCA }}
        - name: cert-cc-ca
          secret:
            secretName: {{ $s.certificateSecrets.ccCA }}
        {{- end }}
        - name: ssh-proxy-config
          secret:
            secretName: ssh-proxy-config
---
kind: Service
apiVersion: v1
metadata:
  name: ssh-proxy
  {{- if or .Values.commonAnnotations .Values.sshProxy.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.sshProxy.serviceAnnotations }}
    {{- toYaml .Values.sshProxy.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: ssh-proxy
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.sshProxy.serviceLabels }}
    {{- toYaml .Values.sshProxy.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: 2222
      targetPort: 2222
      protocol: TCP
  selector:
    app.kubernetes.io/name: ssh-proxy
{{- if .Values.sshProxy.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ssh-proxy
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: istio-gateway
      sectionName: ssh-proxy
  rules:
    - backendRefs:
      - name: ssh-proxy
        port: 2222
{{- end }}
{{- end }}
