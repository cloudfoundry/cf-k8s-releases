{{- if .Values.locket.enabled }}
{{- $l := .Values.locket }}
{{- $db := .Values.locket.db }}
{{- $_ := required "locket.db.password must be provided" $db.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: locket-config
stringData:
  locket.json: |-
    {
      "report_interval": "1m",
      "ca_file": "/etc/ssl/certs/server/ca.crt",
      "cert_file": "/etc/ssl/certs/server/tls.crt",
      "key_file": "/etc/ssl/certs/server/tls.key",
      "debug_address": "{{ $l.debugAddr }}",
      "listen_address": "{{ $l.listenAddr }}",
      "log_level": "{{ $l.logLevel }}",
      "max_open_database_connections": {{ $db.maxOpenConnections }},
      "max_database_connection_lifetime": "1h",
      "health_check_failure_threshold": {{ $l.healthCheckFailureThreshold }},
      "enable_db_health_check": {{ $l.enableDBHealthCheck }},
      "database_connection_string": "{{ include "diego.sqlConnectionString" (dict "db" $db "root" $) }}",
      "database_driver": "{{ $db.driver }}",
      {{- if $db.requireSSL }}
      "sql_ca_cert_file": "/etc/ssl/certs/database-ca/ca.crt",
      "sql_enable_identity_verification": {{ $db.enableIdentityVerification }},
      {{- end }}
      "db_connection_timeout": "{{ $db.dbConnectionTimeout }}s",
      "db_read_timeout": "{{ $db.dbReadTimeout }}s",
      "db_write_timeout": "{{ $db.dbWriteTimeout }}s",
      "db_operation_timeout": "{{ $db.dbOperationTimeout }}s",
      "health_check_timeout": "{{ $l.healthCheckTimeout }}s",
      "health_check_interval": "{{ $l.healthCheckInterval }}s",
      "time_format": "rfc3339",
      {{- include "diego.loggregatorConfig" (dict "cfg" $l.loggregator "jobName" "locket" "origin" "locket" "sourceId" "locket" "root" $) | nindent 6 }}
    }
{{- end }}
