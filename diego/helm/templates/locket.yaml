{{- if .Values.locket.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: locket
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: locket
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.locket.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: locket
  template:
    metadata:
      labels:
        app.kubernetes.io/name: locket
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.locket.podLabels }}
        {{- toYaml .Values.locket.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/locket-config: {{ include (print $.Template.BasePath "/locket-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.locket.podAnnotations }}
        {{- toYaml .Values.locket.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: locket
          image: {{ .Values.locket.image.repository }}:{{ default .Chart.AppVersion .Values.locket.image.tag }}
          args:
            - "-config"
            - "/locket/locket.json"
          imagePullPolicy: {{ .Values.locket.image.imagePullPolicy }}
          ports:
            - containerPort: 8891
          {{- if .Values.locket.resources }}
          resources:
            {{- toYaml .Values.locket.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cert-server
              mountPath: /etc/ssl/certs/server
              readOnly: true
            - name: cert-loggregator
              mountPath: /etc/ssl/certs/loggregator
              readOnly: true
            {{- if .Values.locket.db.requireSSL }}
            - name: cert-database-ca
              mountPath: /etc/ssl/certs/database-ca
              readOnly: true
            {{- end }}
            - name: locket-config
              mountPath: /locket
      {{- if .Values.locket.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.locket.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.locket.tolerations }}
      tolerations:
        {{- toYaml .Values.locket.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: cert-server
          secret:
            secretName: {{ required "locket.certificateSecrets.server is required" .Values.locket.certificateSecrets.server }}
        - name: cert-loggregator
          secret:
            secretName: {{ required "locket.certificateSecrets.loggregator is required" .Values.locket.certificateSecrets.loggregator }}
        {{- if .Values.locket.db.requireSSL }}
        - name: cert-database-ca
          secret:
            secretName: {{ required "locket.certificateSecrets.databaseCA is required when db.requireSSL" .Values.locket.certificateSecrets.databaseCA }}
        {{- end }}
        - name: locket-config
          secret:
            secretName: locket-config
---
kind: Service
apiVersion: v1
metadata:
  name: locket
  {{- if or .Values.commonAnnotations .Values.locket.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.locket.serviceAnnotations }}
    {{- toYaml .Values.locket.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: locket
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.locket.serviceLabels }}
    {{- toYaml .Values.locket.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: 8891
      targetPort: 8891
      protocol: TCP
  selector:
    app.kubernetes.io/name: locket
{{- end }}
