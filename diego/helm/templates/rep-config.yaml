{{- if .Values.rep.enabled }}
{{- $r := .Values.rep }}
{{- if lt (int $r.containers.gracefulShutdownIntervalInSeconds) 10 }}{{- fail "rep.containers.gracefulShutdownIntervalInSeconds cannot be less than 10" }}{{- end }}
{{- if lt (int $r.containers.proxy.additionalMemoryAllocationMb) 0 }}{{- fail "rep.containers.proxy.additionalMemoryAllocationMb cannot be negative" }}{{- end }}
{{- if gt (int $r.locket.clientKeepaliveTime) (int $r.locket.clientKeepaliveTimeout) }}{{- fail "rep.locket.clientKeepaliveTime must not be larger than clientKeepaliveTimeout" }}{{- end }}
{{- if and $r.containers.proxy.requireAndVerifyClientCertificates (empty $r.containers.proxy.trustedCaCertificates) }}{{- fail "rep.containers.proxy.trustedCaCertificates must be a non-empty array when requireAndVerifyClientCertificates is true" }}{{- end }}
{{- if lt (int $r.executor.instanceIdentityValidityPeriodInHours) 1 }}{{- fail "rep.executor.instanceIdentityValidityPeriodInHours should be a positive integer" }}{{- end }}
{{- if not (or (eq $r.containers.layeringMode "single-layer") (eq $r.containers.layeringMode "two-layer")) }}{{- fail "rep.containers.layeringMode should be one of: single-layer or two-layer" }}{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rep-configmap
data:
  rep.json: |-
    {
      "cell_id": "$NODE_UID",
      "cell_index": 0,
      "zone": "$ZONE",
      "placement_tags": $PLACEMENT_TAGS,
      "optional_placement_tags": $OPTIONAL_PLACEMENT_TAGS,
      "communication_timeout": "{{ $r.bbs.requestTimeout }}",
      "lock_retry_interval": "5s",
      "lock_ttl": "{{ $r.locket.lockTtl }}s",
      "session_name": "rep",
      "reserved_expiration_time": "1m",
      "container_reap_interval": "1m",
      "container_owner_name": "executor",
      "healthcheck_container_owner_name": "executor-health-check",
      "envoy_config_reload_duration": "{{ $r.containers.proxy.configurationReloadDuration }}",
      "envoy_drain_timeout": "15m",
      "advertise_domain": "{{ tpl $r.advertiseDomain . }}",
      "advertise_preference_for_instance_address": {{ $r.advertisePreferenceForInstanceAddress }},
      "auto_disk_capacity_overhead_mb": {{ $r.executor.autoDiskCapacityOverheadMb }},
      "cache_path": "/var/lib/rep/download_cache",
      "cell_registrations_locket_enabled": {{ $r.cellRegistrations.locket.enabled }},
      "container_inode_limit": {{ $r.executor.containerInodeLimit }},
      "container_max_cpu_shares": {{ $r.executor.containerMaxCpuShares }},
      "set_cpu_weight": {{ $r.containers.setCpuWeight }},
      "create_work_pool_size": {{ $r.executor.createWorkPoolSize }},
      "debug_address": "{{ $r.debugAddr }}",
      "delete_work_pool_size": {{ $r.executor.deleteWorkPoolSize }},
      "disk_mb": "{{ $r.executor.diskCapacityMb }}",
      "declarative_healthcheck_path": "/var/lib/rep/healthcheck",
      "declarative_healthcheck_default_timeout": "{{ $r.executor.declarativeHealthcheckDefaultTimeout }}",
      "enable_healthcheck_metrics": {{ $r.enableHealthcheckMetrics }},
      "enable_container_proxy": true,
      "container_proxy_require_and_verify_client_certs": {{ $r.containers.proxy.requireAndVerifyClientCertificates }},
      "container_proxy_trusted_ca_certs": {{ $r.containers.proxy.trustedCaCertificates | toJson }},
      "container_proxy_verify_subject_alt_name": {{ $r.containers.proxy.verifySubjectAltName | toJson }},
      "container_proxy_ads_addresses": {{ $r.containers.proxy.adsAddresses | toJson }},
      "proxy_healthcheck_interval": "{{ $r.executor.proxyHealthcheckInterval }}",
      "enable_container_proxy_healthcheck": {{ $r.executor.enableContainerProxyHealthcheck }},
      "enable_unproxied_port_mappings": {{ $r.containers.proxy.enableUnproxiedPortMappings }},
      "proxy_memory_allocation_mb": {{ $r.containers.proxy.additionalMemoryAllocationMb }},
      "proxy_enable_http2": {{ $r.containers.proxy.enableHttp2 }},
      "container_proxy_path": "/var/lib/rep/proxy",
      "container_proxy_config_path": "/var/lib/rep/proxy_config",
      "log_container_network_info": {{ $r.logContainerNetworkInfo }},
      "evacuation_polling_interval": "{{ $r.evacuationPollingIntervalInSeconds }}s",
      "evacuation_timeout": "{{ $r.evacuationTimeoutInSeconds }}s",
      "disk_health_check_paths": {{ $r.diskHealthCheckPaths | toJson }},
      "disk_health_check_interval": "{{ $r.diskHealthCheckInterval }}",
      "disk_health_check_failure_threshold": {{ $r.diskHealthCheckFailureThreshold }},
      "health_check_listen_addr": "{{ $r.healthCheckListenAddr }}",
      "extra_root_fs_dir": "{{ $r.extraRootFsDir }}",
      "garden_addr": "{{ $r.executor.garden.address }}",
      "garden_healthcheck_interval": "10m",
      "garden_healthcheck_process_path": "/bin/sh",
      "garden_healthcheck_process_user": "vcap",
      "graceful_shutdown_interval": "{{ $r.containers.gracefulShutdownIntervalInSeconds }}s",
      "healthcheck_work_pool_size": {{ $r.executor.healthcheckWorkPoolSize }},
      "healthy_monitoring_interval": "{{ $r.executor.healthyMonitoringIntervalInSeconds }}s",
      "unhealthy_monitoring_interval": "{{ $r.executor.unhealthyMonitoringIntervalInSeconds }}s",
      "listen_addr": "{{ $r.listenAddrAdmin }}",
      "listen_addr_securable": "{{ $r.listenAddrSecurable }}",
      "log_level": "{{ $r.logLevel }}",
      "log_rate_limit_exceeded_report_interval": "5m",
      "max_cache_size_in_bytes": {{ $r.executor.maxCacheSizeInBytes | int64 }},
      "min_cache_partition_free_bytes": {{ $r.executor.minCachePartitionFreeBytes | int64 }},
      "max_concurrent_downloads": {{ $r.executor.maxConcurrentDownloads }},
      "memory_mb": "{{ $r.executor.memoryCapacityMb }}",
      "metrics_work_pool_size": {{ $r.executor.metricsWorkPoolSize }},
      "read_work_pool_size": {{ $r.executor.readWorkPoolSize }},
      "polling_interval": "{{ $r.pollingIntervalInSeconds }}s",
      {{- $stacks := list }}{{- range $stack, $image := $r.stacks }}{{- $stacks = append $stacks (printf "%s:%s" $stack $image) }}{{- end }}
      "preloaded_root_fs": {{ $stacks | toJson }},
      "sidecar_root_fs": "{{ $r.sidecarRootfs }}",
      "skip_cert_verify": {{ $r.ssl.skipCertVerify }},
      "supported_providers": {{ $r.rootfsProviders | toJson }},
      "temp_dir": "/tmp",
      "use_schedulable_disk_size": {{ $r.executor.useSchedulableDiskSize }},
      "report_interval": "1m",
      "max_data_string_length": {{ $r.logging.maxDataStringLength }},
      "max_log_lines_per_second": {{ $r.executor.maxLogLinesPerSecond }},
      "volume_mounted_files": "/var/lib/rep/volume_mounted_files",
      "volman_driver_paths": "{{ $r.executor.volman.driverPaths }}",
      "inject_workload_identity": {{ $r.executor.injectWorkloadIdentity }},
      "container_metrics_report_interval": "{{ $r.executor.containerMetricsReportInterval }}",
      {{- $ca := deepCopy $r.cellAnnotations }}{{- $_ := set $ca "deployment_guid" $.Release.Namespace }}
      "cell_annotations": {{ $ca | toJson }},
      {{- if $r.containers.trustedCaCertificates }}
      "trusted_system_certificates_path": "/var/lib/rep/trusted_certs",
      {{- end }}
      {{- if not (kindIs "invalid" $r.bbs.clientSessionCacheSize) }}
      "bbs_client_session_cache_size": {{ $r.bbs.clientSessionCacheSize }},
      {{- end }}
      {{- if not (kindIs "invalid" $r.bbs.maxIdleConnsPerHost) }}
      "bbs_max_idle_conns_per_host": {{ $r.bbs.maxIdleConnsPerHost }},
      {{- end }}
      {{- if $r.executor.postSetupHook }}
      "post_setup_hook": "{{ $r.executor.postSetupHook }}",
      {{- end }}
      {{- if $r.executor.postSetupUser }}
      "post_setup_user": "{{ $r.executor.postSetupUser }}",
      {{- end }}
      "locket_address": "{{ tpl $r.locket.apiLocation . }}",
      "locket_client_keepalive_time": {{ $r.locket.clientKeepaliveTime }},
      "locket_client_keepalive_timeout": {{ $r.locket.clientKeepaliveTimeout }},
      "locket_ca_cert_file": "/etc/ssl/certs/locket/ca.crt",
      "locket_client_cert_file": "/etc/ssl/certs/locket/tls.crt",
      "locket_client_key_file": "/etc/ssl/certs/locket/tls.key",
      "path_to_tls_ca_cert": "/etc/ssl/certs/rep/ca.crt",
      "path_to_tls_cert": "/etc/ssl/certs/rep/tls.crt",
      "path_to_tls_key": "/etc/ssl/certs/rep/tls.key",
      "ca_cert_file": "/etc/ssl/certs/rep/ca.crt",
      "cert_file": "/etc/ssl/certs/rep/tls.crt",
      "key_file": "/etc/ssl/certs/rep/tls.key",
      "bbs_address": "https://{{ tpl $r.bbs.apiLocation . }}",
      "instance_identity_ca_path": "/etc/ssl/certs/instance-identity/tls.crt",
      "instance_identity_private_key_path": "/etc/ssl/certs/instance-identity/tls.key",
      "instance_identity_cred_dir": "/var/lib/rep/instance_identity",
      "instance_identity_validity_period": "{{ $r.executor.instanceIdentityValidityPeriodInHours }}h",
      "time_format": "rfc3339",
      "layering_mode": "{{ $r.containers.layeringMode }}",
      "use_kubernetes_garden_client": true,
      "workloads_namespace": "{{ $r.workloadsNamespace }}",
      "kubelet_skip_tls_verify": true,
      {{- include "diego.loggregatorConfig" (dict "cfg" $r.loggregator "jobName" "rep" "origin" "rep" "sourceId" "rep" "root" .) | nindent 6 }}
    }
{{- end }}
