{{- if .Values.bbs.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: bbs
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: bbs
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.bbs.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bbs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbs
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.bbs.podLabels }}
        {{- toYaml .Values.bbs.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/bbs-config: {{ include (print $.Template.BasePath "/bbs-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.bbs.podAnnotations }}
        {{- toYaml .Values.bbs.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
        - name: bbs-init
          image: mikefarah/yq:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              yq '.uuid = strenv(POD_NAME)' /bbs/bbs.json > /tmp/bbs.json
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: bbs-config
              mountPath: /bbs
            - name: tmp
              mountPath: /tmp
      containers:
        - name: bbs
          image: {{ .Values.bbs.image.repository }}:{{ default .Chart.AppVersion .Values.bbs.image.tag }}
          imagePullPolicy: {{ .Values.bbs.image.imagePullPolicy }}
          args:
            - "-config"
            - "/tmp/bbs.json"
          ports:
            - containerPort: 8889
          {{- if .Values.bbs.resources }}
          resources:
            {{- toYaml .Values.bbs.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cert-server
              mountPath: /etc/ssl/certs/server
              readOnly: true
            - name: cert-auctioneer
              mountPath: /etc/ssl/certs/auctioneer
              readOnly: true
            - name: cert-rep
              mountPath: /etc/ssl/certs/rep
              readOnly: true
            - name: cert-loggregator
              mountPath: /etc/ssl/certs/loggregator
              readOnly: true
            {{- if .Values.bbs.db.requireSSL }}
            - name: cert-database-ca
              mountPath: /etc/ssl/certs/database-ca
              readOnly: true
            {{- end }}
            - name: bbs-config
              mountPath: /bbs
            - name: tmp
              mountPath: /tmp
      {{- if .Values.bbs.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.bbs.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.bbs.tolerations }}
      tolerations:
        {{- toYaml .Values.bbs.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: cert-server
          secret:
            secretName: {{ required "bbs.certificateSecrets.server is required" .Values.bbs.certificateSecrets.server }}
        - name: cert-auctioneer
          secret:
            secretName: {{ required "bbs.certificateSecrets.auctioneer is required" .Values.bbs.certificateSecrets.auctioneer }}
        - name: cert-rep
          secret:
            secretName: {{ required "bbs.certificateSecrets.rep is required" .Values.bbs.certificateSecrets.rep }}
        - name: cert-loggregator
          secret:
            secretName: {{ required "bbs.certificateSecrets.loggregator is required" .Values.bbs.certificateSecrets.loggregator }}
        {{- if .Values.bbs.db.requireSSL }}
        - name: cert-database-ca
          secret:
            secretName: {{ required "bbs.certificateSecrets.databaseCA is required when db.requireSSL" .Values.bbs.certificateSecrets.databaseCA }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: bbs-config
          secret:
            secretName: bbs-config
---
kind: Service
apiVersion: v1
metadata:
  name: bbs
  {{- if or .Values.commonAnnotations .Values.bbs.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.bbs.serviceAnnotations }}
    {{- toYaml .Values.bbs.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: bbs
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.bbs.serviceLabels }}
    {{- toYaml .Values.bbs.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: 8889
      targetPort: 8889
      protocol: TCP
  selector:
    app.kubernetes.io/name: bbs
{{- end }}
