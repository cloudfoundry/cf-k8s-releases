{{- if .Values.bbs.enabled }}
{{- $b := .Values.bbs }}
{{- $db := .Values.bbs.db }}
{{- $_ := required "bbs.db.password must be provided" $db.password }}
{{- $_ := required "bbs.activeKeyLabel must be provided" $b.activeKeyLabel }}
{{- if empty $b.encryptionKeys }}{{- fail "bbs.encryptionKeys must be provided (map of label -> passphrase)" }}{{- end }}
{{- if gt (int $b.locket.clientKeepaliveTime) (int $b.locket.clientKeepaliveTimeout) }}
{{- fail "bbs.locket.clientKeepaliveTime must not be larger than clientKeepaliveTimeout" }}
{{- end }}
{{- if and $b.metrics.advancedMetrics.enabled (and (empty $b.metrics.advancedMetrics.routeConfig.requestCount) (empty $b.metrics.advancedMetrics.routeConfig.requestLatency)) }}
{{- fail "bbs.metrics.advancedMetrics.routeConfig.requestCount and requestLatency cannot both be empty when advancedMetrics.enabled" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bbs-config
stringData:
  bbs.json: |-
    {
      "session_name": "bbs",
      "require_ssl": true,
      "communication_timeout": "10s",
      "desired_lrp_creation_timeout": "1m",
      "lock_ttl": "15s",
      "lock_retry_interval": "5s",
      "report_interval": "1m",
      "convergence_workers": 20,
      "update_workers": 1000,
      "task_callback_workers": 1000,
      "time_format": "rfc3339",
      "listen_address": "{{ $b.listenAddr }}",
      "health_address": "{{ $b.healthAddr }}",
      "debug_address": "{{ $b.debugAddr }}",
      "log_level": "{{ $b.logLevel }}",
      "debug_lrp_start_heartbeats": {{ $b.debugLrpStartHeartbeats }},
      "health_check_failure_threshold": {{ $b.healthCheckFailureThreshold }},
      "health_check_timeout": "{{ $b.healthCheckTimeout }}s",
      "health_check_interval": "{{ $b.healthCheckInterval }}s",
      "enable_db_health_check": {{ $b.enableDBHealthCheck }},
      "max_task_retries": {{ $b.tasks.maxRetries }},
      "max_data_string_length": {{ $b.logging.maxDataStringLength }},
      "cell_registrations_locket_enabled": {{ $b.cellRegistrations.locket.enabled }},
      "rep_client_session_cache_size": {{ $b.rep.clientSessionCacheSize }},
      "active_key_label": "{{ $b.activeKeyLabel }}",
      "encryption_keys": {{ $b.encryptionKeys | toJson }},
      "database_connection_string": "{{ include "diego.sqlConnectionString" (dict "db" $db "root" $) }}",
      "database_driver": "{{ $db.driver }}",
      "max_open_database_connections": {{ $db.maxOpenConnections }},
      "max_idle_database_connections": {{ $db.maxIdleConnections }},
      "max_database_connection_lifetime": "{{ $db.maxConnectionLifetime }}s",
      "db_connection_timeout": "{{ $db.dbConnectionTimeout }}s",
      "db_read_timeout": "{{ $db.dbReadTimeout }}s",
      "db_write_timeout": "{{ $db.dbWriteTimeout }}s",
      {{- if $db.requireSSL }}
      "sql_ca_cert_file": "/etc/ssl/certs/database-ca/ca.crt",
      "sql_enable_identity_verification": {{ $db.enableIdentityVerification }},
      {{- end }}
      "converge_repeat_interval": "{{ $b.convergence.repeatIntervalInSeconds }}s",
      "kick_task_duration": "{{ $b.convergence.kickTaskDurationInSeconds }}s",
      "expire_completed_task_duration": "{{ $b.convergence.expireCompletedTaskDurationInSeconds }}s",
      "expire_pending_task_duration": "{{ $b.convergence.expirePendingTaskDurationInSeconds }}s",
      "advertise_url": "{{ tpl $b.advertiseUrl $ }}",
      "auctioneer_address": "https://{{ tpl $b.auctioneer.apiLocation $ }}",
      "auctioneer_require_tls": {{ $b.auctioneer.requireTls }},
      "auctioneer_ca_cert": "/etc/ssl/certs/auctioneer/ca.crt",
      "auctioneer_client_cert": "/etc/ssl/certs/auctioneer/tls.crt",
      "auctioneer_client_key": "/etc/ssl/certs/auctioneer/tls.key",
      "rep_ca_cert": "/etc/ssl/certs/rep/ca.crt",
      "rep_client_cert": "/etc/ssl/certs/rep/tls.crt",
      "rep_client_key": "/etc/ssl/certs/rep/tls.key",
      "ca_file": "/etc/ssl/certs/server/ca.crt",
      "cert_file": "/etc/ssl/certs/server/tls.crt",
      "key_file": "/etc/ssl/certs/server/tls.key",
      "locket_address": "{{ tpl $b.locket.apiLocation $ }}",
      "uuid": "$POD_NAME",
      "locket_ca_cert_file": "/etc/ssl/certs/server/ca.crt",
      "locket_client_cert_file": "/etc/ssl/certs/server/tls.crt",
      "locket_client_key_file": "/etc/ssl/certs/server/tls.key",
      "locket_client_keepalive_time": {{ $b.locket.clientKeepaliveTime }},
      "locket_client_keepalive_timeout": {{ $b.locket.clientKeepaliveTimeout }},
      {{- if $b.enableAccessLog }}
      "access_log_path": "/dev/stdout",
      {{- end }}
      {{- if $b.metrics.advancedMetrics.enabled }}
      "advanced_metrics": {
        "enabled": true,
        "route_config": {
          "request_count": {{ $b.metrics.advancedMetrics.routeConfig.requestCount | toJson }},
          "request_latency": {{ $b.metrics.advancedMetrics.routeConfig.requestLatency | toJson }}
        }
      },
      {{- end }}
      {{- include "diego.loggregatorConfig" (dict "cfg" $b.loggregator "jobName" "bbs" "origin" "bbs" "sourceId" "bbs" "root" $) | nindent 6 }}
    }
{{- end }}
