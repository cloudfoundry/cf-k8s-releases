{{- if .Values.routeEmitter.enabled }}
{{- $re := .Values.routeEmitter }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: route-emitter
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: route-emitter
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: route-emitter
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: route-emitter
subjects:
- kind: ServiceAccount
  name: route-emitter
  namespace: {{ .Release.Namespace }}
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: route-emitter
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: route-emitter
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: route-emitter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: route-emitter
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.routeEmitter.podLabels }}
        {{- toYaml .Values.routeEmitter.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/route-emitter-config: {{ include (print $.Template.BasePath "/route-emitter-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.routeEmitter.podAnnotations }}
        {{- toYaml .Values.routeEmitter.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: route-emitter
      initContainers:
        - name: route-emitter-init
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              NODE_UID=$(kubectl get node $NODE_NAME -o jsonpath='{.metadata.uid}')
              export NODE_UID
              cat /route-emitter/route-emitter.json | envsubst > /tmp/route-emitter.json
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: route-emitter-config
              mountPath: /route-emitter
            - name: tmp
              mountPath: /tmp
      containers:
        - name: route-emitter
          image: {{ .Values.routeEmitter.image.repository }}:{{ default .Chart.AppVersion .Values.routeEmitter.image.tag }}
          imagePullPolicy: {{ .Values.routeEmitter.image.imagePullPolicy }}
          args:
          - --config
          - /tmp/route-emitter.json
          volumeMounts:
            - name: cert-bbs
              mountPath: /etc/ssl/certs/bbs
              readOnly: true
            - name: cert-loggregator
              mountPath: /etc/ssl/certs/loggregator
              readOnly: true
            {{- if $re.nats.tls.enabled }}
            - name: cert-nats
              mountPath: /etc/ssl/certs/nats
              readOnly: true
            {{- end }}
            {{- if $re.routingApi.enabled }}
            - name: cert-routing-api
              mountPath: /etc/ssl/certs/routing-api
              readOnly: true
            {{- end }}
            {{- if and $re.tcp.enabled $re.routingApi.authEnabled }}
            - name: cert-uaa-ca
              mountPath: /etc/ssl/certs/uaa-ca
              readOnly: true
            {{- end }}
            - name: route-emitter-config
              mountPath: /route-emitter
            - name: tmp
              mountPath: /tmp
          {{- if .Values.routeEmitter.resources }}
          resources:
            {{- toYaml .Values.routeEmitter.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: cert-bbs
          secret:
            secretName: {{ required "routeEmitter.certificateSecrets.bbs is required" $re.certificateSecrets.bbs }}
        - name: cert-loggregator
          secret:
            secretName: {{ required "routeEmitter.certificateSecrets.loggregator is required" $re.certificateSecrets.loggregator }}
        {{- if $re.nats.tls.enabled }}
        - name: cert-nats
          secret:
            secretName: {{ required "routeEmitter.certificateSecrets.nats is required when nats.tls.enabled" $re.certificateSecrets.nats }}
        {{- end }}
        {{- if $re.routingApi.enabled }}
        - name: cert-routing-api
          secret:
            secretName: {{ required "routeEmitter.certificateSecrets.routingAPI is required when routingApi.enabled" $re.certificateSecrets.routingAPI }}
        {{- end }}
        {{- if and $re.tcp.enabled $re.routingApi.authEnabled }}
        - name: cert-uaa-ca
          secret:
            secretName: {{ required "routeEmitter.certificateSecrets.uaaCA is required when tcp.enabled and routingApi.authEnabled" $re.certificateSecrets.uaaCA }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: route-emitter-config
          secret:
            secretName: route-emitter-config
      {{- if .Values.routeEmitter.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.routeEmitter.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.routeEmitter.tolerations }}
      tolerations:
        {{- toYaml .Values.routeEmitter.tolerations | nindent 8 }}
      {{- end }}
{{- end }}
