{{- if .Values.sshProxy.enabled }}
{{- $s := .Values.sshProxy }}
{{- if lt (int $s.maxConnectionDurationInSeconds) 0 }}
{{- fail "sshProxy.maxConnectionDurationInSeconds must be a non-negative integer (0 = unlimited)" }}
{{- end }}
{{- if and $s.backends.tls.enabled (not $s.certificateSecrets.backendsTLS) }}
{{- fail "sshProxy.certificateSecrets.backendsTLS is required when backends.tls.enabled is true" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ssh-proxy-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
stringData:
  ssh-proxy.json: |-
    {
      "address": "{{ $s.listenAddr }}",
      "health_check_address": "{{ $s.healthcheckListenAddr }}",
      "disable_health_check_server": {{ $s.disableHealthcheckServer }},
      "host_key": {{ required "sshProxy.hostKey must be provided" $s.hostKey | quote }},
      "skip_cert_verify": {{ $s.ssl.skipCertVerify }},
      "log_level": "{{ $s.logLevel }}",
      "debug_address": "{{ $s.debugAddr }}",
      "connect_to_instance_address": {{ $s.connectToInstanceAddress }},
      "communication_timeout": "10s",
      "time_format": "rfc3339",
      {{- if $s.certificateSecrets.ccCA }}
      "cc_api_url": "https://{{ tpl $s.cc.internalServiceHostname $ }}:{{ $s.cc.publicTlsPort }}",
      "cc_api_ca_cert": "/etc/ssl/certs/cc-ca/ca.crt",
      {{- else }}
      "cc_api_url": "http://{{ tpl $s.cc.internalServiceHostname $ }}:{{ $s.cc.externalPort }}",
      {{- end }}
      "idle_connection_timeout": "{{ $s.idleConnectionTimeoutInSeconds }}s",
      {{- if gt (int $s.maxConnectionDurationInSeconds) 0 }}
      "max_connection_duration": "{{ $s.maxConnectionDurationInSeconds }}s",
      {{- end }}
      "bbs_address": "https://{{ tpl $s.bbs.apiLocation $ }}",
      "bbs_ca_cert": "/etc/ssl/certs/bbs/ca.crt",
      "bbs_client_cert": "/etc/ssl/certs/bbs/tls.crt",
      "bbs_client_key": "/etc/ssl/certs/bbs/tls.key",
      {{- if not (kindIs "invalid" $s.bbs.clientSessionCacheSize) }}
      "bbs_client_session_cache_size": {{ $s.bbs.clientSessionCacheSize }},
      {{- end }}
      {{- if not (kindIs "invalid" $s.bbs.maxIdleConnsPerHost) }}
      "bbs_max_idle_conns_per_host": {{ $s.bbs.maxIdleConnsPerHost }},
      {{- end }}
      {{- if $s.enableDiegoAuth }}
      "enable_diego_auth": true,
      "diego_credentials": {{ required "sshProxy.diegoCredentials must be provided when enableDiegoAuth is true" $s.diegoCredentials | quote }},
      {{- else }}
      "enable_diego_auth": false,
      {{- end }}
      {{- if $s.enableCfAuth }}
      "enable_cf_auth": true,
      "uaa_token_url": "{{ tpl $s.uaa.url $ }}:{{ $s.uaa.port }}/oauth/token",
      "uaa_password": {{ required "sshProxy.uaaSecret must be provided when enableCfAuth is true" $s.uaaSecret | quote }},
      "uaa_username": "ssh-proxy",
      {{- if $s.certificateSecrets.uaaCA }}
      "uaa_ca_cert": "/etc/ssl/certs/uaa-ca/ca.crt",
      {{- end }}
      {{- else }}
      "enable_cf_auth": false,
      {{- end }}
      {{- if $s.allowedCiphers }}
      "allowed_ciphers": "{{ $s.allowedCiphers }}",
      {{- end }}
      {{- if $s.allowedMacs }}
      "allowed_macs": "{{ $s.allowedMacs }}",
      {{- end }}
      {{- if $s.allowedKeyexchanges }}
      "allowed_key_exchanges": "{{ $s.allowedKeyexchanges }}",
      {{- end }}
      {{- if $s.allowedHostKeyAlgorithms }}
      "allowed_host_key_algorithms": "{{ $s.allowedHostKeyAlgorithms }}",
      {{- end }}
      "backends_tls_enabled": {{ $s.backends.tls.enabled }},
      {{- if $s.backends.tls.enabled }}
      "backends_tls_ca_certificates": "/etc/ssl/certs/backends-tls/ca.crt",
      "backends_tls_client_certificate": "/etc/ssl/certs/backends-tls/tls.crt",
      "backends_tls_client_private_key": "/etc/ssl/certs/backends-tls/tls.key",
      {{- end }}
      {{- include "diego.loggregatorConfig" (dict "cfg" $s.loggregator "jobName" "ssh_proxy" "origin" "ssh_proxy" "sourceId" "ssh_proxy" "root" $) | nindent 6 }}
    }
{{- end }}
