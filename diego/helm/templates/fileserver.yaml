{{- if .Values.fileserver.enabled }}
---
kind: Service
apiVersion: v1
metadata:
  name: fileserver
  labels:
    app.kubernetes.io/name: fileserver
spec:
  ports:
{{- if .Values.fileserver.httpsServerEnabled }}
    - port: 8443
      name: https
      targetPort: 8443
{{- else }}
    - port: 8080
      name: http
      targetPort: 8080
{{- end }}
  selector:
    app.kubernetes.io/name: fileserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileserver
  labels:
    app.kubernetes.io/name: fileserver
spec:
  replicas: {{ .Values.fileserver.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fileserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fileserver
      annotations:
        checksum/fileserver-config: {{ include (print $.Template.BasePath "/fileserver-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.fileserver.image.repository }}:{{ default .Chart.AppVersion .Values.fileserver.image.tag }}
          imagePullPolicy: {{ .Values.fileserver.image.imagePullPolicy }}
          ports:
{{- if .Values.fileserver.httpsServerEnabled }}
            - name: https
              containerPort: 8443
              protocol: TCP
{{- else }}
            - name: http
              containerPort: 8080
              protocol: TCP
{{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- if .Values.fileserver.httpsServerEnabled }}
            - name: cert-server
              mountPath: /etc/ssl/certs/server
              readOnly: true
            {{- end }}
          {{- if .Values.fileserver.resources }}
          resources:
            {{- toYaml .Values.fileserver.resources | nindent 12 }}
          {{- end }}
      {{- if .Values.fileserver.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.fileserver.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.fileserver.tolerations }}
      tolerations:
        {{- toYaml .Values.fileserver.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: fileserver-config
        {{- if .Values.fileserver.httpsServerEnabled }}
        - name: cert-server
          secret:
            secretName: {{ required "fileserver.certificateSecrets.server is required when httpsServerEnabled" .Values.fileserver.certificateSecrets.server }}
        {{- end }}
{{- end }}
