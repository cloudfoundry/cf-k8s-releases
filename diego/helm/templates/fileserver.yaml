{{- if .Values.fileserver.enabled }}
---
kind: Service
apiVersion: v1
metadata:
  name: fileserver
  labels:
    app.kubernetes.io/name: fileserver
spec:
  ports:
{{- if .Values.fileserver.httpsServerEnabled }}
    - port: 8443
      name: https
      targetPort: 8443
{{- end }}
    - port: 8080
      name: http
      targetPort: 8080
  selector:
    app.kubernetes.io/name: fileserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileserver
  labels:
    app.kubernetes.io/name: fileserver
spec:
  replicas: {{ .Values.fileserver.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fileserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fileserver
      annotations:
        checksum/fileserver-config: {{ include (print $.Template.BasePath "/fileserver-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: fileserver
          image: {{ .Values.fileserver.image.repository }}:{{ default .Chart.AppVersion .Values.fileserver.image.tag }}
          imagePullPolicy: {{ .Values.fileserver.image.imagePullPolicy }}
          args: ["-config", "/etc/fileserver/fileserver.conf"]
          ports:
          {{- if .Values.fileserver.httpsServerEnabled }}
            - name: https
              containerPort: 8443
              protocol: TCP
          {{- end }}
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: fileserver-config
              mountPath: /etc/fileserver/fileserver.conf
              subPath: fileserver.conf
            - name: cert-loggregator
              mountPath: /etc/ssl/certs/loggregator
              readOnly: true
            {{- if .Values.fileserver.httpsServerEnabled }}
            - name: cert-server
              mountPath: /etc/ssl/certs/server
              readOnly: true
            {{- if .Values.fileserver.certificateSecrets.clientCA }}
            - name: cert-client-ca
              mountPath: /etc/ssl/certs/client-ca
              readOnly: true
            {{- end }}
            {{- end }}
          {{- if .Values.fileserver.resources }}
          resources:
            {{- toYaml .Values.fileserver.resources | nindent 12 }}
          {{- end }}
      {{- if .Values.fileserver.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.fileserver.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.fileserver.tolerations }}
      tolerations:
        {{- toYaml .Values.fileserver.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: fileserver-config
          configMap:
            name: fileserver-config
        - name: cert-loggregator
          secret:
            secretName: {{ required "fileserver.certificateSecrets.loggregator is required" .Values.fileserver.certificateSecrets.loggregator }}
        {{- if .Values.fileserver.httpsServerEnabled }}
        - name: cert-server
          secret:
            secretName: {{ required "fileserver.certificateSecrets.server is required when httpsServerEnabled" .Values.fileserver.certificateSecrets.server }}
        {{- if .Values.fileserver.certificateSecrets.clientCA }}
        - name: cert-client-ca
          secret:
            secretName: {{ .Values.fileserver.certificateSecrets.clientCA }}
        {{- end }}
        {{- end }}
{{- end }}
