{{- if .Values.policyServer.enabled }}
{{ $_ := required ".Values.policyServer.networkpolicydb.password must be provided" .Values.policyServer.networkpolicydb.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: policy-server-config
stringData:
  policy-server.json: |-
    {
      "listen_host": "{{ .Values.policyServer.listenIp }}",
      "listen_port": {{ .Values.policyServer.listenPort }},
      "log_prefix": "cfnetworking",
      "debug_server_host": "127.0.0.1",
      "enable_tls": {{ .Values.policyServer.enableTls }},
      "ca_cert_file": "/etc/ssl/certs/policy-server/ca.crt",
      "server_cert_file": "/etc/ssl/certs/policy-server/tls.crt",
      "server_key_file": "/etc/ssl/certs/policy-server/tls.key",
      "debug_server_port": {{ .Values.policyServer.debugPort }},
      "uaa_client": "{{ .Values.policyServer.uaaClient }}",
      "uaa_client_secret": {{ .Values.policyServer.oauthClientsSecret | quote }},
      "uaa_url": "https://uaa.{{ .Release.Namespace }}.svc.cluster.local",
      "uaa_port": {{ .Values.policyServer.uaaPort }},
      "cc_url": "https://cloud-controller.{{ .Release.Namespace }}.svc.cluster.local:9024",
      "cc_ca_cert": "/etc/ssl/certs/policy-server-cc/ca.crt",
      "skip_ssl_validation": {{ .Values.policyServer.skipSSLValidation }},
      "database": {
        "type": "{{ .Values.policyServer.networkpolicydb.type }}",
        "user": {{ .Values.policyServer.networkpolicydb.user | quote }},
        "password": {{ .Values.policyServer.networkpolicydb.password | quote }},
        "host": "{{ tpl .Values.policyServer.networkpolicydb.address . }}",
        "port": {{ .Values.policyServer.networkpolicydb.port }},
        "timeout": {{ .Values.policyServer.networkpolicydb.connectTimeoutSeconds }},
        "database_name": "{{ .Values.policyServer.networkpolicydb.name }}",
        "require_ssl": {{ not .Values.policyServer.networkpolicydb.skipSSLVerify }},
        {{- if not .Values.policyServer.networkpolicydb.skipSSLVerify }}
        "ca_cert": "/etc/ssl/certs/networkpolicydb/ca.crt",
        {{- end }}
        "skip_hostname_validation": {{ .Values.policyServer.networkpolicydb.skipHostnameVerify }}
      },
      "database_migration_timeout": 600,
      "max_idle_connections": {{ .Values.policyServer.networkpolicydb.maxIdleConnections }},
      "max_open_connections": {{ .Values.policyServer.networkpolicydb.maxOpenConnections }},
      "connections_max_lifetime_seconds": {{ .Values.policyServer.networkpolicydb.connectionsMaxLifetimeSeconds }},
      "tag_length": {{ .Values.policyServer.tagLength }},
      "metron_address": "127.0.0.1:{{ .Values.policyServer.metronPort }}",
      "log_level": "{{ .Values.policyServer.logLevel }}",
      "cleanup_interval": {{ mul .Values.policyServer.policyCleanupInterval 60 }},
      "max_policies": {{ .Values.policyServer.maxPoliciesPerAppSource }},
      "enable_space_developer_self_service": {{ .Values.policyServer.enableSpaceDeveloperSelfService }},
      "allowed_cors_domains": {{ .Values.policyServer.allowedCorsDomains | toJson }},
      "uaa_ca": "/etc/ssl/certs/policy-server-uaa/ca.crt",
      "request_timeout": 5
    }
  policy-server-internal.json: |-
    {
      "listen_host": "{{ .Values.policyServer.listenIp }}",
      "log_prefix": "cfnetworking",
      "debug_server_host": "127.0.0.1",
      "debug_server_port": {{ .Values.policyServer.internal.debugPort }},
      "health_check_port": 31946,
      "internal_listen_port": {{ .Values.policyServer.internal.listenPort }},
      "database": {
        "type": "{{ .Values.policyServer.networkpolicydb.type }}",
        "user": {{ .Values.policyServer.networkpolicydb.user | quote }},
        "password": {{ .Values.policyServer.networkpolicydb.password | quote }},
        "host": "{{ tpl .Values.policyServer.networkpolicydb.address . }}",
        "port": {{ .Values.policyServer.networkpolicydb.port }},
        "timeout": {{ .Values.policyServer.networkpolicydb.connectTimeoutSeconds }},
        "database_name": "{{ .Values.policyServer.networkpolicydb.name }}",
        "require_ssl": {{ not .Values.policyServer.networkpolicydb.skipSSLVerify }},
        {{- if not .Values.policyServer.networkpolicydb.skipSSLVerify }}
        "ca_cert": "/etc/ssl/certs/networkpolicydb/ca.crt",
        {{- end }}
        "skip_hostname_validation": {{ .Values.policyServer.networkpolicydb.skipHostnameVerify }}
      },
      "max_idle_connections": {{ .Values.policyServer.networkpolicydb.maxIdleConnections }},
      "max_open_connections": {{ .Values.policyServer.networkpolicydb.maxOpenConnections }},
      "connections_max_lifetime_seconds": {{ .Values.policyServer.networkpolicydb.connectionsMaxLifetimeSeconds }},
      "tag_length": {{ .Values.policyServer.tagLength }},
      "metron_address": "127.0.0.1:{{ .Values.policyServer.metronPort }}",
      "log_level": "{{ .Values.policyServer.logLevel }}",
      "ca_cert_file": "/etc/ssl/certs/policy-server-internal/ca.crt",
      "server_cert_file": "/etc/ssl/certs/policy-server-internal/tls.crt",
      "server_key_file": "/etc/ssl/certs/policy-server-internal/tls.key",
      "request_timeout": 5
      }
  policy-server-asg-syncer.json: |-
    {
      "uuid": "07c65e06-b676-4f4a-a37f-96df62d387d7",
      "database": {
          "type": "{{ .Values.policyServer.networkpolicydb.type }}",
          "user": {{ .Values.policyServer.networkpolicydb.user | quote }},
          "password": {{ .Values.policyServer.networkpolicydb.password | quote }},
          "host": "{{ tpl .Values.policyServer.networkpolicydb.address . }}",
          "port": {{ .Values.policyServer.networkpolicydb.port }},
          "timeout": {{ .Values.policyServer.networkpolicydb.connectTimeoutSeconds }},
          "database_name": "{{ .Values.policyServer.networkpolicydb.name }}",
          "require_ssl": {{ not .Values.policyServer.networkpolicydb.skipSSLVerify }},
            {{- if not .Values.policyServer.networkpolicydb.skipSSLVerify }}
            "ca_cert": "/etc/ssl/certs/networkpolicydb/ca.crt",
            {{- end }}
          "skip_hostname_validation": {{ .Values.policyServer.networkpolicydb.skipHostnameVerify }}
      },
      "uaa_client": "{{ .Values.policyServer.uaaClient }}",
      "uaa_client_secret": {{ .Values.policyServer.oauthClientsSecret | quote }},
      "uaa_url": "https://uaa.{{ .Release.Namespace }}.svc.cluster.local",
      "uaa_port": {{ .Values.policyServer.uaaPort }},
      "uaa_ca": "/etc/ssl/certs/policy-server-uaa/ca.crt",
      "cc_url": "https://cloud-controller.{{ .Release.Namespace }}.svc.cluster.local:9024",
      "cc_ca_cert": "/etc/ssl/certs/policy-server-cc/ca.crt",
      "cc_internal_url": "https://cloud-controller.{{ .Release.Namespace }}.svc.cluster.local:9023",
      "cc_internal_ca_cert": "/etc/ssl/certs/policy-server-cc-internal/ca.crt",
      "cc_internal_client_cert": "/etc/ssl/certs/policy-server-cc-internal/tls.crt",
      "cc_internal_client_key": "/etc/ssl/certs/policy-server-cc-internal/tls.key",
      "log_prefix": "cfnetworking",
      "log_level": "{{ .Values.policyServer.logLevel }}",
      "metron_address": "127.0.0.1:{{ .Values.policyServer.metronPort }}",
      "skip_ssl_validation": {{ .Values.policyServer.skipSSLValidation }},
      "asg_poll_interval_seconds": {{ .Values.policyServer.asgPollIntervalSeconds }},
      "retry_deadline_seconds": {{ .Values.policyServer.retryDeadlineSeconds }},
      "locket_address": "locket.{{ .Release.Namespace }}.svc.cluster.local:8891",
      "locket_ca_cert_file": "/etc/ssl/certs/policy-server-locket/ca.crt",
      "locket_client_cert_file": "/etc/ssl/certs/policy-server-locket/tls.crt",
      "locket_client_key_file": "/etc/ssl/certs/policy-server-locket/tls.key"
    }
{{- end }}