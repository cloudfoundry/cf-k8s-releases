{{- if .Values.policyServer.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: policy-server
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: policy-server
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.policyServer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: policy-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policy-server
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.policyServer.podLabels }}
        {{- toYaml .Values.policyServer.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/policy-server-config: {{ include (print $.Template.BasePath "/policy-server-config.yaml") . | sha256sum }}
        checksum/policy-server-route-registrar-config: {{ include (print $.Template.BasePath "/policy-server-route-registrar-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.policyServer.podAnnotations }}
        {{- toYaml .Values.policyServer.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
        - name: render-asg-syncer-config
          image: mikefarah/yq:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              yq -p=json -o=json '.uuid = strenv(POD_NAME)' /policy-server/policy-server-asg-syncer.json > /asg-syncer-config/policy-server-asg-syncer.json
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: policy-server-config
              mountPath: /policy-server
            - name: asg-syncer-config
              mountPath: /asg-syncer-config
      containers:
        - name: policy-server
          image: {{ .Values.policyServer.image.repository }}:{{ default .Chart.AppVersion .Values.policyServer.image.tag }}
          imagePullPolicy: {{ .Values.policyServer.image.imagePullPolicy }}
          command: [ "/usr/local/bin/policy-server" ]
          args:
          - -config-file
          - /policy-server/policy-server.json
          volumeMounts:
            - name: policy-server-config
              mountPath: /policy-server
            - name: policy-server
              mountPath: /etc/ssl/certs/policy-server
              readOnly: true
            - name: policy-server-uaa
              mountPath: /etc/ssl/certs/policy-server-uaa
              readOnly: true
            - name: policy-server-cc
              mountPath: /etc/ssl/certs/policy-server-cc
              readOnly: true
            {{- if .Values.policyServer.database.requireSSL }}
            - name: database-ca
              mountPath: /etc/ssl/certs/database
              readOnly: true
            {{- end }}
          {{- if .Values.policyServer.resources }}
          resources:
            {{- toYaml .Values.policyServer.resources | nindent 12 }}
          {{- end }}
        - name: policy-server-internal
          image: {{ .Values.policyServer.image.repository }}:{{ default .Chart.AppVersion .Values.policyServer.image.tag }}
          imagePullPolicy: {{ .Values.policyServer.image.imagePullPolicy }}
          command: [ "/usr/local/bin/policy-server-internal" ]
          args:
          - -config-file
          - /policy-server/policy-server-internal.json
          volumeMounts:
            - name: policy-server-config
              mountPath: /policy-server
            - name: policy-server-internal
              mountPath: /etc/ssl/certs/policy-server-internal
              readOnly: true
            {{- if .Values.policyServer.database.requireSSL }}
            - name: database-ca
              mountPath: /etc/ssl/certs/database
              readOnly: true
            {{- end }}
          {{- if .Values.policyServer.resources }}
          resources:
            {{- toYaml .Values.policyServer.resources | nindent 12 }}
          {{- end }}
        - name: asg-syncer
          image: {{ .Values.policyServer.image.repository }}:{{ default .Chart.AppVersion .Values.policyServer.image.tag }}
          imagePullPolicy: {{ .Values.policyServer.image.imagePullPolicy }}
          command: [ "/usr/local/bin/policy-server-asg-syncer" ]
          args:
          - -config-file
          - /asg-syncer-config/policy-server-asg-syncer.json
          volumeMounts:
            - name: asg-syncer-config
              mountPath: /asg-syncer-config
            - name: policy-server-uaa
              mountPath: /etc/ssl/certs/policy-server-uaa
              readOnly: true
            - name: policy-server-cc
              mountPath: /etc/ssl/certs/policy-server-cc
              readOnly: true
            - name: policy-server-cc-internal
              mountPath: /etc/ssl/certs/policy-server-cc-internal
              readOnly: true
            - name: policy-server-locket
              mountPath: /etc/ssl/certs/policy-server-locket
              readOnly: true
            {{- if .Values.policyServer.database.requireSSL }}
            - name: database-ca
              mountPath: /etc/ssl/certs/database
              readOnly: true
            {{- end }}
          {{- if .Values.policyServer.resources }}
          resources:
            {{- toYaml .Values.policyServer.resources | nindent 12 }}
          {{- end }}
        - name: route-registrar
          image: {{ .Values.routeRegistrar.image.repository }}:{{ .Values.routeRegistrar.image.tag }}
          imagePullPolicy: {{ .Values.routeRegistrar.image.imagePullPolicy }}
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if .Values.routeRegistrar.resources }}
          resources:
            {{- toYaml .Values.routeRegistrar.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: route-registrar-nats
              mountPath: /etc/ssl/certs/route-registrar-nats
            - name: etc-route-registrar
              mountPath: /etc/route-registrar-template
            - name: tmpdir
              mountPath: /tmp
        - name: udp-forwarder
          image: {{ .Values.udpForwarder.image.repository }}:{{ .Values.udpForwarder.image.tag }}
          imagePullPolicy: {{ .Values.udpForwarder.image.imagePullPolicy }}
          {{- if .Values.udpForwarder.resources }}
          resources:
            {{- toYaml .Values.udpForwarder.resources | nindent 12 }}
          {{- end }}
          env:
            - name: UDP_PORT
              value: "3457"
            - name: LOGGREGATOR_AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: LOGGREGATOR_AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: LOGGREGATOR_AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
            - name: LOGGREGATOR_AGENT_ADDR
              value: "{{ tpl .Values.udpForwarder.metronEndpoint.host . }}:{{ .Values.udpForwarder.metronEndpoint.port }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
          volumeMounts:
            - name: udp-forwarder
              mountPath: /etc/ssl/certs/udp-forwarder
      {{- if .Values.policyServer.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.policyServer.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.policyServer.tolerations }}
      tolerations:
        {{- toYaml .Values.policyServer.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: policy-server-config
          secret:
            secretName: policy-server-config
        - name: policy-server
          secret:
            secretName: {{ required "policyServer.certificateSecrets.serverTLS is required" .Values.policyServer.certificateSecrets.serverTLS }}
        - name: policy-server-uaa
          secret:
            secretName: {{ required "policyServer.certificateSecrets.uaaCA is required" .Values.policyServer.certificateSecrets.uaaCA }}
        - name: policy-server-cc
          secret:
            secretName: {{ required "policyServer.certificateSecrets.ccCA is required" .Values.policyServer.certificateSecrets.ccCA }}
        - name: policy-server-internal
          secret:
            secretName: {{ required "policyServer.certificateSecrets.internalTLS is required" .Values.policyServer.certificateSecrets.internalTLS }}
        - name: policy-server-cc-internal
          secret:
            secretName: {{ required "policyServer.certificateSecrets.ccInternalTLS is required" .Values.policyServer.certificateSecrets.ccInternalTLS }}
        - name: policy-server-locket
          secret:
            secretName: {{ required "policyServer.certificateSecrets.locketTLS is required" .Values.policyServer.certificateSecrets.locketTLS }}
        {{- if .Values.policyServer.database.requireSSL }}
        - name: database-ca
          secret:
            secretName: {{ required "policyServer.certificateSecrets.databaseCA is required when policyServer.database.requireSSL is true" .Values.policyServer.certificateSecrets.databaseCA }}
        {{- end }}
        - name: etc-route-registrar
          configMap:
            name: policy-server-route-registrar-config
        - name: route-registrar-nats
          secret:
            secretName: {{ required "routeRegistrar.certificateSecret is required" .Values.routeRegistrar.certificateSecret }}
        - name: asg-syncer-config
          emptyDir: {}
        - name: tmpdir
          emptyDir: {}
        - name: udp-forwarder
          secret:
            secretName: {{ required "udpForwarder.certificateSecret is required" .Values.udpForwarder.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: policy-server
  {{- if or .Values.commonAnnotations .Values.policyServer.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.policyServer.serviceAnnotations }}
    {{- toYaml .Values.policyServer.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: policy-server
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.policyServer.serviceLabels }}
    {{- toYaml .Values.policyServer.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
  - port: {{ .Values.policyServer.internal.listenPort }}
    name: https
    targetPort: {{ .Values.policyServer.internal.listenPort }}
    appProtocol: kubernetes.io/h2c
  selector:
    app.kubernetes.io/name: policy-server
{{- end }}