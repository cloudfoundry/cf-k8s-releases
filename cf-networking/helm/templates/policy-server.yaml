{{- if .Values.policyServer.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: policy-server
  labels:
    app: policy-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-server
  template:
    metadata:
      labels:
        app: policy-server
      annotations:
        checksum/policy-server-config: {{ include (print $.Template.BasePath "/policy-server-config.yaml") . | sha256sum }}
        checksum/policy-server-route-registrar-config: {{ include (print $.Template.BasePath "/policy-server-route-registrar-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: policy-server
          image: {{ .Values.policyServer.image.repository }}:{{ default .Chart.AppVersion .Values.policyServer.image.tag }}
          imagePullPolicy: {{ .Values.policyServer.image.imagePullPolicy }}
          command: [ "/usr/local/bin/policy-server" ]
          args:
          - -config-file
          - /policy-server/policy-server.json
          volumeMounts:
            - name: policy-server-config
              mountPath: /policy-server
            - name: policy-server
              mountPath: /etc/ssl/certs/policy-server
              readOnly: true
            - name: policy-server-uaa
              mountPath: /etc/ssl/certs/policy-server-uaa
              readOnly: true
            - name: policy-server-cc
              mountPath: /etc/ssl/certs/policy-server-cc
              readOnly: true
            {{- if not .Values.policyServer.networkpolicydb.skipSSLVerify }}
            - name: networkpolicydb-ca
              mountPath: /etc/ssl/certs/networkpolicydb
              readOnly: true
            {{- end }}
          {{- if .Values.policyServer.resources }}
          resources:
            {{- toYaml .Values.policyServer.resources | nindent 12 }}
          {{- end }}
        - name: policy-server-internal
          image: {{ .Values.policyServer.image.repository }}:{{ default .Chart.AppVersion .Values.policyServer.image.tag }}
          imagePullPolicy: {{ .Values.policyServer.image.imagePullPolicy }}
          command: [ "/usr/local/bin/policy-server-internal" ]
          args:
          - -config-file
          - /policy-server/policy-server-internal.json
          livenessProbe:
            httpGet:
              path: /health
              port: 31946
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: policy-server-config
              mountPath: /policy-server
            - name: policy-server-internal
              mountPath: /etc/ssl/certs/policy-server-internal
              readOnly: true
            {{- if not .Values.policyServer.networkpolicydb.skipSSLVerify }}
            - name: networkpolicydb-ca
              mountPath: /etc/ssl/certs/networkpolicydb
              readOnly: true
            {{- end }}
          {{- if .Values.policyServer.resources }}
          resources:
            {{- toYaml .Values.policyServer.resources | nindent 12 }}
          {{- end }}
        - name: asg-syncer
          image: {{ .Values.policyServer.image.repository }}:{{ default .Chart.AppVersion .Values.policyServer.image.tag }}
          imagePullPolicy: {{ .Values.policyServer.image.imagePullPolicy }}
          command: [ "/usr/local/bin/policy-server-asg-syncer" ]
          args:
          - -config-file
          - /policy-server/policy-server-asg-syncer.json
          volumeMounts:
            - name: policy-server-config
              mountPath: /policy-server
            - name: policy-server-uaa
              mountPath: /etc/ssl/certs/policy-server-uaa
              readOnly: true
            - name: policy-server-cc
              mountPath: /etc/ssl/certs/policy-server-cc
              readOnly: true
            - name: policy-server-cc-internal
              mountPath: /etc/ssl/certs/policy-server-cc-internal
              readOnly: true
            - name: policy-server-locket
              mountPath: /etc/ssl/certs/policy-server-locket
              readOnly: true
            {{- if not .Values.policyServer.networkpolicydb.skipSSLVerify }}
            - name: networkpolicydb-ca
              mountPath: /etc/ssl/certs/networkpolicydb
              readOnly: true
            {{- end }}
          {{- if .Values.policyServer.resources }}
          resources:
            {{- toYaml .Values.policyServer.resources | nindent 12 }}
          {{- end }}
        - name: route-registrar
          image: {{ .Values.routeRegistrar.image.repository }}:{{ .Values.routeRegistrar.image.tag }}
          imagePullPolicy: {{ .Values.routeRegistrar.image.imagePullPolicy }}
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if .Values.routeRegistrar.resources }}
          resources:
            {{- toYaml .Values.routeRegistrar.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: policy-server
              mountPath: /etc/ssl/certs/policy-server
            - name: etc-route-registrar
              mountPath: /etc/route-registrar-template
            - name: tmpdir
              mountPath: /tmp
        - name: udp-forwarder
          image: {{ .Values.udpForwarder.image.repository }}:{{ .Values.udpForwarder.image.tag }}
          imagePullPolicy: {{ .Values.udpForwarder.image.imagePullPolicy }}
          {{- if .Values.udpForwarder.resources }}
          resources:
            {{- toYaml .Values.udpForwarder.resources | nindent 12 }}
          {{- end }}
          env:
            - name: UDP_PORT
              value: {{ .Values.policyServer.metronPort | quote }}
            - name: LOGGREGATOR_AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: LOGGREGATOR_AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: LOGGREGATOR_AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
            - name: LOGGREGATOR_AGENT_ADDR
              value: "forwarder-agent.{{ .Release.Namespace }}.svc.cluster.local:3458"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
          volumeMounts:
            - name: udp-forwarder
              mountPath: /etc/ssl/certs/udp-forwarder
      {{- if .Values.policyServer.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.policyServer.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.policyServer.tolerations }}
      tolerations:
        {{- toYaml .Values.policyServer.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: policy-server-config
          secret:
            secretName: policy-server-config
        - name: policy-server
          secret:
            secretName: {{ required "policyServer.certificateSecret is required" .Values.policyServer.certificateSecret }}
        - name: policy-server-uaa
          secret:
            secretName: {{ required "policyServer.uaaCaSecret is required" .Values.policyServer.uaaCaSecret }}
        - name: policy-server-cc
          secret:
            secretName: {{ required "policyServer.ccCaCertSecret is required" .Values.policyServer.ccCaCertSecret }}
        - name: policy-server-internal
          secret:
            secretName: {{ required "policyServer.internal.certificateSecret is required" .Values.policyServer.internal.certificateSecret }}
        - name: policy-server-cc-internal
          secret:
            secretName: {{ required "policyServer.asgSyncer.ccInternalClientSecret is required" .Values.policyServer.asgSyncer.ccInternalClientSecret }}
        - name: policy-server-locket
          secret:
            secretName: {{ required "policyServer.asgSyncer.locketSecret is required" .Values.policyServer.asgSyncer.locketSecret }}
        {{- if not .Values.policyServer.networkpolicydb.skipSSLVerify }}
        - name: networkpolicydb-ca
          secret:
            secretName: {{ required "policyServer.networkpolicydb.caCertificateSecret is required when policyServer.networkpolicydb.skipSSLVerify is false" .Values.policyServer.networkpolicydb.caCertificateSecret }}
        {{- end }}
        - name: etc-route-registrar
          configMap:
            name: policy-server-route-registrar-config
        - name: tmpdir
          emptyDir: {}
        - name: udp-forwarder
          secret:
            secretName: {{ required "udpForwarder.certificateSecret is required" .Values.udpForwarder.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: policy-server
  labels:
    app: policy-server
spec:
  ports:
  - port: {{ .Values.policyServer.internal.listenPort }}
    name: https
    targetPort: {{ .Values.policyServer.internal.listenPort }}
    appProtocol: kubernetes.io/h2c
  selector:
    app: policy-server
{{- end }}