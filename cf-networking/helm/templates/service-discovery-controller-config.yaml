{{- if .Values.serviceDiscoveryController.enabled }}
{{- if le (int64 .Values.serviceDiscoveryController.stalenessThresholdSeconds) (int64 .Values.serviceDiscoveryController.routeEmitterIntervalSeconds) }}
{{- fail "serviceDiscoveryController.stalenessThresholdSeconds must be greater than serviceDiscoveryController.routeEmitterIntervalSeconds" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: service-discovery-controller-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  service-discovery-controller.json: |-
    {
      "address": "{{ .Values.serviceDiscoveryController.address }}",
      "port": "{{ .Values.serviceDiscoveryController.port }}",
      "index": "0",
      "log_level_address": "{{ .Values.serviceDiscoveryController.logLevelAddress }}",
      "log_level_port": {{ .Values.serviceDiscoveryController.logLevelPort }},
      "server_cert": "/etc/ssl/certs/service-discovery-controller/tls.crt",
      "server_key": "/etc/ssl/certs/service-discovery-controller/tls.key",
      "ca_cert": "/etc/ssl/certs/service-discovery-controller-client-ca/ca.crt",
      "metron_port": 3457,
      "staleness_threshold_seconds": {{ .Values.serviceDiscoveryController.stalenessThresholdSeconds }},
      "pruning_interval_seconds": {{ .Values.serviceDiscoveryController.routeEmitterIntervalSeconds }},
      "metrics_emit_seconds": 10,
      "resume_pruning_delay_seconds": {{ .Values.serviceDiscoveryController.routeEmitterIntervalSeconds }},
      "warm_duration_seconds": {{ .Values.serviceDiscoveryController.routeEmitterIntervalSeconds }},
      "read_header_timeout": "{{ .Values.serviceDiscoveryController.readHeaderTimeout }}",
      "nats": {
        "user": {{ .Values.serviceDiscoveryController.nats.user | quote }},
        "pass": {{ .Values.serviceDiscoveryController.nats.password | quote }},
        {{- if .Values.serviceDiscoveryController.nats.tlsEnabled }}
        "tls_enabled": true,
        "ca_certs": "/etc/ssl/certs/service-discovery-controller-nats/ca.crt",
        "cert_chain": "/etc/ssl/certs/service-discovery-controller-nats/tls.crt",
        "private_key": "/etc/ssl/certs/service-discovery-controller-nats/tls.key",
        {{- end }}
        {{- $natsPort := .Values.serviceDiscoveryController.nats.port }}
        {{- $hosts := list }}
        {{- range .Values.serviceDiscoveryController.nats.machines }}
        {{- $hosts = append $hosts (dict "hostname" (tpl . $) "port" $natsPort) }}
        {{- end }}
        "hosts": {{ $hosts | toJson }}
      }
    }
{{- end }}