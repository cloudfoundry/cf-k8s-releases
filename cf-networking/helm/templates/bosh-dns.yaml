{{- if .Values.boshDnsAdapter.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: bosh-dns
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: bosh-dns
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.boshDns.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bosh-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bosh-dns
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.boshDns.podLabels }}
        {{- toYaml .Values.boshDns.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/bosh-dns-config: {{ include (print $.Template.BasePath "/bosh-dns-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.boshDns.podAnnotations }}
        {{- toYaml .Values.boshDns.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: bosh-dns-adapter
          image: {{ .Values.boshDnsAdapter.image.repository }}:{{ default .Chart.AppVersion .Values.boshDnsAdapter.image.tag }}
          imagePullPolicy: {{ .Values.boshDnsAdapter.image.imagePullPolicy }}
          {{- if .Values.boshDnsAdapter.resources }}
          resources:
            {{- toYaml .Values.boshDnsAdapter.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.boshDnsAdapter.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: bosh-dns-adapter
              mountPath: /etc/ssl/certs/bosh-dns-adapter
            - name: bosh-dns-adapter-server-ca
              mountPath: /etc/ssl/certs/bosh-dns-adapter-server-ca
            - name: bosh-dns-config
              mountPath: /bosh-dns-adapter/bosh-dns-adapter.json
              subPath: bosh-dns-adapter.json
        - name: bosh-dns
          image: {{ .Values.boshDns.image.repository }}:{{ .Values.boshDns.image.tag }}
          imagePullPolicy: {{ .Values.boshDns.image.imagePullPolicy }}
          {{- if .Values.boshDns.resources }}
          resources:
            {{- toYaml .Values.boshDns.resources | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 53
              name: tcp
              protocol: TCP
            - containerPort: 53
              name: udp
              protocol: UDP
          volumeMounts:
            - name: bosh-dns
              mountPath: /etc/ssl/certs/bosh-dns
            - name: bosh-dns-config
              mountPath: /bosh-dns/bosh-dns.json
              subPath: bosh-dns.json
            - name: bosh-dns-config
              mountPath: /bosh-dns/handlers.json
              subPath: handlers.json
            - name: bosh-dns-config
              mountPath: /bosh-dns/records.json
              subPath: records.json
        - name: udp-forwarder
          image: {{ .Values.udpForwarder.image.repository }}:{{ .Values.udpForwarder.image.tag }}
          imagePullPolicy: {{ .Values.udpForwarder.image.imagePullPolicy }}
          {{- if .Values.udpForwarder.resources }}
          resources:
            {{- toYaml .Values.udpForwarder.resources | nindent 12 }}
          {{- end }}
          env:
            - name: UDP_PORT
              value: "3457"
            - name: LOGGREGATOR_AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: LOGGREGATOR_AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: LOGGREGATOR_AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
            - name: LOGGREGATOR_AGENT_ADDR
              value: "{{ tpl .Values.udpForwarder.metronEndpoint.host . }}:{{ .Values.udpForwarder.metronEndpoint.port }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
          volumeMounts:
            - name: udp-forwarder
              mountPath: /etc/ssl/certs/udp-forwarder
      {{- if .Values.boshDns.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.boshDns.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.boshDns.tolerations }}
      tolerations:
        {{- toYaml .Values.boshDns.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: bosh-dns-adapter
          secret:
            secretName: {{ required "boshDnsAdapter.certificateSecrets.clientTLS is required" .Values.boshDnsAdapter.certificateSecrets.clientTLS }}
        - name: bosh-dns-adapter-server-ca
          secret:
            secretName: {{ required "boshDnsAdapter.certificateSecrets.serverCA is required" .Values.boshDnsAdapter.certificateSecrets.serverCA }}
        - name: bosh-dns
          secret:
            secretName: {{ required "boshDns.certificateSecret is required" .Values.boshDns.certificateSecret }}
        - name: bosh-dns-config
          configMap:
            name: bosh-dns-config
        - name: udp-forwarder
          secret:
            secretName: {{ required "udpForwarder.certificateSecret is required" .Values.udpForwarder.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: bosh-dns
  {{- if or .Values.commonAnnotations .Values.boshDns.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.boshDns.serviceAnnotations }}
    {{- toYaml .Values.boshDns.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: bosh-dns
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.boshDns.serviceLabels }}
    {{- toYaml .Values.boshDns.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: 53
      targetPort: 53
      name: tcp
      protocol: TCP
    - port: 53
      targetPort: 53
      name: udp
      protocol: UDP
  selector:
    app.kubernetes.io/name: bosh-dns
{{- end }}
