{{- if .Values.policyServer.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: policy-server-route-registrar-config
  {{- if .Values.commonLabels }}
  labels:
    {{- toYaml .Values.commonLabels | nindent 4 }}
  {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
data:
  route-registrar.json: |-
    {
      "message_bus_servers": [
        {
          "host": "{{ tpl .Values.routeRegistrar.nats.address . }}"
        }
      ],
      "nats_mtls_config": {
        "enabled": true,
        "cert_path": "/etc/ssl/certs/route-registrar-nats/tls.crt",
        "key_path": "/etc/ssl/certs/route-registrar-nats/tls.key",
        "ca_path": "/etc/ssl/certs/route-registrar-nats/ca.crt"
      },
      "host": "",
      "routes": [
        {
          "name": "policy-server",
          "tls_port": {{ .Values.policyServer.listenPort }},
          "registration_interval": "20s",
          "server_cert_domain_san": "api.{{ .Values.policyServer.systemDomain }}",
          "uris": [
            "api.{{ .Values.policyServer.systemDomain }}/networking"
          ]
        }
      ]
    }
{{- end }}