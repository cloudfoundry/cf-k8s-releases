{{- if .Values.serviceDiscoveryController.enabled }}
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: service-discovery-controller
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: service-discovery-controller
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.serviceDiscoveryController.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: service-discovery-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-discovery-controller
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- if .Values.serviceDiscoveryController.podLabels }}
        {{- toYaml .Values.serviceDiscoveryController.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        checksum/service-discovery-controller-config: {{ include (print $.Template.BasePath "/service-discovery-controller-config.yaml") . | sha256sum }}
        {{- if .Values.commonAnnotations }}
        {{- toYaml .Values.commonAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.serviceDiscoveryController.podAnnotations }}
        {{- toYaml .Values.serviceDiscoveryController.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: service-discovery-controller
          image: {{ .Values.serviceDiscoveryController.image.repository }}:{{ default .Chart.AppVersion .Values.serviceDiscoveryController.image.tag }}
          imagePullPolicy: {{ .Values.serviceDiscoveryController.image.imagePullPolicy }}
          {{- if .Values.serviceDiscoveryController.resources }}
          resources:
            {{- toYaml .Values.serviceDiscoveryController.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: service-discovery-controller
              mountPath: /etc/ssl/certs/service-discovery-controller
            - name: client-ca
              mountPath: /etc/ssl/certs/service-discovery-controller-client-ca
            {{- if .Values.serviceDiscoveryController.nats.tlsEnabled }}
            - name: nats-certificate
              mountPath: /etc/ssl/certs/service-discovery-controller-nats
            {{- end }}
            - name: service-discovery-controller-config
              mountPath: /service-discovery-controller
        - name: udp-forwarder
          image: {{ .Values.udpForwarder.image.repository }}:{{ .Values.udpForwarder.image.tag }}
          imagePullPolicy: {{ .Values.udpForwarder.image.imagePullPolicy }}
          {{- if .Values.udpForwarder.resources }}
          resources:
            {{- toYaml .Values.udpForwarder.resources | nindent 12 }}
          {{- end }}
          env:
            - name: UDP_PORT
              value: "3457"
            - name: LOGGREGATOR_AGENT_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: LOGGREGATOR_AGENT_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: LOGGREGATOR_AGENT_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
            - name: LOGGREGATOR_AGENT_ADDR
              value: "{{ tpl .Values.udpForwarder.metronEndpoint.host . }}:{{ .Values.udpForwarder.metronEndpoint.port }}"
            - name: METRICS_CA_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/ca.crt
            - name: METRICS_CERT_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.crt
            - name: METRICS_KEY_FILE_PATH
              value: /etc/ssl/certs/udp-forwarder/tls.key
          volumeMounts:
            - name: udp-forwarder
              mountPath: /etc/ssl/certs/udp-forwarder
      {{- if .Values.serviceDiscoveryController.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.serviceDiscoveryController.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceDiscoveryController.tolerations }}
      tolerations:
        {{- toYaml .Values.serviceDiscoveryController.tolerations | nindent 8 }}
      {{- end }}
      volumes:
        - name: service-discovery-controller
          secret:
            secretName: {{ required "serviceDiscoveryController.certificateSecrets.serverTLS is required" .Values.serviceDiscoveryController.certificateSecrets.serverTLS }}
        - name: client-ca
          secret:
            secretName: {{ required "serviceDiscoveryController.certificateSecrets.clientCA is required" .Values.serviceDiscoveryController.certificateSecrets.clientCA | quote }}
        {{- if .Values.serviceDiscoveryController.nats.tlsEnabled }}
        - name: nats-certificate
          secret:
            secretName: {{ required "serviceDiscoveryController.certificateSecrets.natsTLS is required when serviceDiscoveryController.nats.tlsEnabled is true" .Values.serviceDiscoveryController.certificateSecrets.natsTLS | quote }}
        {{- end }}
        - name: service-discovery-controller-config
          secret:
            secretName: service-discovery-controller-config
        - name: udp-forwarder
          secret:
            secretName: {{ required "udpForwarder.certificateSecret is required" .Values.udpForwarder.certificateSecret }}
---
kind: Service
apiVersion: v1
metadata:
  name: service-discovery-controller
  {{- if or .Values.commonAnnotations .Values.serviceDiscoveryController.serviceAnnotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.serviceDiscoveryController.serviceAnnotations }}
    {{- toYaml .Values.serviceDiscoveryController.serviceAnnotations | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    app.kubernetes.io/name: service-discovery-controller
    {{- if .Values.commonLabels }}
    {{- toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.serviceDiscoveryController.serviceLabels }}
    {{- toYaml .Values.serviceDiscoveryController.serviceLabels | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: {{ .Values.serviceDiscoveryController.port }}
      targetPort: {{ .Values.serviceDiscoveryController.port }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: service-discovery-controller
{{- end }}
