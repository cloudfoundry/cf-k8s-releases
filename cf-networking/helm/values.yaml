policyServer:
  enabled: false
  replicas: 1
  resources: ~
  certificateSecrets:
    serverTLS: ""
    internalTLS: ""
    uaaCA: ""
    ccCA: ""
    ccInternalTLS: ""
    locketTLS: ""
    databaseCA: ""
  internal:
    debugPort: 31945
    listenPort: 4003
    healthCheckPort: 31946
    healthCheckTimeoutSeconds: 5
  asgSyncer:
    locketAddress: locket.{{ .Release.Namespace }}.svc.cluster.local:8891
  systemDomain: cf.127-0-0-1.nip.io
  image:
    repository: ghcr.io/cloudfoundry/k8s/policy-server
    tag: ""
    imagePullPolicy: IfNotPresent
  uaaClientSecret: ""
  logLevel: info
  listenIp: "0.0.0.0"
  listenPort: 4002
  debugPort: 31821
  metronPort: 3457
  uaaClient: network-policy
  uaaHostname: uaa.{{ .Release.Namespace }}.svc.cluster.local
  uaaPort: 8443
  ccHostname: cloud-controller.{{ .Release.Namespace }}.svc.cluster.local
  skipSSLValidation: false
  enableSpaceDeveloperSelfService: true
  enableTls: true
  tagLength: 2
  policyCleanupInterval: 60
  maxPoliciesPerAppSource: 150
  allowedCorsDomains: []
  asgPollIntervalSeconds: 60
  retryDeadlineSeconds: 300
  maxOpenConnections: 200
  maxIdleConnections: 10
  connectionsMaxLifetimeSeconds: 3600
  database:
    type: postgres
    name: network_policy
    password: ~
    username: postgres
    port: 5432
    host: postgresql.{{ .Release.Namespace }}.svc.cluster.local
    requireSSL: false
    skipHostnameValidation: false
    connectTimeoutSeconds: 120
  nodeSelector: ~
  tolerations: ~
serviceDiscoveryController:
  enabled: false
  replicas: 1
  resources: ~
  certificateSecrets:
    serverTLS: ""
    clientCA: ""
    natsTLS: ""
  hostname: service-discovery-controller.{{ .Release.Namespace }}.svc.cluster.local
  address: "0.0.0.0"
  port: 8054
  logLevelAddress: "127.0.0.1"
  logLevelPort: 8055
  metronPort: 3457
  stalenessThresholdSeconds: 180
  routeEmitterIntervalSeconds: 60
  readHeaderTimeout: "30s"
  image:
    repository: ghcr.io/cloudfoundry/k8s/service-discovery-controller
    tag: ""
    imagePullPolicy: IfNotPresent
  nats:
    machines:
      - nats.{{ .Release.Namespace }}.svc.cluster.local
    port: 4222
    user: ""
    password: ""
    tlsEnabled: false
  nodeSelector: ~
  tolerations: ~
boshDnsAdapter:
  enabled: false
  # BOSH binds loopback; 0.0.0.0 lets the kubelet reach /health for the liveness probe
  address: "0.0.0.0"
  port: 8053
  metronPort: 3457
  logLevelAddress: "127.0.0.1"
  logLevelPort: 8066
  resources: ~
  certificateSecrets:
    clientTLS: ""
    serverCA: ""
  internalDomains: []
  internalServiceMeshDomains: []
  image:
    repository: ghcr.io/cloudfoundry/k8s/bosh-dns-adapter
    tag: ""
    imagePullPolicy: IfNotPresent
boshDns:
  replicas: 1
  resources: ~
  certificateSecret: ""
  image:
    repository: ghcr.io/cloudfoundry/k8s/bosh-dns
    # renovate: dataSource=github-releases depName=cloudfoundry/bosh-dns-release
    tag: "1.39.32"
    imagePullPolicy: IfNotPresent
  nodeSelector: ~
  tolerations: ~
udpForwarder:
  certificateSecret: ""
  image:
    repository: ghcr.io/cloudfoundry/k8s/udp-forwarder
    # renovate: dataSource=github-releases depName=cloudfoundry/loggregator-agent-release
    tag: "8.3.30"
    imagePullPolicy: IfNotPresent
  resources: ~
routeRegistrar:
  resources: ~
  certificateSecret: ""
  nats:
    address: nats.{{ .Release.Namespace }}.svc.cluster.local:4222
  image:
    repository: ghcr.io/cloudfoundry/k8s/route-registrar
    # renovate: dataSource=github-releases depName=cloudfoundry/routing-release
    tag: "0.397.0"
    imagePullPolicy: IfNotPresent
