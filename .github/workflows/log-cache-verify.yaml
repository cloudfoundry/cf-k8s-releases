name: Verify Log Cache

on:
  pull_request:
    branches:
      - main

jobs:
  log-cache-verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: check changes
        uses: dorny/paths-filter@v4
        id: check
        with:
          filters: |
            should_run:
              - 'log-cache/**'
              - '.github/workflows/log-cache-verify.yaml'
              - '.github/actions/**'
      - uses: ./.github/actions/init
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build logcache images
        if: steps.check.outputs.should_run == 'true'
        working-directory: log-cache
        run: docker buildx bake --load
      - name: Build route-registrar image
        if: steps.check.outputs.should_run == 'true'
        working-directory: routing
        run: docker buildx bake route-registrar --load
      - name: Use images
        if: steps.check.outputs.should_run == 'true'
        working-directory: log-cache
        run: |
          yq -e -i '.logCacheApi.cfAuthProxy.image.repository = "cf-auth-proxy" | .logCacheApi.cfAuthProxy.image.tag = "latest"' helm/values.yaml
          yq -e -i '.logCacheApi.gateway.image.repository = "gateway" | .logCacheApi.gateway.image.tag = "latest"' helm/values.yaml
          yq -e -i '.logCacheBackend.syslogServer.image.repository = "syslog-server" | .logCacheBackend.syslogServer.image.tag = "latest"' helm/values.yaml
          yq -e -i '.logCacheBackend.logCache.image.repository = "log-cache" | .logCacheBackend.logCache.image.tag = "latest"' helm/values.yaml
          yq -e -i '.routeRegistrar.image.repository = "route-registrar" | .routeRegistrar.image.tag = "latest"' helm/values.yaml

          cat >> ${{ github.workspace }}/state-values.yaml <<EOF
          charts:
            logCache:
              url: ../log-cache/helm
          EOF
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          load-images: "cf-auth-proxy:latest,gateway:latest,syslog-server:latest,log-cache:latest,route-registrar:latest"
          additional-values-files: "${{ github.workspace }}/state-values.yaml"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
        if: steps.check.outputs.should_run == 'true'
        with:
          test-repo: cf-smoke-tests
          test-branch: main
          config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
          config-output: ${{ github.workspace }}/.github/smoke-config.json
      - name: run smoke test
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
          GINKGO_NO_COLOR: "true"
        run: |
          ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
