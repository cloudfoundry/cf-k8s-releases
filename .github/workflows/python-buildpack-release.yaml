name: Release Python Buildpack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - python-buildpack/docker-bake.hcl

jobs:
  python-buildpack-release:
    uses: ./.github/workflows/reusable-matrix-image-build.yaml
    with:
      dir: python-buildpack
      target: default
