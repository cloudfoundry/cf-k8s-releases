name: Verify Diego

on:
  pull_request:
    branches:
      - main

jobs:
  diego-verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: check changes
        uses: dorny/paths-filter@v4
        id: check
        with:
          filters: |
            should_run:
              - 'diego/**'
              - '.github/workflows/diego-verify.yaml'
              - '.github/actions/**'
      - uses: ./.github/actions/init
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Images
        if: steps.check.outputs.should_run == 'true'
        working-directory: diego
        run: docker buildx bake --load
      - name: Use images
        if: steps.check.outputs.should_run == 'true'
        working-directory: diego
        run: |
          yq -e -i '.auctioneer.image.repository = "auctioneer" | .auctioneer.image.tag = "latest"' helm/values.yaml
          yq -e -i '.bbs.image.repository = "bbs" | .bbs.image.tag = "latest"' helm/values.yaml
          yq -e -i '.locket.image.repository = "locket" | .locket.image.tag = "latest"' helm/values.yaml
          yq -e -i '.sshProxy.image.repository = "ssh-proxy" | .sshProxy.image.tag = "latest"' helm/values.yaml
          yq -e -i '.routeEmitter.image.repository = "route-emitter" | .routeEmitter.image.tag = "latest"' helm/values.yaml
          yq -e -i '.fileserver.image.repository = "fileserver" | .fileserver.image.tag = "latest"' helm/values.yaml
          yq -e -i '.rep.image.repository = "rep" | .rep.image.tag = "latest"' helm/values.yaml

          cat >> ${{ github.workspace }}/state-values.yaml <<EOF
          charts:
            diego:
              url: ../diego/helm
          EOF
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          load-images: "auctioneer:latest,bbs:latest,locket:latest,ssh-proxy:latest,route-emitter:latest,fileserver:latest,rep:latest"
          additional-values-files: "${{ github.workspace }}/state-values.yaml"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
        if: steps.check.outputs.should_run == 'true'
        with:
          test-repo: cf-smoke-tests
          test-branch: main
          config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
          config-output: ${{ github.workspace }}/.github/smoke-config.json
      - name: run smoke test
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
          GINKGO_NO_COLOR: "true"
        run: |
          ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
