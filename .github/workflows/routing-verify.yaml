name: Verify Routing

on:
  pull_request:
    branches:
      - main

jobs:
  routing-verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: check changes
        uses: dorny/paths-filter@v4
        id: check
        with:
          filters: |
            should_run:
              - 'routing/**'
              - '.github/workflows/routing-verify.yaml'
              - '.github/actions/**'
      - uses: ./.github/actions/init
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build routing images
        if: steps.check.outputs.should_run == 'true'
        working-directory: routing
        run: docker buildx bake --load
      - name: Build udp-forwarder image
        if: steps.check.outputs.should_run == 'true'
        working-directory: loggregator-agent
        run: docker buildx bake udp-forwarder --load
      - name: Use images
        if: steps.check.outputs.should_run == 'true'
        working-directory: routing
        run: |
          yq -e -i '.gorouter.image.repository = "gorouter" | .gorouter.image.tag = "latest"' helm/values.yaml
          yq -e -i '.routingApi.image.repository = "routing-api" | .routingApi.image.tag = "latest"' helm/values.yaml
          yq -e -i '.tcpRouter.image.repository = "cf-tcp-router" | .tcpRouter.image.tag = "latest"' helm/values.yaml
          yq -e -i '.routeRegistrar.image.repository = "route-registrar" | .routeRegistrar.image.tag = "latest"' helm/values.yaml
          yq -e -i '.udpForwarder.image.repository = "udp-forwarder" | .udpForwarder.image.tag = "latest"' helm/values.yaml

          cat >> ${{ github.workspace }}/state-values.yaml <<EOF
          charts:
            routing:
              url: ../routing/helm
          EOF
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          install-optional-components: "true"
          load-images: "gorouter:latest,routing-api:latest,cf-tcp-router:latest,route-registrar:latest,udp-forwarder:latest"
          additional-values-files: "${{ github.workspace }}/state-values.yaml"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
        if: steps.check.outputs.should_run == 'true'
        with:
          test-repo: cf-smoke-tests
          test-branch: main
          config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
          config-output: ${{ github.workspace }}/.github/smoke-config.json
      - name: run smoke test
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
          GINKGO_NO_COLOR: "true"
        run: |
          ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
