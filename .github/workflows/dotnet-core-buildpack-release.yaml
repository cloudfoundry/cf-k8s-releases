name: Release dotnet-core Buildpack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - dotnet-core-buildpack/docker-bake.hcl

jobs:
  dotnet-core-buildpack-release:
    uses: ./.github/workflows/reusable-matrix-image-build.yaml
    with:
      dir: dotnet-core-buildpack
      target: default
