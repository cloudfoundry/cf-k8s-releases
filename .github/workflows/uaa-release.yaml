name: Release UAA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - uaa/helm/Chart.yaml
      
env:
  HELM_REGISTRY_PREFIX: ghcr.io/cloudfoundry/helm/

jobs:
  uaa-image-release:
    uses: ./.github/workflows/reusable-matrix-image-build.yaml
    with:
      dir: uaa
      target: default
  uaa-helm-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Helm Chart
        working-directory: uaa
        run: |
          CHART_VERSION=$(yq e '.version' helm/Chart.yaml)

          # Check if chart available
          if helm show chart oci://${HELM_REGISTRY_PREFIX}uaa --version $CHART_VERSION > /dev/null 2>&1; then
             echo "Helm chart already exists in version $CHART_VERSION."
          else
            helm package ./helm -d ${{ runner.temp }}
            helm push ${{ runner.temp }}/uaa-*.tgz oci://${HELM_REGISTRY_PREFIX}
          fi
