name: Verify Loggregator

on:
  pull_request:
    branches:
      - main

jobs:
  loggregator-verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: check changes
        uses: dorny/paths-filter@v4
        id: check
        with:
          filters: |
            should_run:
              - 'loggregator/**'
              - '.github/workflows/loggregator-verify.yaml'
              - '.github/actions/**'
      - uses: ./.github/actions/init
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Images
        if: steps.check.outputs.should_run == 'true'
        working-directory: loggregator
        run: docker buildx bake --load
      - name: Build route-registrar image
        if: steps.check.outputs.should_run == 'true'
        working-directory: routing
        run: docker buildx bake route-registrar --load
      - name: Use images
        id: imgs
        if: steps.check.outputs.should_run == 'true'
        working-directory: loggregator
        run: |
          yq -e -i '.doppler.image.repository = "doppler"' helm/values.yaml
          yq -e -i '.reverseLogProxy.image.repository = "reverse-log-proxy"' helm/values.yaml
          yq -e -i '.reverseLogProxyGateway.image.repository = "reverse-log-proxy-gateway"' helm/values.yaml
          yq -e -i '.trafficcontroller.image.repository = "traffic-controller"' helm/values.yaml
          yq -e -i '.routeRegistrar.image.repository = "route-registrar"' helm/values.yaml

          cat >> ${{ github.workspace }}/state-values.yaml <<EOF
          charts:
            loggregator:
              url: ../loggregator/helm
          EOF

          list=$(docker buildx bake --print | jq -r '[.target[].tags[]] | join(",")')
          list="$list,$(cd "$GITHUB_WORKSPACE/routing" && docker buildx bake route-registrar --print | jq -r '[.target[].tags[]] | join(",")')"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          install-optional-components: "true"
          load-images: "${{ steps.imgs.outputs.list }}"
          additional-values-files: "${{ github.workspace }}/state-values.yaml"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
        if: steps.check.outputs.should_run == 'true'
        with:
          test-repo: cf-smoke-tests
          test-branch: main
          config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
          config-output: ${{ github.workspace }}/.github/smoke-config.json
      - name: run smoke test
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
          GINKGO_NO_COLOR: "true"
        run: |
          ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
