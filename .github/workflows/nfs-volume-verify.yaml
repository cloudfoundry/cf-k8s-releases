name: Verify NFS Volume

on:
  pull_request:
    branches:
      - main

jobs:
  nfs-volume-verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: check changes
        uses: dorny/paths-filter@v4
        id: check
        with:
          filters: |
            should_run:
              - 'nfs-volume/**'
              - '.github/workflows/nfs-volume-verify.yaml'
              - '.github/actions/**'
      - uses: ./.github/actions/init
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Images
        if: steps.check.outputs.should_run == 'true'
        working-directory: nfs-volume
        run: docker buildx bake --load
      - name: Use images
        if: steps.check.outputs.should_run == 'true'
        working-directory: nfs-volume
        run: |
          yq -e -i '.nfsbroker.image.repository = "nfsbroker" | .nfsbroker.image.tag = "latest"' helm/values.yaml
          yq -e -i '.nfsv3driver.image.repository = "nfsv3driver" | .nfsv3driver.image.tag = "latest"' helm/values.yaml

          cat >> ${{ github.workspace }}/state-values.yaml <<EOF
          charts:
            nfsVolume:
              url: ../nfs-volume/helm
          EOF
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          install-optional-components: "true"
          load-images: "nfsbroker:latest,nfsv3driver:latest"
          additional-values-files: "${{ github.workspace }}/state-values.yaml"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
        if: steps.check.outputs.should_run == 'true'
        with:
          test-repo: cf-smoke-tests
          test-branch: main
          config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
          config-output: ${{ github.workspace }}/.github/smoke-config.json
      - name: run smoke test
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
          GINKGO_NO_COLOR: "true"
        run: |
          ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
