name: Release Node.js Buildpack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - nodejs-buildpack/docker-bake.hcl

jobs:
  nodejs-buildpack-release:
    uses: ./.github/workflows/reusable-matrix-image-build.yaml
    with:
      dir: nodejs-buildpack
      target: default
