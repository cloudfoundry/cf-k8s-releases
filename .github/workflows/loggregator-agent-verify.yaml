name: Verify Loggregator Agent

on:
  pull_request:
    branches:
      - main

jobs:
  loggregator-agent-verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: check changes
        uses: dorny/paths-filter@v4
        id: check
        with:
          filters: |
            should_run:
              - 'loggregator-agent/**'
              - '.github/workflows/loggregator-agent-verify.yaml'
              - '.github/actions/**'
      - uses: ./.github/actions/init
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Images
        if: steps.check.outputs.should_run == 'true'
        working-directory: loggregator-agent
        run: docker buildx bake --load
      - name: Use images
        id: imgs
        if: steps.check.outputs.should_run == 'true'
        working-directory: loggregator-agent
        run: |
          yq -e -i '.forwarderAgent.image.repository = "forwarder-agent"' helm/values.yaml
          yq -e -i '.loggregatorAgent.image.repository = "loggregator-agent"' helm/values.yaml
          yq -e -i '.syslogAgent.image.repository = "syslog-agent"' helm/values.yaml
          yq -e -i '.syslogBindingCache.image.repository = "syslog-binding-cache"' helm/values.yaml

          cat >> ${{ github.workspace }}/state-values.yaml <<EOF
          charts:
            loggregatorAgent:
              url: ../loggregator-agent/helm
          EOF

          echo "list=$(docker buildx bake --print | jq -r '[.target[].tags[]] | join(",")')" >> "$GITHUB_OUTPUT"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          load-images: "${{ steps.imgs.outputs.list }}"
          additional-values-files: "${{ github.workspace }}/state-values.yaml"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
        if: steps.check.outputs.should_run == 'true'
        with:
          test-repo: cf-smoke-tests
          test-branch: main
          config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
          config-output: ${{ github.workspace }}/.github/smoke-config.json
      - name: run smoke test
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
          GINKGO_NO_COLOR: "true"
        run: |
          ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
