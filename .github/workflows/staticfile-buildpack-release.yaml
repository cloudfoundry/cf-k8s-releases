name: Release Staticfile Buildpack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - staticfile-buildpack/docker-bake.hcl

jobs:
  staticfile-buildpack-release:
    uses: ./.github/workflows/reusable-matrix-image-build.yaml
    with:
      dir: staticfile-buildpack
      target: default
