name: Verify CF-Networking

on:
  pull_request:
    branches:
      - main

jobs:
  cf-networking-verify:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: check changes
        uses: dorny/paths-filter@v4
        id: check
        with:
          filters: |
            should_run:
              - 'cf-networking/**'
              - '.github/workflows/cf-networking-verify.yaml'
              - '.github/actions/**'
      - uses: ./.github/actions/init
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cf-networking images
        if: steps.check.outputs.should_run == 'true'
        working-directory: cf-networking
        run: docker buildx bake --load
      - name: Build route-registrar image
        if: steps.check.outputs.should_run == 'true'
        working-directory: routing
        run: docker buildx bake route-registrar --load
      - name: Build bosh-dns image
        if: steps.check.outputs.should_run == 'true'
        working-directory: bosh-dns
        run: docker buildx bake bosh-dns --load
      - name: Use images
        if: steps.check.outputs.should_run == 'true'
        working-directory: cf-networking
        run: |
          yq -e -i '.policyServer.image.repository = "policy-server" | .policyServer.image.tag = "latest"' helm/values.yaml
          yq -e -i '.serviceDiscoveryController.image.repository = "service-discovery-controller" | .serviceDiscoveryController.image.tag = "latest"' helm/values.yaml
          yq -e -i '.boshDnsAdapter.image.repository = "bosh-dns-adapter" | .boshDnsAdapter.image.tag = "latest"' helm/values.yaml
          yq -e -i '.routeRegistrar.image.repository = "route-registrar" | .routeRegistrar.image.tag = "latest"' helm/values.yaml
          yq -e -i '.boshDns.image.repository = "bosh-dns" | .boshDns.image.tag = "latest"' helm/values.yaml

          cat >> ${{ github.workspace }}/state-values.yaml <<EOF
          charts:
            cfNetworking:
              url: ../cf-networking/helm
          EOF
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf@main
        if: steps.check.outputs.should_run == 'true'
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          install-optional-components: "true"
          load-images: "policy-server:latest,service-discovery-controller:latest,bosh-dns-adapter:latest,route-registrar:latest,bosh-dns:latest"
          additional-values-files: "${{ github.workspace }}/state-values.yaml"
      - uses: cloudfoundry/kind-deployment/.github/actions/setup-cf-tests@main
        if: steps.check.outputs.should_run == 'true'
        with:
          test-repo: cf-smoke-tests
          test-branch: main
          config-template: ${{ github.workspace }}/kind-deployment/.github/smoke-config.tpl
          config-output: ${{ github.workspace }}/.github/smoke-config.json
      - name: run smoke test
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG: "${{ github.workspace }}/.github/smoke-config.json"
          GINKGO_NO_COLOR: "true"
        run: |
          ./cf-smoke-tests/bin/test --no-color --github-output --timeout=30m --procs=4 --json-report report.json
